name: Weekly Documentation Audit

on:
  schedule:
    # Runs every Monday at 9:00 AM Pacific (PDT: UTC-7, PST: UTC-8)
    # Using 4:00 PM UTC which is 9:00 AM PDT (summer) / 8:00 AM PST (winter)
    - cron: "7 16 * * 1"  # off the top-of-hour (GH Actions congestion; Docs 2026-08-03 no-fire finding)
  workflow_dispatch: # Allows manual trigger for testing

permissions:
  issues: write
  contents: read

jobs:
  create-audit-issue:
    runs-on: ubuntu-latest
    name: Create Weekly Documentation Audit Issue

    steps:
      - name: Check for existing audit issue
        id: check-existing
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `FLY-AUDIT: Weekly Docs Audit - ${today}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation,maintenance'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Weekly Docs Audit') &&
              issue.title.includes(today)
            );

            if (existingIssue) {
              console.log(`Audit issue already exists: #${existingIssue.number}`);
              return existingIssue.number;
            }
            return null;

      - name: Create documentation audit issue
        if: steps.check-existing.outputs.result == 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const dayOfWeek = new Date().toLocaleDateString('en-US', { weekday: 'long' });

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `FLY-AUDIT: Weekly Docs Audit - ${today}`,
              body: `## Weekly Documentation Audit Checklist

              **Generated**: ${dayOfWeek}, ${today}

              ### 🗺️ **IMPORTANT: File Location Reference**

              **Before reporting any file as "missing", consult [docs/NAVIGATION.md](../docs/NAVIGATION.md) for actual locations.**

              **Common File Locations** (not in project root):
              - **roadmap.md**: \`docs/internal/planning/roadmap/roadmap.md\`
              - **Pattern catalog**: \`docs/internal/architecture/current/patterns/README.md\`
              - **ADRs**: \`docs/internal/architecture/current/adrs/\`
              - **Session logs**: \`dev/YYYY/MM/DD/\` structure (never delete, historical value)
              - **User config**: \`config/PIPER.md\` (generic), \`config/PIPER.user.md\` (user-specific)

              **Agent instructions**:
              1. Read docs/NAVIGATION.md FIRST before searching for files
              2. Use NAVIGATION.md as source of truth for directory structure
              3. Only report files as "missing" if not found at documented location
              4. Document actual location if found elsewhere

              ### 📚 Briefing Freshness (PRIORITY)

              > **Retired 2026-06-02 (#1141)**: the former "Claude Project Knowledge Updates" section is gone — no roles use chat project knowledge as a primary surface since 2026-05-04 (maintained at "bare essentials" only). Rescoped here to BRIEFING-CURRENT-STATE freshness, which is still load-bearing.

              - [ ] List docs modified this week (context): \`git log --since="1 week ago" --name-only --pretty=format: | grep "\\.md$" | sort -u\`
              - [ ] **BRIEFING-CURRENT-STATE refresh** (PRIORITY): Verify \`docs/briefing/BRIEFING-CURRENT-STATE.md\` reflects:
                - Current sprint/epic position
                - Recent progress summary (issues closed, tests added)
                - Updated metrics snapshot (pattern count, ADR count, test suite size)
                - Current open items and blockers
                - Last Updated timestamp matches audit date
                - **Note**: goes stale quickly during high-velocity sprints — refresh weekly minimum
                - **Caveat**: the SessionStart hook's staleness flag keys off a date-field quirk and can over-report (e.g. "14 days" when the banner is 2 days old) — trust the in-file STATUS BANNER date, not the hook

              ### 🔍 Automated Audits (subagent or manual verification)

              **Note**: Use the Agent tool (subagents) for these, or do manual verification — both are acceptable as long as evidence is provided. The \`/agent\` form below is a prompt shorthand, not a slash command; rewrite as an Agent tool call when executing.

              - [ ] Subagent: "Audit docs/ for stale content older than 30 days — list files with last-modified dates, flag anything claiming current state that is >30 days old"
              - [ ] Subagent: "Find duplicate files in docs/ and list consolidation opportunities — look for same-named or near-identical files across directories"
              - [ ] Subagent: "Check for broken links in docs/**/*.md — internal links to files that no longer exist at the referenced path"
              - [ ] Subagent: "Verify cross-references between methodology files in docs/internal/development/methodology-core/ — every cross-reference should resolve"
              - [ ] Subagent: "Check for missing cross-references between docs/NAVIGATION.md and docs/internal/development/methodology-core/INDEX.md"
              - [ ] Subagent: "Verify briefing documents completeness in docs/briefing/ — check all role briefings exist per ROSTER.md"
              - [ ] Subagent: "Check omnibus logs structure in docs/omnibus-logs/ — verify continuous coverage, no gaps >2 days"

              ### 🔗 Link Integrity Checking (NEW - Feb 2026)

              **Purpose**: Prevent broken internal links (discovered via Ted Nadeau feedback on ADR-042).

              **Priority files** (check these first - high-reference documents):
              - [ ] ADRs: \`docs/internal/architecture/current/adrs/adr-*.md\`
              - [ ] Patterns: \`docs/internal/architecture/current/patterns/pattern-*.md\`
              - [ ] Briefings: \`docs/briefing/*.md\`

              **Link types to verify**:
              1. **Internal doc references** (\`../path/to/file.md\`) - Must exist at referenced location
              2. **Code file references** (\`services/foo/bar.py\`) - Should exist OR be clearly marked as "proposed/planned"
              3. **ADR/Pattern cross-refs** (\`adr-XXX\`, \`pattern-XXX\`) - Must resolve to actual files

              **Quick audit command** (portable — macOS + Linux; replaces the prior \`realpath --relative-to\` form, which is GNU-only and gave false positives on macOS — #1140 saw 17 false "broken" when the true count was 0):
              \`\`\`bash
              python3 -c "import os,re,glob; B=[(os.path.basename(f),L) for f in glob.glob('docs/internal/architecture/current/adrs/*.md') for L in re.findall(r'\\]\\((\\.{1,2}/[^)]+\\.md)\\)', open(f).read()) if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f),L)))]; print('broken ADR links:', len(B)); [print('  BROKEN:', L, 'in', f) for f,L in B]"
              \`\`\`

              **If broken links found**:
              1. Document in findings (file, line number, broken link)
              2. Categorize: file moved, file deleted, file never existed, or hallucinated
              3. Fix obvious cases (moved files → update link)
              4. Create issue for complex cases

              **Target**: <10 broken internal links in priority files

              ### 📁 Omnibus Coverage Check

              - [ ] Review \`docs/omnibus-logs/\` — is there an omnibus for each day with 2+ agent sessions in the past week?
              - [ ] Verify no stranded session logs outside \`dev/\` directory structure (spot-check \`dev/active/\`)
              - [ ] Note: Infrastructure verification, dev/active cleanup, and metrics are in the **Monthly Housekeeping Audit** (FLY-AUDIT Monthly — separate issue, first Monday of month)

              ### 🕰️ Doc Currency Check (added 2026-07-31)

              **Why this is here**: \`scripts/check-staleness.py\` has existed and worked correctly for weeks, is correctly configured, and **was invoked by nothing** — Arch found this 2026-07-30 while refreshing a portfolio that had been stale 40 days under its own weekly-refresh rule. The detector was never broken. **It had no consumer.** This section is the consumer.

              - [ ] Run the detector and record the **ratio**, not the list:
              \`\`\`bash
              python3 scripts/check-staleness.py | tail -3
              \`\`\`

              - [ ] **Report as "N of M"**, never as a list of filenames. A list reads as a chore queue; the ratio reads as a systemic finding. (Arch's framing, and it is what made the original discovery land: *"33 of 36"* rather than 33 paths.)

              - [ ] ⚠️ **Check whether \`last_verified\` values are CLUSTERED on a single date.** If most stale docs share one identical stamp, that is a **bulk stamp, not N verifications** — the field is recording one past operation rather than currency, and *adoption* has been mistaken for *currency*. Measured 2026-07-30: **all 31 stale docs carried the identical \`last_verified\` of 2026-06-19.**
              \`\`\`bash
              grep -rh "^last_verified:" docs/briefing/*.md docs/agent-protocols/*.md 2>/dev/null | sort | uniq -c | sort -rn | head -5
              \`\`\`

              - [ ] **Only stamp \`last_verified\` on a doc you actually verified.** Bumping the date without re-reading the claims is what produced the cluster above, and it converts a staleness detector into a false-clear generator.

              - [ ] If any **essential briefing** or **role portfolio** is stale, note it — those are the docs new agents orient from, and a systemic failure there presents to each role as an individual lapse. **All ten portfolios and every \`BRIEFING-ESSENTIAL-*\` were stale simultaneously on 2026-07-30**, which is how we know the weekly-refresh rule had never operated for any role.

              **Target**: the ratio is *reported* every week (the number itself is a cohort-wide matter, not the auditor's to fix alone). Docs-owned surfaces — \`BRIEFING-ESSENTIAL-DOCS.md\`, \`ROLE-PORTFOLIO-DOCS.md\` — should be current; others' get flagged to their owners, not silently refreshed.

              ### 🎯 Sprint & Roadmap Alignment

              - [ ] **Verify roadmap.md location** (common error):
                - Location: \`docs/internal/planning/roadmap/roadmap.md\` (NOT project root)
                - Check last update: \`git log -1 --format="%ai" -- docs/internal/planning/roadmap/roadmap.md\`
                - If not found, consult docs/NAVIGATION.md before reporting as missing
              - [ ] Update roadmap.md with completed items from current sprint
              - [ ] **Note**: backlog.md deprecated (moved to trash) - GitHub is source of truth
              - [ ] **Note**: completed.md deprecated - GitHub is source of truth
              - [ ] Check for open issues without milestone assignment
              - [ ] Update sprint goals in config/PIPER.user.md if new sprint started
                - **Note**: \`config/PIPER.md\` = generic system config (always exists)
                - **Note**: \`config/PIPER.user.md\` = user-specific config (may not exist if using database config)
                - These are TWO DIFFERENT FILES with different purposes

              ### 📊 GitHub Issues Sync

              - [ ] Run: \`gh issue list --state all --json number,title,state,labels --limit 200 > docs/planning/pm-issues-status.json\`
              - [ ] Verify open issues have milestone assignment (TRACK-EPIC convention retired Apr 7, 2026)
              - [ ] **Note**: backlog.md deprecated - use GitHub Projects for planning
              - [ ] Identify stale issues (no activity >30 days)
              - [ ] **Note**: CSV generation deprecated - GitHub is source of truth

              ### 📚 Pattern & Knowledge Capture

              - [ ] Update docs/internal/architecture/current/patterns/README.md with:
                - [ ] New patterns discovered this week (74 patterns as of Jun 2026 — verify current count via \`wc -l\`)
                - [ ] Check \`docs/internal/architecture/current/patterns/README.md\` for current count
                - [ ] Verify README.md count matches actual pattern-*.md files in directory
                - [ ] Update README.md if new patterns (050+) not yet documented
                - [ ] Core Architecture Patterns (infrastructure/error handling)
                - [ ] Data & Query Patterns (sessions/queries)
                - [ ] AI & Intelligence Patterns (LLM/spatial/intent/multi-agent)
                - [ ] Integration & Platform Patterns (config/CLI/plugins)
                - [ ] Development & Process Patterns (methodology/workflow)
              - [ ] **Verify pattern count accuracy**:
                - Run: \`ls -1 docs/internal/architecture/current/patterns/pattern-*.md | wc -l\`
                - Compare actual file count to README.md documented count
                - Investigate discrepancy if counts don't match
                - Update README.md to document any undocumented patterns
                - Common cause: Recent pattern sweep work may add patterns without updating README
              - [ ] Review session logs for patterns to document
              - [ ] Check for methodology improvements to capture
              - [ ] **Review CITATIONS.md (docs/references/CITATIONS.md) for completeness**:
                - [ ] Verify all architectural patterns have proper attribution (DDD, MCP, spatial intelligence)
                - [ ] Verify all tooling decisions are attributed (Serena workflow, etc.)
                - [ ] Only credit unique additions as our own
                - [ ] Note any unclear attributions to ask PM
              - [ ] Verify template directories are current and organized:
                - [ ] \`docs/internal/development/tools/session-log-templates/\`
                - [ ] \`docs/internal/planning/current/templates/\`
                - [ ] \`docs/internal/development/methodology-core/\` (multi-agent templates)

              ### 🎯 Quality Checks

              - [ ] Verify methodology files are in \`docs/internal/development/methodology-core/\` (not scattered)
              - [ ] Ensure all ADRs are in \`docs/internal/architecture/current/adrs/\` with proper numbering
              - [ ] Check that no backup files (\`*.backup\`, \`*.old\`) are in active directories
              - [ ] Verify no test files in production directories
              - [ ] Check for TODO/FIXME comments: \`grep -r "TODO\\|FIXME" services/ web/ cli/\`
              - [ ] **Review root README.md (repository view)** - Agent should perform review:
                - [ ] Check for outdated "new" claims (>2 weeks old features should not say "NEW:")
                - [ ] Verify external links are current and working (especially pmorgan.tech)
                - [ ] Ensure code examples are still accurate
                - [ ] Check setup instructions match current process (PIPER.user.md vs database config)
                - [ ] Ensure content is brief and evergreen
                - [ ] Remove any accidental test content or markdown artifacts
                - [ ] **Create review document**: Save findings to \`dev/YYYY/MM/DD/root-readme-review.md\`
                - [ ] Note: This is separate from docs/README.md (pmorgan.tech homepage)
              - [ ] **Review docs/README.md (pmorgan.tech homepage)** — distinct from the GitHub-view root README:
                - [ ] Verify current version number matches \`pyproject.toml\`
                - [ ] Verify current capabilities list is accurate (no deprecated features, no missing shipped features)
                - [ ] Check linked docs (ALPHA_QUICKSTART.md, ALPHA_TESTING_GUIDE.md, ALPHA_KNOWN_ISSUES.md) are current — especially re: standup, authentication, and integration steps
                - [ ] Verify roadmap section matches active sprint sequence from BRIEFING-CURRENT-STATE
                - [ ] Ensure no deprecated workflow names (e.g., MorningStandupWorkflow retired via #1289)
                - [ ] Ensure content is accurate and doesn't reference work-in-progress as shipped

              ---

              **Assigned to**: @mediajunkie
              **Due**: End of day
              **Priority**: Focus on Briefing Freshness and Infrastructure Verification first

              ### Notes
              - Briefing freshness prevents stale-context drift - do this FIRST
              - Infrastructure checks prevent assumption cascades
              - Create PM-* issues for any problems discovered
              - Update this checklist template if new patterns emerge

              ### 📖 Lessons Learned from Previous Audits

              **Nov 5, 2025 (#293) - Key Findings**:
              1. ✅ **Always check docs/NAVIGATION.md first** before reporting files missing
              2. ✅ **PIPER.md ≠ PIPER.user.md** - Two different files (generic vs user-specific)
              3. ✅ **Pattern count discrepancy** - New patterns from pattern sweep may not be in README yet
              4. ✅ **roadmap.md location** - Lives at \`docs/internal/planning/roadmap/roadmap.md\`, not root
              5. ✅ **Root README.md review** - Agent should perform review, create findings document

              **Agent Guidelines**:
              - Provide evidence for all claims (command outputs, file paths, line numbers)
              - Explain any items that couldn't be completed (don't just skip)
              - Create separate review documents for complex analyses
              - Update this "Lessons Learned" section if new patterns discovered

              ### ❓ FAQ (Accumulated from Agent Questions)

              **Q: Should I use subagents or manual verification?**
              A: Use your judgment for efficiency. Haiku subagents are token-efficient for straightforward tasks like finding duplicates or broken links. Manual is fine for quick checks.

              **Q: How much time should this take?**
              A: Thoroughness over speed. This is part of the Excellence Flywheel - take as long as needed for a proper audit. Can span multiple days if needed.

              **Q: What's the priority order?**
              A: 1) Briefing Freshness (prevents stale-context drift), 2) Infrastructure checks (prevents assumption cascades), 3) Everything else

              **Q: What about files in dev/active/ vs dev/2025/MM/DD/?**
              A: dev/active/ is for current work-in-progress. Completed work should move to dated folders. Duplicates in dev/ are common and should be cleaned up.

              ### ✅ Closing This Issue

              **Use the \`close-issue-properly\` skill when closing this issue.**

              Before closing:
              1. Update checkboxes in this description (checked = done, unchecked = skipped/deferred)
              2. Add closing comment with evidence (findings doc path, issues created, metrics)
              3. Complete the Completion Matrix below
              4. **Update the staggered audit calendar** (\`docs/internal/operations/staggered-audit-calendar-2026.md\`):
                 - Update "Tracking Dashboard" section with completion date
                 - Set "Last Completed" to today's date for Documentation Audit row
                 - Calculate and update "Next Due" (3-4 weeks out per calendar)

              **Anti-pattern**: Adding a comment and closing without updating description checkboxes.

              ### 📋 Completion Matrix (REQUIRED)

              **All items must be marked. No silent skipping. (Pattern-046: 100% Completion Mandate)**

              | Section | Status | Evidence/Notes |
              |---------|--------|----------------|
              | Briefing Freshness | ✅/⏸️/❌ | [link or reason] |
              | Link Integrity Check | ✅/⏸️/❌ | [link or reason] |
              | Omnibus Coverage Check | ✅/⏸️/❌ | [link or reason] |
              | Sprint & Roadmap Alignment | ✅/⏸️/❌ | [link or reason] |
              | GitHub Issues Sync | ✅/⏸️/❌ | [link or reason] |
              | Pattern & Knowledge Capture | ✅/⏸️/❌ | [link or reason] |
              | Quality Checks (root README.md) | ✅/⏸️/❌ | [link or reason] |
              | Quality Checks (docs/README.md) | ✅/⏸️/❌ | [link or reason] |

              **Legend**:
              - ✅ = Completed with evidence
              - ⏸️ = Deferred WITH PM APPROVAL (requires approval comment link)
              - ❌ = Blocked (requires blocker issue link)

              ### ⚠️ Deferral Policy (Pattern-046 Enforcement)

              **You may NOT defer any checklist item without explicit PM approval.**

              To request a deferral:
              1. **STOP** before marking anything as deferred
              2. Comment on this issue explaining:
                 - Which item(s) you want to defer
                 - Why completion is not possible this audit
                 - Proposed timeline for completion
              3. **WAIT** for PM to respond with approval
              4. Only after PM approval: mark as ⏸️ in Completion Matrix with link to approval comment

              **Rationale**: The Feb 9, 2026 audit deferred "broken link check" without PM approval. This led to Ted Nadeau discovering broken ADR-042 links that should have been caught. Deferrals without oversight allow technical debt to accumulate invisibly.

              **"Too complex" is not an excuse** - if a task is too complex, that's a planning problem. File an issue, get PM guidance, but don't silently skip.

              ### References
              - [CLAUDE.md Project Instructions](../CLAUDE.md)
              - [Architecture Documentation](../docs/internal/architecture/current/architecture.md)
              - [Pattern Catalog](../docs/internal/architecture/current/patterns/README.md)
              - [dev/ Directory Structure](../dev/README.md) - Session log retention policy
              - [Navigation Hub](../docs/NAVIGATION.md) - **Check this FIRST for file locations**`,
              labels: ['documentation', 'maintenance', 'weekly-audit', 'fly-audit'],
              assignees: ['mediajunkie']
            });

            console.log(`Created documentation audit issue #${issue.data.number}`);
            return issue.data.number;

      - name: Post completion summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('✅ Weekly documentation audit workflow completed successfully');
            console.log('Check GitHub issues for the FLY-AUDIT Weekly Docs Audit checklist');
            console.log('PRIORITY: refresh docs/briefing/BRIEFING-CURRENT-STATE.md if stale');
