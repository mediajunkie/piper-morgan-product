name: PM-056 Schema Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "services/domain/models.py"
      - "services/database/models.py"
      - "tools/schema_validator.py"
      - "scripts/check_conversion_methods.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/domain/models.py"
      - "services/database/models.py"
      - "tools/schema_validator.py"
      - "scripts/check_conversion_methods.py"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-validation:
    name: Domain/Database Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The validator lives at tools/schema_validator.py (PM-056); scripts/schema_validator.py
      # has never existed. --ci is required: without it the validator prints "Critical issues
      # found" and still exits 0, so the step passes while reporting errors.
      - name: Run Schema Validator
        id: schema-validator
        run: |
          PYTHONPATH=. python tools/schema_validator.py --ci
        continue-on-error: true

      - name: Check Schema Validation Results
        if: steps.schema-validator.outcome == 'failure'
        run: |
          echo "❌ Schema validation failed!"
          echo "Domain and database models have mismatches."
          echo "Please review the validation output above."
          echo ""
          echo "Common issues:"
          echo "- Missing fields in database models"
          echo "- Type mismatches between domain and database"
          echo "- Missing conversion methods (to_domain/from_domain)"
          echo "- Enum value mismatches"
          exit 1

      - name: Schema Validation Passed
        if: steps.schema-validator.outcome == 'success'
        run: |
          echo "✅ Schema validation passed!"
          echo "Domain and database models are in sync."

  # Additional validation for known issues
  known-issues-check:
    name: Known Schema Issues Check
    runs-on: ubuntu-latest
    # NO `needs: schema-validation` — removed 2026-09-13. That dependency is the
    # reason this job was invisible for months: job 1 died at "Install
    # dependencies" (a stale Python 3.9 pin), so job 2 never ran at all and its
    # real finding never surfaced. A job that can only report when a DIFFERENT
    # job passes is a job whose silence means nothing. The two check unrelated
    # things and neither consumes the other's output, so they report
    # independently now.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for object_id vs object_position issue
        run: |
          echo "🔍 Checking for known spatial positioning issues..."
          if grep -r "object_id" services/domain/models.py && ! grep -r "object_position" services/domain/models.py; then
            echo "❌ Found object_id usage without object_position - this was a known issue!"
            echo "Domain models should use object_position for spatial positioning."
            exit 1
          fi
          echo "✅ No object_id/object_position mismatches found"

      - name: Check for missing conversion methods
        run: |
          echo "🔍 Checking for missing to_domain/from_domain methods..."
          python scripts/check_conversion_methods.py
          echo "✅ All database models have proper conversion methods"
