name: Agent 360 Questionnaire Reminder

on:
  schedule:
    # Runs daily at 9:22 AM Pacific (16:22 UTC); the job itself gates on a rolling
    # day-count from a fixed anchor date (see the runtime cycle-day guard below).
    #
    # WHY DAILY + A RUNTIME DAY-COUNT GATE, NOT A DATE-LIST OR A WEEKLY/MONTHLY CRON:
    # Agent 360's cadence is 42 CALENDAR DAYS from a fixed anchor (2026-08-14, when v0.4
    # was fielded) -- not a weekday-of-month pattern like role-health-check.yml's
    # staggered-date list or skill-candidates-review-check.yml's "1st Tuesday" guard.
    # Neither of those shapes fits a rolling interval: a date list would need to be
    # hand-extended forever, and a weekly/monthly cron can't express "every 42 days"
    # (cron has no divisibility operator across month boundaries). A daily cron with a
    # runtime `daysSinceAnchor % 42 === 0` check is the natural shape for a rolling
    # interval, same idea as the other two workflows' runtime day-guard, just computing
    # a day-difference from a fixed epoch instead of a weekday-of-month rule.
    #
    # Minute offset (22, not 0) is deliberate: weekly-docs-audit.yml moved off :00 after a
    # 2026-08-03 finding that GitHub Actions' top-of-the-hour scheduling congestion can
    # silently drop a run. Each Monday/Tuesday 9am-Pacific workflow uses a different minute
    # so they don't all compete for the same congested slot; :22 is unused among the
    # existing 16:xx-UTC workflows (role-health-check :00, monthly-housekeeping-audit :00,
    # weekly-docs-audit :07, skill-candidates-review-check :12).
    - cron: "22 16 * * *"
  workflow_dispatch: # Allows manual trigger for testing or ad-hoc checks (bypasses the cycle-day gate entirely)

permissions:
  issues: write
  contents: write

# Cadence: every 42 days (6 weeks), ratified 2026-08-14 (HOST), derived from actual
# fielding-interval history: v0.1->v0.2 was 34 days, v0.2->v0.3 was 42 days. Anchor date
# is 2026-08-14 -- the date v0.4 was fielded (manually, by HOST). The first AUTOMATED
# reminder is therefore for v0.5, due 2026-09-25 (anchor + 42), then every 42 days after
# that indefinitely (2026-11-06, 2026-12-18, ...).
#
# Instrument owner: HOST (Head of Sapient Trust) fields and synthesizes Agent 360 --
# see BRIEFING-ESSENTIAL-HOST.md. Questionnaire template: dev/active/agent-360-questionnaire-v0_4.md
# (versioned per round; HOST revises it before each fielding -- check for a newer version
# than v0.4 if one has since been created).

jobs:
  check-and-create-issue:
    runs-on: ubuntu-latest
    name: Create Agent 360 Reminder Issue (if scheduled)

    steps:
      - name: Check if Agent 360 cycle day
        id: check-cycle-day
        uses: actions/github-script@v7
        with:
          script: |
            // Rolling 42-day cadence from a fixed anchor -- see the `on.schedule` comment
            // for why this can't be a weekday-of-month cron like the other two audit
            // workflows. Fire only on a POSITIVE multiple of the cadence: day 0 (the
            // anchor date itself, 2026-08-14 -- when v0.4 was fielded MANUALLY by HOST)
            // must NOT fire again. The first automated reminder is day 42 (v0.5, due
            // 2026-09-25).
            const ANCHOR_DATE = '2026-08-14';
            const CADENCE_DAYS = 42;

            const anchor = new Date(ANCHOR_DATE + 'T00:00:00Z');
            const now = new Date();
            // Normalize "today" to a UTC midnight Date so the day-count is a clean
            // integer regardless of what time-of-day the runner executes at.
            const todayUTC = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const todayStr = todayUTC.toISOString().split('T')[0];

            const msPerDay = 24 * 60 * 60 * 1000;
            const daysSinceAnchor = Math.round((todayUTC - anchor) / msPerDay);

            const isCycleDay = daysSinceAnchor > 0 && daysSinceAnchor % CADENCE_DAYS === 0;
            const isManualTrigger = context.eventName === 'workflow_dispatch';

            console.log(`Today (UTC): ${todayStr}`);
            console.log(`Anchor date: ${ANCHOR_DATE}`);
            console.log(`Days since anchor: ${daysSinceAnchor}`);
            console.log(`Cadence: every ${CADENCE_DAYS} days`);
            console.log(`Is Agent 360 cycle day: ${isCycleDay}`);
            console.log(`Is manual trigger: ${isManualTrigger}`);

            return isCycleDay || isManualTrigger;

      - name: Check for existing issue
        if: steps.check-cycle-day.outputs.result == 'true'
        id: check-existing
        uses: actions/github-script@v7
        with:
          script: |
            // Same corrected pattern as role-health-check.yml and skill-candidates-review-check.yml
            // (2026-08-07 fix): a lookback window measured against the cadence itself has a
            // boundary condition -- the prior cycle's issue can land close enough to the cutoff
            // that scheduler jitter alone decides whether the next cycle gets suppressed.
            // role-health-check.yml's original form did exactly this and silently dropped a
            // whole cycle (#1178 case).
            //
            // The intent is "don't stack a second reminder while one is still outstanding."
            // That is exactly `state: open`, with NO date window -- which has no boundary
            // condition at all. An OPEN check suppresses (correctly, it IS the reminder); a
            // CLOSED one never does. Do not reintroduce a date-window lookback here.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'process,agent-360',
              per_page: 100
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('AGENT-360')
            );

            if (existingIssue) {
              console.log(`Agent 360 reminder issue already exists: #${existingIssue.number}`);
              return existingIssue.number;
            }

            return null;

      - name: Create Agent 360 reminder issue
        id: create-issue
        if: steps.check-cycle-day.outputs.result == 'true' && steps.check-existing.outputs.result == 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            const body = '# Agent 360 Questionnaire: ' + today + '\n\n' +
              '**Generated**: ' + today + '\n' +
              '**Owner**: HOST (Head of Sapient Trust) — fields the questionnaire and synthesizes responses\n' +
              '**Cadence**: Every 42 days (6 weeks), ratified 2026-08-14 — derived from actual fielding-interval history (v0.1→v0.2: 34 days, v0.2→v0.3: 42 days)\n\n' +
              '> ⏰ **Owner: HOST (Head of Sapient Trust)** — this recurring instrument is HOST\'s to field, not PM\'s. It auto-assigns to PM only because agents have no GitHub login, and GitHub issues do not notify agents (mail is the cross-agent signal layer). **So this does not reach HOST automatically — HOST\'s duty cycle polls for open `agent-360` issues each cycle.** PM: you can disregard the assignment; HOST picks it up.\n\n' +
              '---\n\n' +
              '## Purpose\n\n' +
              'Agent 360 is a structured feedback mechanism: HOST fields a questionnaire to every current role, roles respond via mailbox, HOST synthesizes patterns (including cross-role convergence) into a diff-against-baseline summary for PM + the cohort. Full rationale and question set live in the questionnaire template itself.\n\n' +
              '---\n\n' +
              '## Field this round\n\n' +
              '**Questionnaire template**: `dev/active/agent-360-questionnaire-v0_4.md` (as of this workflow\'s authoring — HOST revises the questionnaire each round; check for a newer version before fielding if one has since been created, and bump the version number for this round\'s edits).\n\n' +
              'The template\'s own header states the process (re-confirm these against the template — this is a pointer, not a substitute for reading it):\n' +
              '- Field to all current roles via mailbox\n' +
              '- Responses requested within **~2 weeks** of fielding\n' +
              '- Synthesis target: **~4 weeks** post-fielding (generous window; Time Lord backstop, not deadline-as-pacing)\n' +
              '- Synthesis is a diff-against-the-previous-round summary memo to PM + cohort\n\n' +
              '---\n\n' +
              '## Pre-Fielding Checklist\n\n' +
              '- [ ] Review the existing questionnaire template for staleness (role roster changes, retired/renamed roles, superseded infrastructure references) and revise before fielding\n' +
              '- [ ] Confirm current role roster (`docs/briefing/ROSTER.md`) matches the questionnaire\'s role-specific Section 8\n' +
              '- [ ] Save the revised template as the next version (e.g. `dev/active/agent-360-questionnaire-v0_5.md`) if edited\n\n' +
              '---\n\n' +
              '## Fielding Checklist\n\n' +
              '- [ ] Send questionnaire to all current roles via mailbox (`scripts/mail-send.sh`)\n' +
              '- [ ] Fill in the template\'s "Fielded: [date]" placeholder with today\'s date\n' +
              '- [ ] Track responses as they arrive in `mailboxes/host/inbox/`\n\n' +
              '---\n\n' +
              '## Post-Fielding / Synthesis Checklist\n\n' +
              '- [ ] All (or a documented subset — name the denominator) role responses collected\n' +
              '- [ ] Synthesis memo written: patterns, cross-role convergence, diff against previous round\n' +
              '- [ ] Synthesis memo sent to PM + cohort\n' +
              '- [ ] PM + HOST decide together what\'s worth changing; specific recommendations routed to owners\n' +
              '- [ ] This issue closed with a link to the synthesis memo as evidence\n\n' +
              '---\n\n' +
              '**Schedule**: Every 42 days from anchor 2026-08-14 (next after this: +42 days)\n\n' +
              'Generated with [Claude Code](https://claude.ai/code)';

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'AGENT-360: ' + today,
              body: body,
              labels: ['process', 'sapient-trust', 'agent-360'],
              assignees: ['mediajunkie']
            });

            console.log('Created Agent 360 reminder issue #' + issue.data.number);
            return issue.data.number;

      - name: Notify HOST via mailbox
        id: notify-host
        if: steps.check-cycle-day.outputs.result == 'true' && steps.check-existing.outputs.result == 'null' && steps.create-issue.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.create-issue.outputs.result }};
            const today = new Date().toISOString().split('T')[0];
            const memoPath = `mailboxes/host/inbox/memo-ghactions-to-host-agent-360-${today}.md`;

            const memoContent = [
              '---',
              'from: GitHub Actions (agent-360-check.yml)',
              'to: HOST (Head of Sapient Trust)',
              `date: ${today}`,
              `subject: Agent 360 auto-issue #${issueNumber} — field this round`,
              '---',
              '',
              `A new Agent 360 reminder issue has been auto-generated: **#${issueNumber}**`,
              '',
              'Review the questionnaire template for staleness, revise/version it if needed, field it to all current roles via mailbox, and track responses. Synthesis target is ~4 weeks post-fielding per the template\'s own header.',
              '',
              '**Refs**: `dev/active/agent-360-questionnaire-v0_4.md` (or newer, if HOST has since revised it)',
              '',
              '_Auto-generated by .github/workflows/agent-360-check.yml_'
            ].join('\n');

            const contentBase64 = Buffer.from(memoContent).toString('base64');

            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: memoPath,
                message: `mail(ghactions): agent-360 #${issueNumber} — notify HOST`,
                content: contentBase64,
                committer: { name: 'GitHub Actions', email: 'actions@github.com' },
                author: { name: 'GitHub Actions', email: 'actions@github.com' }
              });
              console.log(`HOST mailbox notification filed: ${memoPath}`);
            } catch (e) {
              console.error(`Failed to file HOST mailbox notification: ${e.message}`);
            }

      - name: Post completion summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const isCycleDay = ${{ steps.check-cycle-day.outputs.result }};
            if (isCycleDay) {
              console.log('✅ Agent 360 reminder workflow completed');
              console.log('Check GitHub issues for the AGENT-360 issue');
            } else {
              console.log('ℹ️ Not an Agent 360 cycle day - no action taken');
              console.log('Agent 360 reminders run every 42 days from anchor 2026-08-14');
            }
