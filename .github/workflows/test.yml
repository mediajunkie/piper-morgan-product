name: Tests

# Tests Workflow — fires on production code changes
# Category: services/web/tests + Python + alembic + scripts + workflow-self-edits
# Excludes: docs/mailboxes/dev/skills/hooks (cohort traffic; no code-test impact)
# See: GH Actions refactor Phase 1 (2026-05-27) + Architect sanity-check

on:
  push:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
      # #1382 house pattern (mirrors security-tests.yml): the runner's keyring is
      # dead, so KeychainService routes to the encrypted-DB store, which
      # fail-closes credential WRITES without a master key (correct — and it
      # broke the smoke OAuth tests). TEST-ONLY key, deliberately committed:
      # ephemeral CI database, no real credential ever stored.
      ENCRYPTION_MASTER_KEY: "Y2ktdGVzdC1vbmx5LTEzODItbmV2ZXItcHJvZCEhMzI="

    # Smoke includes DB-backed tests (the local dev DB is always up, so smoke
    # is DB-inclusive by design) — the job needs the same postgres service the
    # Security Test Suite runs, or those tests error at setup with
    # connection-refused (CI-red root cause 3, 2026-07-19).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run smoke tests (critical path)
        run: |
          echo "🔥 Running smoke test suite"
          python -m pytest -m smoke -q --tb=short
          echo "✅ Smoke tests passed - proceeding with full suite"

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
      # #1382 house pattern (mirrors security-tests.yml): the runner's keyring is
      # dead, so KeychainService routes to the encrypted-DB store, which
      # fail-closes credential WRITES without a master key (correct — and it
      # broke the smoke OAuth tests). TEST-ONLY key, deliberately committed:
      # ephemeral CI database, no real credential ever stored.
      ENCRYPTION_MASTER_KEY: "Y2ktdGVzdC1vbmx5LTEzODItbmV2ZXItcHJvZCEhMzI="

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), f'Python {sys.version} < 3.11'"
          echo "✅ Python 3.11+ confirmed in CI"
          echo "Python version: $(python --version)" >> $GITHUB_STEP_SUMMARY

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment consistency check
        run: |
          echo "=== Environment Verification ==="
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "Installed packages:"
          pip list | head -10
          echo "=== Consistency with production requirements ==="
          python -c "
          import sys
          required = (3, 11)
          current = sys.version_info[:2]
          assert current >= required, f'Python {current} < {required}'
          print('✅ Version consistency verified')
          "

      - name: Run Intent Interface Tests
        run: |
          echo "🔍 Running Intent Interface Tests (GREAT-4E)"
          python -m pytest tests/intent/test_web_interface.py tests/intent/test_slack_interface.py tests/intent/test_cli_interface.py -v --tb=short
          echo "✅ Interface tests completed"

      - name: Run Intent Contract Tests
        run: |
          echo "🔍 Running Intent Contract Tests (GREAT-4E)"
          python -m pytest tests/intent/contracts/ -m "not llm" -v --tb=short
          echo "✅ Contract tests completed"

      - name: Verify Intent Bypass Prevention
        run: |
          echo "🔍 Running Intent Bypass Prevention Tests (Critical Security)"
          python -m pytest tests/intent/test_no_web_bypasses.py tests/intent/test_no_cli_bypasses.py tests/intent/test_no_slack_bypasses.py -v --tb=short
          echo "✅ Bypass prevention verified"

      - name: Intent System Coverage Gate
        run: |
          echo "🔍 Verifying Intent Test Coverage..."
          TEST_COUNT=$(find tests/intent/ -name "test_*.py" | wc -l | tr -d ' ')
          echo "Found $TEST_COUNT intent test files"
          if [ "$TEST_COUNT" -lt 20 ]; then
            echo "❌ Error: Expected at least 20 intent test files, found $TEST_COUNT"
            exit 1
          fi
          echo "✅ Intent coverage verified: $TEST_COUNT test files"

      - name: Classification Accuracy Gate
        run: |
          echo "🔍 Running Classification Accuracy Tests..."
          python -m pytest tests/intent/contracts/test_accuracy_contracts.py -m "not llm" -v --tb=short
          echo "✅ Classification accuracy verified"
        continue-on-error: false

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests (excluding LLM tests)
        run: |
          # Skip LLM tests in CI (no API keys configured)
          # LLM tests run locally when keys available
          python -m pytest tests/ --tb=short -v -m "not llm"

      - name: Test summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed with Python 3.11" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY


  # Fossil jobs removed 2026-07-19 (#1436 CI-honesty pass): performance-regression-check,
  # performance-benchmarks (GREAT-5), tiered-coverage-enforcement. All three enforced
  # claims about services/orchestration/* (deleted, #1436 Family-2) — the perf jobs
  # imported the deleted OrchestrationEngine and the coverage job measured a directory
  # that no longer exists. Real perf/coverage gates for the LIVE system: see the
  # tracking issue filed with this change (fossil scripts recoverable from git history).
