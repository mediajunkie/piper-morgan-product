name: Code Quality

# Code Quality Workflow — fires on Python source + lint config changes
# Category: services/web/tests + Python + lint config + scripts + workflow-self-edits
# Excludes: docs/mailboxes/dev/skills/hooks (lint covers code, not docs)
# See: GH Actions refactor Phase 1 (2026-05-27)

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - '.flake8'
      - '.pylintrc'
      - 'setup.cfg'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - '.flake8'
      - '.pylintrc'
      - 'setup.cfg'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), f'Python {sys.version} < 3.11'"
          echo "✅ Python 3.11+ confirmed for linting"

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-lint-
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Check formatting with ruff
        run: |
          ruff format --check --diff .

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Quality summary
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ ruff format check passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ ruff lint (E9,F63,F7,F82,I) passed" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Python 3.11" >> $GITHUB_STEP_SUMMARY
