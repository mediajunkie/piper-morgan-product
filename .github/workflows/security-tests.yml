name: Security Tests

# Issue #1304: tests/security/ never ran in any gating CI job. No workflow
# targeted it; the two workflows that broadly collect tests/ (test.yml, ci.yml)
# each die before reaching it for unrelated reasons (a tests/load/ collection
# error and a stale config-validation step, respectively — see #1304 for the
# full forensic trail). The only workflow with a real Postgres (e2e-aaxt.yml)
# didn't run tests/security/ either.
#
# This is a small, dedicated, independent job so it can't be starved by either
# of those pre-existing problems: it doesn't depend on test.yml's smoke-tests
# job, and --override-ini="addopts=" drops pytest.ini's -x/--maxfail=1 (the
# same technique e2e-aaxt.yml already uses) so a single failure or unrelated
# collection issue elsewhere can't mask a real security-test failure.

on:
  push:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/security/**'
      - 'config/**'
      - 'alembic/**'
      - 'requirements*.txt'
      - '.github/workflows/security-tests.yml'
  pull_request:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/security/**'
      - 'config/**'
      - 'alembic/**'
      - 'requirements*.txt'
      - '.github/workflows/security-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-suite:
    name: Security Test Suite (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-deps -r requirements.txt

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        run: python -m alembic upgrade head

      - name: Run security test suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
          # #1382: the CI runner's keyring is dead (headless ubuntu — same as the
          # droplet), so KeychainService routes to the encrypted-DB store, which
          # FAIL-CLOSES without a master key (that refusal is the security
          # property, and it's what turned this suite red 2026-07-09). This
          # TEST-ONLY 32-byte AES-256 key makes CI exercise the real hosted
          # configuration: dead keyring + encrypted-DB store + real Postgres.
          # Deliberately committed, not a secret — ephemeral CI database, no
          # real credential ever stored. Decodes to "ci-test-only-1382-never-prod!!32".
          ENCRYPTION_MASTER_KEY: "Y2ktdGVzdC1vbmx5LTEzODItbmV2ZXItcHJvZCEhMzI="
        run: |
          echo "🔒 Running tests/security/ against real Postgres (#1304)"
          python -m pytest tests/security/ -v --tb=short --override-ini="addopts="
          echo "✅ Security suite passed"
