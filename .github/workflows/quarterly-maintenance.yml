# Quarterly Maintenance Sweep Reminder
# Creates a GitHub issue every quarter to prompt maintenance tasks
#
# Schedule: First day of Jan, Apr, Jul, Oct at 9am UTC
# Issue #449 (FLY-MAINT-CLEANUP) established this pattern

name: Quarterly Maintenance Reminder

on:
  schedule:
    # Runs at 9:00 UTC on Jan 1, Apr 1, Jul 1, Oct 1
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  create-maintenance-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Quarterly Maintenance Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date();
            const quarter = Math.floor(today.getMonth() / 3) + 1;
            const year = today.getFullYear();

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quarterly Maintenance Sweep - Q${quarter} ${year}`,
              body: `## Quarterly Maintenance Checklist

            This is an automated reminder to perform routine maintenance tasks.
            Reference: Issue #449 (FLY-MAINT-CLEANUP) established this pattern.

            ### Documentation Cleanup
            - [ ] Run \`/cleanup-dev-active\` skill (or manually triage \`dev/active/\`)
            - [ ] Scan \`docs/\` root for misplaced files
            - [ ] Review \`docs/to-file/\` queue (if exists)
            - [ ] Verify NAVIGATION.md links are current
            - [ ] Check briefing freshness (\`docs/briefing/BRIEFING-CURRENT-STATE.md\`)

            ### Archive Review
            - [ ] Move deprecated folders to \`archive/\` (gitignored)
            - [ ] Update README stubs for any moved directories
            - [ ] Check for orphan directories (1-2 files, not in NAVIGATION)

            ### Code Hygiene
            - [ ] Run \`find services/ -type d -not -path '*/__pycache__*' -exec sh -c '[ ! -f "$1/__init__.py" ] && echo "MISSING: $1"' _ {} \\;\`
            - [ ] Check for TODO comments without issue numbers
            - [ ] Review test files for hardcoded data that should be fixtures

            ### Agent Infrastructure
            - [ ] \`ls mailboxes/*/inbox/\` - Check for undelivered mail
            - [ ] **Each role archives its own \`mailboxes/{role}/read/\`**: \`python3 scripts/archive-mailbox-read.py {role} --execute\` (dry-run without \`--execute\` first if unsure). Moves completed-quarter memos into \`read/archive/YYYY-QN/\`; current quarter stays live. One role per invocation, by design — never run against another role's mailbox. Two things to know before running it: (1) everything under \`mailboxes/\` must go through \`scripts/mail-send.sh\` in one call, not a normal \`git commit\` — the ≥20-file broad-staging warn and \`check-branch.sh\`'s mailbox-on-feature-branch block will both fire otherwise; (2) \`mail-send.sh\` can take a couple of minutes to return on a large first run (783 paths took just over 2 min) — the push lands well before that, the delay is its own post-push advisory scans, so a slow return is not a hang. CIO piloted this on its own seat 2026-09-19 (391 memos, commit \`77b86a5dd\`) before this line was added.
            - [ ] Review \`.claude/skills/\` for outdated procedures
            - [ ] Verify \`.claude/hooks/\` are functional
            - [ ] Check editorial calendar CSV column count consistency

            ### Beads Health
            - [ ] \`bd status\` - Check database health
            - [ ] \`bd list\` - Review open beads for staleness
            - [ ] Close any completed beads that were missed

            ---
            *This issue was automatically created by the quarterly-maintenance workflow.*
            `,
              labels: ['maintenance', 'documentation']
            });

            console.log('Quarterly maintenance issue created successfully');
