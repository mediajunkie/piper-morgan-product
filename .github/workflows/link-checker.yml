# Concept: docs/operations/link-maintenance.md (added 2026-10-14, sunset-or-renew inventory; CIO)
name: Documentation Link Checker

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      # #1719: a move can break a reference OUTSIDE docs/ — CLAUDE.md, the skills, and the
      # dev/active/ archival source. Those paths now trigger the check too.
      - "CLAUDE.md"
      - ".claude/**/*.md"
      - "dev/active/**"
      - "*.md"
      - ".github/workflows/link-checker.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      # #1719: a move can break a reference OUTSIDE docs/ — CLAUDE.md, the skills, and the
      # dev/active/ archival source. Those paths now trigger the check too.
      - "CLAUDE.md"
      - ".claude/**/*.md"
      - "dev/active/**"
      - "*.md"
      - ".github/workflows/link-checker.yml"
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-checker:
    runs-on: ubuntu-latest
    name: Check documentation links

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup lychee link checker
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          # Check all markdown files
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude-private
            --exclude-mail
            --exclude="linkedin.com"
            --exclude="twitter.com"
            --exclude="facebook.com"
            --exclude="instagram.com"
            --max-redirects=10
            --timeout=30
            --retry-wait-time=5
            --max-retries=3
            --accept=200,204,301,302,307,308,429,403,503
            "docs/**/*.md"
            "*.md"
            ".claude/**/*.md"
          format: detailed
          output: link-checker-results.md

      # #1593: lychee detected breakage correctly for months while this
      # workflow reported success — "green that lies" (postmortem instance 3,
      # Docs memo 2026-08-12). The fix is NOT fail:true — 125 legacy errors
      # are mid-burn-down under #1584, and a binary gate would go permanently
      # red, recreating #1600's "red nobody sees" on day one. RATCHET instead
      # (house pattern, scripts/ratchet_ceilings.json discipline): NEW
      # breakage fails the job immediately; legacy debt only shrinks. Lower
      # the ceiling in the same commit as any link cleanup.
      # #1894 (2026-09-25): 403 and 503 are accepted above, on purpose. The
      # ratchet counted them as breakage, and they are not — 403 is a host
      # bot-blocking the runner (medium, openai, perplexity; 23 unique URLs,
      # stable), 503 is a host having a bad minute (12 unique URLs appeared
      # in one run and vanished in the next). With the count sitting ~2 under
      # the ceiling, that transient alone flipped main red (102 vs 90) and
      # green again six minutes later with no commit touching a link. A
      # ratchet that trips on weather is one people learn to skim (#1892).
      # What the count now measures: links the repo controls — missing files
      # and anchors, 404s, malformed URLs.
      - name: Broken-link ratchet gate (#1593)
        if: always()
        run: |
          CEILING=60
          UNMEASURED=0
          COUNT=$(grep -oE '🚫 Errors\.+[0-9]+' link-checker-results.md | grep -oE '[0-9]+$' || echo "")
          if [ -z "$COUNT" ]; then
            echo "::error::#1593 ratchet could not read an error count from lychee output — refusing to pass on a missing measurement (m-44: a clear that measured nothing is not a clear)"
            exit 1
          fi
          echo "broken links: $COUNT (frozen ceiling: $CEILING — #1584 burn-down)"
          # 2026-10-31 (CIO, from Docs' NOTICE): connection errors ("error
          # sending request") are weather too. Three reds in nine days (10-26,
          # 10-30 16:30, 10-30 23:09; 755 completed runs), each 4-5 over the
          # ceiling and each green on a rerun. They can't simply be accepted:
          # the green baseline holds 3 of that class that are really dead
          # (builttoadapt.io, two malformed hosts), and a new dead host must
          # still trip the gate. So, only when over the ceiling, give that
          # class one second look after a pause, which is what the manual
          # rerun did. A link that fails both looks stays counted; 404s and
          # missing files are never re-checked. `|| true` on each grep: this
          # shell runs with pipefail, and no match is the clean case (#2240).
          # 2026-10-31 22:10 STOP (CIO): a 5xx is the server's weather too
          # (podcasts.apple.com 500 took main red at 22:05, 61 vs 60, with
          # the three known-dead hosts unchanged). The green baseline holds no
          # 5xx, so this hides nothing already known; a 5xx on both looks counts.
          if [ "$COUNT" -gt "$CEILING" ]; then
            WEATHER=$(grep -oE '\[ERR\] https?://[^ ]+ \| Failed: Network error: error sending request|\[5[0-9]{2}\] https?://[^ ]+ \|' link-checker-results.md | awk '{print $2}' | sort -u || true)
            if [ -n "$WEATHER" ]; then
              echo "over the ceiling: re-checking $(echo "$WEATHER" | wc -l | tr -d ' ') connection-error or 5xx URLs after 60s"
              sleep 60
              DOWN=""
              for u in $WEATHER; do
                code=$(curl -sS -o /dev/null -L --max-time 30 -w '%{http_code}' "$u" 2>/dev/null || true)
                case "$code" in
                  2??|3??|403|429|503)
                    n=$(grep -F " $u |" link-checker-results.md | grep -cE '\[(ERR|5[0-9]{2})\] ' || true)
                    COUNT=$((COUNT - n))
                    echo "  reachable now ($code), -$n: $u" ;;
                  5??)
                    DOWN="$DOWN $(echo "$u" | awk -F/ '{print $3}')"
                    echo "  still failing ($code): $u" ;;
                  *) echo "  still failing (${code:-none}): $u" ;;
                esac
              done
              # 2026-11-08 (CIO, Lead's question): a host that answers 5xx on 10
              # or more URLs on both looks is down, not broken in 10 places.
              # GitHub's 504s on 11-08 put 81 over a ceiling of 60 with no
              # checked file changed. A dead page answers 404, which is never
              # re-checked, so this drops only an outage. One host's handful of
              # 5xx still counts. Those links are unmeasured this run, and the
              # warning says so.
              for h in $(printf '%s\n' $DOWN | sort | uniq -c | awk '$1 >= 10 {print $2}'); do
                n=$(grep -cE "\[5[0-9]{2}\] https?://$(echo "$h" | sed 's/\./\\./g')[/ :]" link-checker-results.md || true)
                COUNT=$((COUNT - n))
                UNMEASURED=$((UNMEASURED + n))
                echo "::warning::$h answered 5xx on both looks for $n links: a host outage, not $n broken links. -$n; links on $h are NOT MEASURED this run"
              done
              echo "broken links after the second look: $COUNT (frozen ceiling: $CEILING)"
            fi
          fi
          if [ "$COUNT" -gt "$CEILING" ]; then
            echo "::error::broken links $COUNT exceed frozen ceiling $CEILING — new breakage may not ship. Fix the new links, or (for cleanup) lower CEILING in this workflow in the same commit."
            exit 1
          fi
          # A count with a host left out is a floor, not a measurement: never
          # lock a ceiling to it (the first real run, 11-08: 74 -> 46 with
          # GitHub's 21 links unmeasured, and it advised CEILING=46).
          if [ "$COUNT" -lt "$CEILING" ] && [ "$UNMEASURED" -gt 0 ]; then
            echo "broken links $COUNT are below ceiling $CEILING, but $UNMEASURED links were not measured this run: don't lower CEILING from this run"
          elif [ "$COUNT" -lt "$CEILING" ]; then
            echo "::warning::broken links $COUNT are BELOW ceiling $CEILING — cleanup happened; lower CEILING to $COUNT in this workflow to lock it in (shrink-lock)"
          fi

      - name: Create link checker summary
        if: always()
        run: |
          echo "## 📋 Link Checker Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "link-checker-results.md" ]; then
            echo "### 🔗 Detailed Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat link-checker-results.md >> $GITHUB_STEP_SUMMARY
          fi

          # Count total links checked
          TOTAL_LINKS=$(grep -r "\](" docs/ *.md 2>/dev/null | wc -l || echo "0")
          echo "### 📊 Summary Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total links processed**: $TOTAL_LINKS" >> $GITHUB_STEP_SUMMARY
          echo "- **Check timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload link checker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-checker-results
          path: |
            link-checker-results.md
            lychee.log
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔗 Link Checker Results\n\n';

            try {
              if (fs.existsSync('link-checker-results.md')) {
                const results = fs.readFileSync('link-checker-results.md', 'utf8');
                comment += '### Detailed Results\n```\n' + results + '\n```\n';
              } else {
                comment += '✅ No broken links found!\n';
              }
            } catch (error) {
              comment += '⚠️ Unable to read link checker results\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
