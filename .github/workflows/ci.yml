name: CI

# CI Workflow — fires on production code changes
# Category: services/web/tests + Python + alembic + scripts + workflow-self-edits
# Excludes: docs/mailboxes/dev/skills/hooks (cohort traffic; handled by other workflows or no CI)
# See: dev/active/duty-cycle-escalations-lead.md (GH Actions refactor Phase 1) + Architect sanity-check 2026-05-27

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt found"


    - name: Configuration Validation Test
      run: |
        echo "🔍 Testing configuration validation system..."

        # Create test configuration file
        mkdir -p config
        cat > config/PIPER.test.md << 'EOF'
        ## GitHub
        - api_token: ghp_test_token_1234567890abcdef
        - organization: test-org
        - repository: test-repo

        ## Slack
        - workspace_id: T1234567890
        - bot_token: xoxb-test-token-1234567890
        - signing_secret: test_signing_secret_32_characters

        ## Notion
        - api_key: secret_test_notion_key_1234567890
        - database_ids: ["db1", "db2"]

        ## Calendar
        - credentials_path: test_credentials.json
        - calendar_ids: ["primary"]
        EOF

        # Create test credentials file
        cat > test_credentials.json << 'EOF'
        {
          "type": "service_account",
          "client_email": "test@test.iam.gserviceaccount.com",
          "private_key": "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
        }
        EOF

        # Test configuration validation (should work with test config)
        echo "✅ Testing valid configuration..."
        python -c "
        from services.config_validator import ConfigValidator
        validator = ConfigValidator('config/PIPER.test.md')
        results = validator.validate_all_services()
        report = validator.format_validation_report(results)
        print(report)
        startup_allowed = validator.is_startup_allowed(results)
        print(f'Startup allowed: {startup_allowed}')
        "

        # Test with invalid configuration
        echo "❌ Testing invalid configuration handling..."
        cat > config/PIPER.invalid.md << 'EOF'
        ## GitHub
        - api_token: invalid_token

        ## Slack
        - bot_token: invalid_token
        EOF

        python -c "
        from services.config_validator import ConfigValidator
        validator = ConfigValidator('config/PIPER.invalid.md')
        results = validator.validate_all_services()
        startup_allowed = validator.is_startup_allowed(results)
        if not startup_allowed:
            print('✅ Invalid configuration correctly rejected')
        else:
            print('❌ Invalid configuration incorrectly accepted')
            exit(1)
        "

        # Test main.py integration
        echo "🚀 Testing main.py startup integration..."
        timeout 10s python main.py --config config/PIPER.test.md --skip-validation || echo "✅ Startup test completed"

        # Clean up test files
        rm -f config/PIPER.test.md config/PIPER.invalid.md test_credentials.json

        echo "✅ Configuration validation CI tests completed"


    - name: Run tests
      run: |
        python -m pytest tests/

  windows-clone-test:
    runs-on: windows-latest
    name: Windows Clone & File Verification

    steps:
    - uses: actions/checkout@v3

    - name: Verify Windows clone successful
      run: |
        echo "✅ Repository cloned successfully on Windows"
        echo "Checking for Windows-illegal characters in filenames..."

    - name: Check for Windows-illegal filename characters
      run: |
        $illegalChars = @(':', '<', '>', '"', '|', '?', '*')
        $foundIssues = $false

        Get-ChildItem -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
          foreach ($char in $illegalChars) {
            if ($_.Name -match [regex]::Escape($char)) {
              Write-Output "❌ Found illegal character '$char' in: $($_.FullName)"
              $foundIssues = $true
            }
          }
        }

        if ($foundIssues) {
          Write-Output "❌ Windows-illegal characters found in repository"
          exit 1
        } else {
          Write-Output "✅ No Windows-illegal characters found"
          Write-Output "✅ Repository is Windows-compatible"
        }

    - name: Verify all files present
      run: |
        $fileCount = (Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
        Write-Output "✅ Total files present: $fileCount"

        if ($fileCount -lt 100) {
          Write-Output "⚠️  Warning: File count seems low, but continuing..."
        }

        Write-Output "✅ Windows clone test passed"
