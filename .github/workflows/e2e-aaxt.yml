name: E2E & AAXT Tests

# Issue #930: CI integration for E2E conversations + AAXT nightly
#
# Three jobs:
# 1. e2e-conversations: Task lifecycle smoke tests (every PR, deterministic)
# 2. canonical-regression: Canonical routing + structure (PRs touching conversation code)
# 3. aaxt-nightly: Golden quality scenarios with LLM judge (scheduled, costs ~$0.50)

# E2E & AAXT Workflow — fires on production code changes + scheduled nightly AAXT
# Category: services/web/tests + Python + alembic + scripts + workflow-self-edits
# Excludes: docs/mailboxes/dev/skills/hooks (no E2E coverage impact)
# Scheduled fires (cron + workflow_dispatch) unaffected by paths filter
# See: GH Actions refactor Phase 1 (2026-05-27)

on:
  push:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, production]
    paths:
      - 'services/**'
      - 'tests/**'
      - 'web/**'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'alembic/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    # WEEKLY (Mondays 6 AM UTC / Sun 11 PM PT) — AAXT only. PM ruling 2026-09-13.
    #
    # Was nightly. That cost nothing for months because the API credentials were
    # dead: the job failed fast and billed zero. Rotating the keys on 09-13
    # silently switched on a real ~$0.50/run recurring charge (~$15/mo) against
    # a $20 balance with no auto-renew — a charge nobody chose, arriving as a
    # side effect of a fix. PM's call: weekly keeps the golden-scenario canary
    # alive at roughly a tenth the cost; nothing else in the belt depends on its
    # cadence. Detection latency goes from ~1 day to ~7 for quality drift only.
    # Run it on demand any time via workflow_dispatch with run_aaxt=true.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_aaxt:
        description: 'Run AAXT golden scenarios (costs ~$0.50)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: E2E Task Lifecycle (every PR, ~90s) ──────────────────────
  e2e-conversations:
    name: E2E Task Lifecycle
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-deps -r requirements.txt

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        run: python -m alembic upgrade head

      - name: Run E2E task lifecycle tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🧪 Running E2E task lifecycle tests (#927)"
          python -m pytest tests/e2e/test_task_lifecycle_e2e.py \
            -v --tb=short --override-ini="addopts="
          echo "✅ E2E task lifecycle passed"

  # ─── Job 2: Canonical Routing Regression (conversation-code PRs) ────
  canonical-regression:
    name: Canonical Routing Regression
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # 25, not 15: measured on run 34786243866 (the first run ever to reach this
    # step with WORKING credentials — the old keys pointed at a different
    # account, so for months the step failed fast and 15 was never tested
    # against real work). That run completed 23 of the 28 live-LLM
    # `test_floor_response_no_template` cases before the axe fell at 15m16s —
    # roughly one minute short. 25 covers that plus headroom for LLM latency
    # variance (observed 5–13s per case).
    #
    # NOTE the cost this timeout is buying: -k selects 211 tests, a large
    # share of them real LLM round-trips. As of 2026-09-13 the paths-filter
    # below actually governs (the `|| github.event_name == 'push'` bypass that
    # made it dead is gone), so this runs when conversation code changes rather
    # than on every push. #1785 still holds the broader push-vs-nightly
    # question.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ⚠️ COST GATE — do not re-add `|| github.event_name == 'push'` to the
      # steps below without reading this. That bypass made the paths-filter
      # directly beneath it dead on every push to main, so the live-LLM
      # canonical suite (211 tests, many real LLM round-trips) ran on EVERY
      # push regardless of whether conversation code changed. Measured
      # 2026-09-13: 26 runs on 09-12, 17 on 09-13, and $5 of API credit
      # consumed in a day. The filter now governs, as its author intended:
      # touch services/intent*, web/api/routes/intent.py, services/llm/** or
      # llm_domain_service.py and it runs; otherwise it skips.
      - name: Check if conversation code changed
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            conversation:
              - 'services/intent/**'
              - 'services/intent_service/**'
              - 'web/api/routes/intent.py'
              - 'services/llm/**'
              - 'services/domain/llm_domain_service.py'

      - name: Set up Python
        if: steps.changes.outputs.conversation == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.conversation == 'true'
        run: |
          pip install --upgrade pip
          pip install --no-deps -r requirements.txt

      - name: Run migrations
        if: steps.changes.outputs.conversation == 'true'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        run: python -m alembic upgrade head

      - name: Run canonical routing tests
        if: steps.changes.outputs.conversation == 'true'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🧪 Running canonical routing regression (#928 Tier 1)"
          python -m pytest tests/e2e/test_canonical_conversations.py \
            -k "TestCanonicalRouting or TestCanonicalResponseStructure" \
            -v --tb=short --override-ini="addopts="
          echo "✅ Canonical routing regression passed"

      - name: Skip — no conversation code changes
        if: steps.changes.outputs.conversation != 'true'
        run: echo "⏭️ Skipped — no changes to conversation code paths"

  # ─── Job 3: AAXT Nightly (scheduled, ~$0.50/run) ───────────────────
  aaxt-nightly:
    name: AAXT Golden Scenarios
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_aaxt == 'true')
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-deps -r requirements.txt

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
        run: python -m alembic upgrade head

      - name: Run AAXT golden scenarios
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: dev_changeme_in_production
          POSTGRES_DB: piper_morgan
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AAXT_ENABLED: "true"
          AAXT_JUDGE_MODEL: ${{ vars.AAXT_JUDGE_MODEL || 'claude-sonnet-4-6' }}
        run: |
          echo "🧪 Running AAXT golden scenarios (#929)"
          echo "💰 Estimated cost: ~$0.50 at Sonnet pricing"
          python -m pytest tests/aaxt/ \
            -v --tb=short --override-ini="addopts="
          echo "✅ AAXT golden scenarios complete"

      - name: Upload AAXT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaxt-results-${{ github.run_number }}
          path: tests/aaxt/results/
          retention-days: 30
          if-no-files-found: ignore
