# Deployment pipeline §4e/§4f — built by Pard to Arch's plan v0.4 ruling (2026-09-29).
#
# WHY THIS EXISTS. Every alpha deploy since the Fly cutover has been a hand-run
# `fly deploy --remote-only --build-arg PIPER_GIT_SHA=$(git rev-parse HEAD)` from a detached
# worktree. That discipline has been real and unbroken -- and it is a HABIT, not a MECHANISM.
# Issue #1849 stays open until a deploy nobody hand-arms attests its own sha.
#
# THE PROPERTY PM RESTATED when retiring origin/production: build on main, but deploy alpha from a
# stable cut, so testers are never exposed to in-flight work. That property is what this file has to
# give back now that the branch is gone.
#
# ARCH'S THREE SHARPENINGS (plan v0.4 §4f), which this implements:
#   1. Alpha PROMOTES staging's exact image and never rebuilds from a tag, so the sha that was
#      smoke-driven is the sha testers get.
#   2. TWO tokens, one per app -- never one scoped to both. Alpha's lives only in a GitHub
#      environment with a required reviewer, so a push to main cannot reach testers even through a
#      workflow edit. The guarantee is enforced by GitHub, not by anyone's care.
#   3. Staging Redis gates the PROMOTION, not the staging deploy. A smoke drive against a staging
#      that lacks alpha's Redis measures a different system.
#
# DEGRADES, DOES NOT FAIL. While FLY_API_TOKEN_STAGING is unset, the deploy job SKIPS with an
# explanation rather than failing. A workflow that red-Xes every push to main trains people to
# ignore it, and this one has to be trusted on the day it matters.

name: Fly deploy

on:
  push:
    branches: [main]
    # PATHS-IGNORE MIRRORS .dockerignore, AND NOTHING ELSE (Arch's ruling, 2026-10-01).
    #
    # The invariant is NOT "staging's sha equals main's tip" -- that was my proxy for it, and it is the
    # one I defended on 09-29 before the data arrived. The real one is: STAGING'S IMAGE CONTENT EQUALS
    # THE IMAGE MAIN'S TIP WOULD BUILD. `.dockerignore` is the definition of what reaches the image, so
    # a push touching only those paths produces a byte-identical image apart from the baked sha, and
    # skipping it changes nothing anyone can observe. The sha-label lag costs §4f nothing, because
    # promotion reuses staging's image by digest rather than rebuilding from a tag.
    #
    # ⚠️ `docs/` IS DELIBERATELY ABSENT FROM THIS LIST. It is absent from .dockerignore too, because
    # services/domain/pm_number_manager.py reads `docs/planning/*` AT RUNTIME. Measured before this
    # change: of 224 files that had drifted between staging and main one morning, 179 were image-
    # neutral and the other 45 were ALL docs/. Ignoring them would let staging serve stale runtime
    # files behind a plausible sha -- the exact small lie this design exists to prevent. "Non-code" is
    # not the same category as "not in the image", and only .dockerignore knows the difference.
    #
    # `.dockerignore` itself is also absent, on purpose: it is not copied into the image, but changing
    # it changes which other files are, so a push touching it must still deploy.
    #
    # scripts/check-deploy-trigger-parity.sh asserts this list still matches .dockerignore, because two
    # hand-maintained lists that must agree will drift (Arch's point 5).
    paths-ignore:
      - '.claude/**'
      - '.github/**'
      - '**/*.log'
      - 'deploy/fly/**'
      - 'dev/**'
      - 'mailboxes/**'
      - 'node_modules/**'
      - 'tests/**'
      - 'venv/**'
  workflow_dispatch:
    inputs:
      promote_to_alpha:
        description: "Promote the image currently on staging to alpha (requires reviewer approval)"
        type: boolean
        default: false
      health_gate_drill:
        description: "DRILL: run the staging job with the health verdict FORCED red, to prove the gate skips the deploy (never deploys)"
        type: boolean
        default: false

concurrency:
  # Never let two deploys race to the SAME app. Do NOT cancel in-progress: a half-applied
  # `release_command` (alembic upgrade head) is worse than a queued deploy.
  #
  # SPLIT BY APP, not by ref (Arch review, 2026-09-29). It was `fly-deploy-${{ github.ref }}`, which is
  # `refs/heads/main` for BOTH a push and a dispatch from main. GitHub keeps one running and one
  # pending run per group, so a promotion queued behind a staging deploy would be silently cancelled by
  # the next push -- and on this repo the next push is minutes away. The two jobs deploy different apps
  # and have no reason to serialize against each other.
  # The health-gate drill (a workflow_dispatch with health_gate_drill) gets its OWN group: without it,
  # a drill evaluated to 'alpha' and could silently cancel a queued real promotion (Pard 2026-10-04,
  # the 09-29 race arriving through a new dispatch path).
  group: fly-deploy-${{ github.event_name == 'push' && 'staging' || (inputs.promote_to_alpha && 'alpha' || 'drill') }}
  cancel-in-progress: false

jobs:
  # --- (b) staging deploys itself on push to main, with the sha baked in. Closes #1849. --------
  deploy-staging:
    # Push deploys as before. The dispatch path exists ONLY for the health-gate drill (Arch,
    # 2026-10-04: prove the gate skips the deploy in a real run, not by reading YAML). A drill
    # forces verdict=red, so it can never deploy.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.health_gate_drill)
    runs-on: ubuntu-latest
    # Listing permissions RESTRICTS the token to exactly these, so `contents` has to be here too
    # even though it was implicit before. `actions: read` is new, for the health gate below.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # --- CI-gate package item 1, "only green deploys" (Lead, 2026-10-04) -------------------
      #
      # WHAT THIS ASSERTS, precisely: main is not CURRENTLY KNOWN-BROKEN. It does not assert that
      # this commit passed its own tests. That distinction is not a compromise I reached for; it is
      # what the repo's own numbers allow, and the three measurements are below because the obvious
      # shape fails on all three.
      #
      # LEAD PROPOSED `workflow_run` on Tests (completed, main, conclusion == success) instead of
      # `on: push`. Measured before building it:
      #
      #   1. 133 of the 328 deploying commits since 09-20 -- 41% -- NEVER TRIGGER `Tests` AT ALL.
      #      Tests' path filter is an allowlist (services/ tests/ web/ *.py alembic/ scripts/
      #      .github/workflows/); this file's is a denylist mirroring .dockerignore. They are not
      #      complements, and the gap is almost entirely `docs/`: 187 of the image-relevant files in
      #      that set. docs/ is DELIBERATELY absent from paths-ignore (see the trigger comment
      #      above) because services/domain/pm_number_manager.py reads docs/planning/* AT RUNTIME.
      #      So `workflow_run` would not merely fail to carry the paths-ignore invariant -- it would
      #      INVERT it, silently freezing staging's runtime docs. That is the exact small lie the
      #      header says this design exists to prevent, arriving through the gate meant to harden it.
      #
      #   2. A green `Tests` takes 20-23 minutes (1208s / 1270s / 1398s, the three greens in the
      #      last 40 runs). So per-sha gating adds that to every code deploy.
      #
      #   3. 55% of consecutive Tests-triggering commits on main land within 20 minutes of each
      #      other (median gap 12.2 min, 97 such commits in 7 days), and `Tests` sets
      #      cancel-in-progress: true. More than half of runs are therefore cancelled before they
      #      can conclude -- 11 of the last 40 observed cancelled. A gate waiting for THIS sha to go
      #      green would often be waiting for a run that gets killed by the next push.
      #
      # Per-commit certainty is not purchasable at this push rate without serializing main's
      # development. What IS purchasable is the sustained failure mode: main goes red and staging
      # freezes at the last good content instead of feeding broken code to testers through
      # promotion. That is this gate.
      #
      # WHAT IT DOES NOT BUY, stated so nobody reads more into a green deploy than is there: a
      # commit can deploy and then fail its own tests. The gate catches the state, not the event.
      #
      # `cancelled` IS NOT A VERDICT. It means a newer push superseded that run, so it is skipped
      # when looking for the last real conclusion -- treating it as failure would freeze staging on
      # ordinary cohort traffic.
      #
      # IF THE QUERY ITSELF FAILS the deploy PROCEEDS and says loudly that the gate did not run.
      # This is the one place I am choosing availability over failing closed, deliberately: a
      # GitHub API blip must not become a deploy freeze, and the honest report is "I could not
      # measure" rather than a silent pass OR a stop. The notice is the record.
      - name: Is main currently known-broken?
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.health_gate_drill }}" = "true" ]; then
            echo "::notice title=Health-gate DRILL::verdict forced to red; the deploy steps below must show as skipped."
            echo "verdict=red" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # STALE READS (Lead, 10-06/07): three times this query returned a weeks-old failed run as the
          # newest completed one (5ab4a021, 7bfac28f, db3e33b3) while current runs were green, and the
          # gate skipped staging silently. Lead's interim 48h guard (20364e9c03) is replaced by this
          # block, at Lead's ask. Re-run ten minutes later, the same query was correct. So nothing here
          # trusts the API's ordering or completeness: no server-side status filter (completed is
          # selected below), our own newest-first sort on created_at, and an age ceiling on the verdict.
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
                    -f branch=main -f per_page=40 \
                    --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[]
                          | [.conclusion, .head_sha, .html_url, .created_at] | @tsv' 2>/dev/null)" || runs="__QUERY_FAILED__"

          if [ "$runs" = "__QUERY_FAILED__" ]; then
            echo "::warning title=Deploy health gate did not run::Could not read Tests run history for this repo. Deploying anyway -- an API failure must not freeze deploys -- but this deploy carries NO assertion that main is green."
            echo "verdict=unmeasured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First row whose conclusion is an actual verdict. See the note on `cancelled` above.
          verdict=""; vsha=""; vurl=""; vcreated=""
          while IFS=$'\t' read -r concl sha url created; do
            case "$concl" in
              success|failure|timed_out) verdict="$concl"; vsha="$sha"; vurl="$url"; vcreated="$created"; break ;;
            esac
          done <<<"$runs"

          if [ -z "$verdict" ]; then
            # startup_failure is NOT a verdict (Arch reversed his own call, 2026-10-04, on Pard's
            # argument): like cancelled, a suite that never started says nothing about the code. But a
            # PERSISTENT start failure is a real fault, so it surfaces as a warning, not a notice.
            newest="$(printf '%s\n' "$runs" | head -1 | cut -f1)"
            if [ "$newest" = "startup_failure" ]; then
              echo "::warning title=Tests cannot start::Tests has not reached a verdict in the last 40 runs returned, and the newest one failed to start. Deploying (no verdict is not red), but fix the suite's startup."
            else
              echo "::notice title=No concluded Tests run::No Tests run on main has reached a verdict in the last 40 runs returned. Deploying; nothing says main is broken."
            fi
            echo "verdict=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AGE CEILING. Tests concludes several times a day on main (97 Tests-triggering commits in 7
          # days, measured 10-04), so a newest verdict older than 72h is far likelier a stale read than
          # a quiet repo. Treated like a failed query -- unmeasured, deploy, say so loudly -- because
          # that is this gate's standing choice for "GitHub could not tell me", and a stale read is that.
          vage=$(( $(date -u +%s) - $(date -u -d "$vcreated" +%s 2>/dev/null || echo 0) ))
          if [ -z "$vcreated" ] || [ "$vage" -gt $((72*3600)) ]; then
            echo "::warning title=Deploy health gate: stale read suspected::The newest concluded Tests run returned was ${vcreated:-undated} (${verdict}, ${vsha}) -- older than 72h, so the API answer is not trusted. Deploying WITHOUT an assertion that main is green. Run: ${vurl}"
            echo "verdict=unmeasured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "last concluded Tests on main: $verdict ($vsha, created $vcreated) $vurl"
          if [ "$verdict" = "success" ]; then
            echo "verdict=green" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=red" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped, main is red::The last concluded Tests run on main was '${verdict}' (${vsha}). Skipping rather than failing -- staging stays on its last good content instead of serving code the suite rejected. Fix main and the next push deploys. Run: ${vurl}"
          fi

      - name: Check for the staging token
        id: gate
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped::FLY_API_TOKEN_STAGING is not set. \
          This workflow is installed and correct; it is waiting on PM to mint a deploy token scoped \
          to piper-morgan-staging and add it as a repository secret. Skipping rather than failing, \
          deliberately -- see the header of .github/workflows/fly-deploy.yml."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to the commit behind release 1.5 (Arch review, 2026-09-29). Both jobs that load this
      # action also hold a deploy token, and @master is whatever that repo's tip happens to be on
      # the day it runs -- an unreviewed third party in the same job as a credential.
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        if: steps.gate.outputs.present == 'true' && steps.health.outputs.verdict != 'red'

      - name: Deploy main to piper-morgan-staging
        if: steps.gate.outputs.present == 'true' && steps.health.outputs.verdict != 'red'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        run: |
          # --build-arg PIPER_GIT_SHA is the whole point: the running app attests the commit it was
          # built from, with nobody typing `git rev-parse` by hand. Dockerfile:61-62 consumes it.
          flyctl deploy \
            --app piper-morgan-staging \
            --remote-only \
            --build-arg PIPER_GIT_SHA="${GITHUB_SHA}" \
            --wait-timeout 600

      - name: Verify staging reports the sha we just deployed
        if: steps.gate.outputs.present == 'true' && steps.health.outputs.verdict != 'red'
        run: |
          # A deploy that "succeeded" is not the claim worth making. The claim is that the RUNNING
          # app reports this sha -- that is the thing #1849 asks for, and asserting anything less
          # would repeat the `pane fg=` mistake in a different system.
          for i in $(seq 1 30); do
            got="$(curl -fsS --max-time 10 https://piper-morgan-staging.fly.dev/health \
                   | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' 2>/dev/null || true)"
            [ "$got" = "$GITHUB_SHA" ] && { echo "staging attests ${got}"; exit 0; }
            sleep 10
          done
          echo "::error title=Deployed sha not attested::staging /health reports '${got:-<unreadable>}', expected ${GITHUB_SHA}"
          exit 1

  # --- (c) promotion to alpha: deliberate, reviewer-gated, and it REUSES staging's image. -------
  promote-alpha:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_alpha
    runs-on: ubuntu-latest
    # The required reviewer lives on THIS environment, which is also the only place alpha's token
    # exists. That is what makes "a push to main cannot reach testers" a property of GitHub rather
    # than a property of everyone remembering. Configure in Settings -> Environments -> alpha.
    environment: alpha
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # parity check compares refs

      # Pinned to the commit behind release 1.5 (Arch review, 2026-09-29). Both jobs that load this
      # action also hold a deploy token, and @master is whatever that repo's tip happens to be on
      # the day it runs -- an unreviewed third party in the same job as a credential.
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Read the image AND the sha currently running on staging
        id: img
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        run: |
          # 2026-10-07 (Lead, first REAL promotion failed here): `flyctl status --json` has no top-level
          # `ImageRef` on Machines (it never did on this platform version — only drills had run, and
          # they skip this step). The deployed image is each started machine's `config.image`
          # (registry.fly.io/piper-morgan-staging:deployment-…). All started machines must agree;
          # zero or several distinct images (a roll in progress) print "" and refuse below.
          ref="$(flyctl status --app piper-morgan-staging --json \
                 | python3 -c 'import sys,json; m=[x for x in json.load(sys.stdin).get("Machines",[]) if x.get("state")=="started"]; i={x.get("config",{}).get("image","") for x in m}; print(i.pop() if len(i)==1 else "")')"
          if [ -z "$ref" ]; then
            echo "::error title=No staging image::Could not read one image from piper-morgan-staging's started machines (none, or a roll in progress)."
            exit 1
          fi
          # CAPTURE THE SHA HERE, ONCE (Arch review, 2026-09-29). It is used twice below -- for the
          # parity gate and for the post-promotion assertion -- and both must refer to the SAME moment.
          # Re-reading staging later is wrong now that (b) is live: staging tracks main continuously, so
          # it can move between the promotion and the check, and the assertion would false-fail on a
          # deploy that actually worked.
          sha="$(curl -fsS --max-time 10 https://piper-morgan-staging.fly.dev/health \
                 | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))')"
          if [ -z "$sha" ]; then
            echo "::error title=No staging sha::staging /health did not report git_sha; refusing to promote an unidentified image."
            exit 1
          fi
          # TORN READ GUARD (Arch re-review, 2026-09-29). ImageRef and the sha come from two separate
          # calls, and since the concurrency split made promotions and staging deploys run concurrently,
          # a deploy landing between them leaves this job holding image A with sha B: parity checks B,
          # the promotion ships A, verify expects B and fails. Arch named it and did NOT ask for a fix,
          # because it fails LOUD rather than passing silently -- a spurious red on a rare race.
          #
          # Fixing it anyway, because a spurious red is the same disease I argued against two hours
          # earlier when I made the staging job SKIP rather than fail: noise teaches people to ignore
          # the workflow, and I would rather not ship an exception to my own argument. Re-read the ref
          # and require it unchanged -- if staging moved under us, say so plainly and let the operator
          # dispatch again against a settled staging.
          ref2="$(flyctl status --app piper-morgan-staging --json \
                  | python3 -c 'import sys,json; m=[x for x in json.load(sys.stdin).get("Machines",[]) if x.get("state")=="started"]; i={x.get("config",{}).get("image","") for x in m}; print(i.pop() if len(i)==1 else "")')"
          if [ "$ref2" != "$ref" ]; then
            echo "::error title=Staging moved mid-read::piper-morgan-staging deployed while this job was reading it (${ref} -> ${ref2}). Nothing was promoted. Re-run the dispatch once staging has settled."
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "promoting image: $ref  (sha $sha)"

      - name: Content-parity gate
        run: |
          # Arch's ruling: parity belongs on the PROMOTION step, not the staging deploy. Staging is
          # supposed to track main continuously; alpha is the cut that must be explainable.
          #
          # THE REF ARGUMENT IS LOAD-BEARING (Arch review, 2026-09-29 -- a blocking defect I shipped).
          # I called this with no argument. Since fcbba9f3f2 (#1413) the script REFUSES a ref-less run
          # -- "REFUSING TO MEASURE NOTHING" -- and exits 2, so the promote job could never have passed.
          # Reproduced before fixing: no-arg -> exit 2; with a sha -> "PARITY OK", exit 0. It failed
          # closed, so nothing unsafe could ship, but (c) was inert.
          scripts/check-release-parity.sh "${{ steps.img.outputs.sha }}"

      - name: Copy that exact image into alpha's own registry repository
        id: copy
        env:
          STAGING_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
          ALPHA_TOKEN: ${{ secrets.FLY_API_TOKEN_ALPHA }}
          SRC: ${{ steps.img.outputs.ref }}
          SHA: ${{ steps.img.outputs.sha }}
        run: |
          # 2026-10-07 (Lead; Pard's fix (b)): the first real promote reached `flyctl deploy --image
          # registry.fly.io/piper-morgan-staging:…` and Fly refused it — "Not authorized to access this
          # imageref". Alpha's token is APP-scoped, so Fly's deploy API won't hand it another app's
          # image even though a raw registry read works (Pard measured that 13:0x). Instead of a
          # broader org-scoped token (PM's call, not needed), pull with STAGING's token and push the
          # SAME image (same layers, same digest) into piper-morgan's own repository with ALPHA's
          # token. Never a rebuild.
          set -euo pipefail
          DST="registry.fly.io/piper-morgan:promote-${SHA:0:12}"
          echo "$STAGING_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker pull "$SRC"
          src_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SRC")"
          docker tag "$SRC" "$DST"
          docker logout registry.fly.io
          echo "$ALPHA_TOKEN" | docker login registry.fly.io -u x --password-stdin
          docker push "$DST"
          docker logout registry.fly.io
          echo "copied $SRC ($src_digest) -> $DST"
          echo "ref=$DST" >> "$GITHUB_OUTPUT"

      - name: Promote that exact image to alpha
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ALPHA }}
        run: |
          # --image, never a rebuild. Rebuilding from a tag would produce a DIFFERENT artifact from
          # the one that was smoke-driven, which is the exact gap this step exists to close. The
          # image is the copy in alpha's OWN repository (step above) — same bytes as staging's.
          flyctl deploy \
            --app piper-morgan \
            --image "${{ steps.copy.outputs.ref }}" \
            --wait-timeout 600

      - name: Verify alpha is serving the sha we promoted
        env:
          EXPECTED: ${{ steps.img.outputs.sha }}
        run: |
          # Compare against the sha CAPTURED BEFORE the deploy, not a fresh read of staging. Staging
          # tracks main continuously now, so a re-read could have moved on and would false-fail a
          # promotion that succeeded (Arch review, 2026-09-29).
          for i in $(seq 1 30); do
            got="$(curl -fsS --max-time 10 https://alpha.pipermorgan.ai/health \
                   | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' 2>/dev/null || true)"
            [ -n "$got" ] && [ "$got" = "$EXPECTED" ] && { echo "alpha attests ${got}, which is the sha promoted"; exit 0; }
            sleep 10
          done
          # If this ever fires with alpha serving a COHERENT but different sha, the leading hypothesis
          # is already written down -- Arch, 2026-09-29, and it is explicitly UNVERIFIED. A staging
          # deploy in progress across all three reads in the `img` step could give ref=B, sha=A,
          # ref2=B: the torn-read guard passes, parity runs on A, and B gets promoted. Nobody has
          # observed it, because nothing has run yet. Naming it here rather than building the fix for
          # it: the structural answer is to stop pairing two surfaces and read the sha from the image
          # itself (a Docker LABEL fed by the same PIPER_GIT_SHA build arg), which makes ref and sha
          # ONE read. That is worth doing if this signature appears, and is speculative hardening if
          # it does not.
          echo "::error title=Promotion not attested::alpha reports '${got:-<unreadable>}', expected ${EXPECTED}. If alpha is serving a coherent-but-different sha, suspect the mid-rollout window on the staging read (Arch, 2026-09-29, unverified): fix is a PIPER_GIT_SHA image LABEL so ref and sha are one read. See the comment above this line."
          exit 1
