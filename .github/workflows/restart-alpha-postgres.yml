# Concept: docs/internal/operations/alpha-liveness-watch-and-restart.md (added 2026-11-01, sunset-or-renew inventory; CIO)
# Restart alpha's Postgres machine (#2085 track 1, the external restarter).
#
# Why this exists (2026-10-21): twice in three days the kernel OOM-killed Postgres inside
# piper-morgan-db's one machine while the machine stayed `started`. Fly's restart policy
# (`always`, already set) acts on machine exit, and Fly's Postgres image lets Postgres exit
# without exiting the machine (PA's read of fly-apps/postgres-flex), so nothing restarted it
# and each outage waited for a person at a terminal. xian ruled 15:11: build this, after
# main is protected (a path rule on this file, CIO's proposal), and run it behind the
# `alpha-db` environment with xian as the required reviewer. A seat dispatches it on an open
# health-watch alert; GitHub asks xian to approve; the run log is the record.
#
# Guards (Arch 2026-10-21 12:28), in order, before the one restart:
#   1. Refuse unless the fault is the database's: alpha's /health must read the database as
#      not healthy AND the Postgres machine's own `pg` check must read failing. An unreachable
#      but healthy database (network, DNS, a proxy) is not cured by a restart.
#   2. One restart, then stop: refuse if any run of this workflow, whatever its conclusion,
#      restarted the machine in the last 30 minutes (an uncured restart FAILS its own run, so
#      the step's outcome is read, never the run's). A restart that doesn't cure must reach a
#      person, not loop.
#   3. Capture before you restart: the machine's state and events and the last Postgres
#      log lines go into the run log first, because a restart erases the evidence.
# Custody (HOST 2026-10-21 12:42): the token lives only as the environment secret
# FLY_API_TOKEN_ALPHA_DB (scoped to piper-morgan-db, created by xian); the capture prints
# machine state and Postgres messages only, filtered for anything that looks like a
# credential or an environment value; nothing here echoes the environment.
#
# After the restart the job polls alpha's /health; if the database still does not answer
# within three minutes the job FAILS, so the failure email reaches a person. Either way it
# comments on the open "Alpha health watch: failing" issue with the run URL.
name: Restart alpha Postgres

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (the alert issue number, or the attended test's name)"
        type: string
        required: true

concurrency:
  group: restart-alpha-postgres
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  restart:
    runs-on: ubuntu-latest
    environment: alpha-db
    timeout-minutes: 15
    env:
      DB_APP: piper-morgan-db
      DB_MACHINE: "865105fe247158"
      HEALTH_URL: https://alpha.pipermorgan.ai/health
      ALERT_TITLE: "Alpha health watch: failing"
    steps:
      - name: Guard 1a, alpha's own verdict says the database is not healthy
        id: health
        shell: bash
        run: |
          set -u
          body="$(curl -fsS --max-time 10 "$HEALTH_URL" || true)"
          db="$(printf '%s' "$body" | python3 -c 'import sys,json
          try:
              d=json.load(sys.stdin)
          except Exception:
              print("unreadable"); raise SystemExit
          v=(d.get("services") or {}).get("database"); print(v if isinstance(v,str) and v else "missing")')"
          echo "alpha services.database reads: $db"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          if [ "$db" = "healthy" ]; then
            echo "::error title=Database is healthy::alpha /health reads services.database healthy; a restart would only add an outage. Nothing restarted."
            exit 1
          fi

      # Pinned to the commit behind release 1.5, as fly-deploy.yml does (Arch review 2026-09-29).
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Guard 1b, the Postgres machine's own pg check reads failing
        id: pgcheck
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ALPHA_DB }}
        run: |
          set -u
          # 2026-10-22 (xian's token block): `flyctl checks list` lists every machine in the app
          # (flaps ListActive) and the one-machine caveat refuses that ("failed to list active
          # VMs: unauthorized"). Read the one machine instead: the Machines API's GET returns it
          # with its `checks` list, which the parser below already reads. Fly's client sends a
          # macaroon token as "FlyV1 <token>" (fly-go tokens.FlapsHeader); the secret may or may
          # not carry the scheme, so add it only when absent. The token is never echoed.
          case "$FLY_API_TOKEN" in
            "FlyV1 "*) auth="$FLY_API_TOKEN" ;;
            *) auth="FlyV1 $FLY_API_TOKEN" ;;
          esac
          checks="$(curl -fsS --max-time 15 -H "Authorization: $auth" \
            "https://api.machines.dev/v1/apps/$DB_APP/machines/$DB_MACHINE" 2>/dev/null || echo '{}')"
          unset auth
          pg="$(printf '%s' "$checks" | python3 -c 'import sys,json
          try:
              rows=json.load(sys.stdin)
          except Exception:
              rows=[]
          # PA (15:48, run on the live app): flyctl prints a dict keyed by machine id, each value
          # a list of checks with lower-case name/status keys. The two list shapes are kept in
          # case a flyctl release changes it; anything else reads absent and refuses.
          flat=[]
          if isinstance(rows,dict):
              for v in rows.values():
                  flat.extend([c for c in v if isinstance(c,dict)] if isinstance(v,list) else [])
          elif isinstance(rows,list):
              for r in rows:
                  if isinstance(r,dict) and "checks" in r and isinstance(r["checks"],list):
                      flat.extend([c for c in r["checks"] if isinstance(c,dict)])
                  elif isinstance(r,dict):
                      flat.append(r)
          st=[c.get("status") or c.get("Status") for c in flat if (c.get("name") or c.get("Name"))=="pg"]
          print((st[0] or "unknown").lower() if st else "absent")')"
          echo "pg check reads: $pg"
          echo "pg=$pg" >> "$GITHUB_OUTPUT"
          # Arch (15:29): Fly checks read passing, warning or critical. A warning is the
          # uncertain reading (a slow boot, a timeout under load), and uncertain meaning never
          # writes; a restart is a write. Only critical restarts.
          case "$pg" in
            critical) ;;
            *)
              echo "::error title=pg check is not critical::the Postgres machine's own pg check reads '${pg}'. Only a critical check shows the fault is the database's; a warning that lasts turns critical and the next dispatch can take it. Nothing restarted."
              exit 1 ;;
          esac

      - name: Guard 2, one restart per thirty minutes (and a second automatic restart in 24 hours stops)
        id: guard2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          # #2146 (Exec's condition): a run the health watch dispatched is triggered by the bot;
          # no dispatch input can set this.
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -u
          # Arch (15:29): a restart that does not cure FAILS its run (the verify step), so a read
          # of successful runs would miss exactly the restart this guard exists to stop. Read
          # every recent run of this workflow and ask whether its restart step itself succeeded.
          # #2146 (Arch, condition A): read by TIME, not by count. Under auto-dispatch most runs
          # end at guard 1a/1b, so ten runs can span under an hour and a restart 40 minutes ago
          # would fall out of a count window (fail open). Every run created in the last 24 hours
          # is read; a full page means runs may be unseen, so it refuses (fail closed, #1778).
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          limit=200
          listing="$(gh run list --workflow restart-alpha-postgres.yml --created ">=$since" --limit "$limit" --json databaseId,updatedAt)" || { echo "::error title=Restart history unreadable::guard 2 could not list this workflow's runs; refusing rather than guessing. Nothing restarted."; exit 1; }
          count="$(printf '%s' "$listing" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')"
          if [ "$count" -ge "$limit" ]; then
            echo "::error title=Restart history page full::$count runs in 24 hours fills the page, so runs may be unseen; refusing rather than guessing. Nothing restarted."
            exit 1
          fi
          ids="$(printf '%s' "$listing" | python3 -c 'import sys,json,os
          for r in json.load(sys.stdin):
              if str(r["databaseId"]) != os.environ["THIS_RUN"]:
                  print(r["databaseId"], r["updatedAt"])')"
          runs="["; sep=""
          while read -r id at; do
            [ -z "$id" ] && continue
            # Arch (15:45): a run that cannot be read must never read as clear; "clear" licenses
            # a restart, and a wrong refusal costs one manual restart by the reviewer.
            jobs="$(gh run view "$id" --json jobs --jq '.jobs' 2>/dev/null)" || { echo "::error title=Cannot read run $id::guard 2 could not read run $id of this workflow; refusing rather than guessing that it did not restart the machine. Nothing restarted."; exit 1; }
            # #2146 (Arch 12:5x): the 24-hour stop counts only AUTOMATIC earlier restarts, so a
            # person's restart (an attended test, a hand recovery) never switches auto-recovery
            # off for a day. An actor that can't be read counts as automatic (fail closed).
            actor="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.triggering_actor.login // ""' 2>/dev/null)" || actor=""
            runs="$runs$sep{\"updatedAt\":\"$at\",\"actor\":\"$actor\",\"jobs\":$jobs}"; sep=","
          done <<< "$ids"
          runs="$runs]"
          decide="$(printf '%s' "$runs" | AUTO="$([ "$TRIGGER_ACTOR" = "github-actions[bot]" ] && echo 1 || echo 0)" python3 -c 'import sys,json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc)
          try:
              runs=json.load(sys.stdin)
          except Exception:
              print("block unreadable"); raise SystemExit
          hits=[]
          auto_hits=[]
          for r in runs:
              try:
                  age=(now-datetime.strptime(r["updatedAt"],"%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)).total_seconds()
              except Exception:
                  print("block unreadable"); raise SystemExit
              # the restart step counts if it ran at all: a restart issued and then cancelled, or
              # one that errored after Fly accepted it, may still have restarted the machine
              restarted=any((s.get("name") or "").startswith("Restart the Postgres machine") and s.get("conclusion") in ("success","failure","cancelled") for j in (r.get("jobs") or []) for s in (j.get("steps") or []))
              if restarted:
                  hits.append(int(age))
                  if (r.get("actor") or "") in ("github-actions[bot]", ""):
                      auto_hits.append(int(age))
          recent=[h for h in hits if h<1800]
          if recent:
              print("block %d" % min(recent))
          elif auto_hits and os.environ.get("AUTO")=="1" and min(auto_hits)<86400:
              print("stop24 %d" % min(auto_hits))
          else:
              print("clear")')"
          echo "guard 2 reads: $decide (triggered by: $TRIGGER_ACTOR)"
          case "$decide" in
            "block unreadable")
              echo "::error title=Restart history unreadable::guard 2 could not parse this workflow's recent runs; refusing rather than guessing. Nothing restarted."
              exit 1 ;;
            stop24*)
              echo "stop24=${decide#stop24 }" >> "$GITHUB_OUTPUT"
              echo "::error title=A second automatic restart within 24 hours::this workflow restarted the machine automatically ${decide#stop24 }s ago and the database failed again. A recurring fault (out of memory, a bad config) must reach a person, not cycle. Nothing restarted; the alert issue gets a comment."
              exit 1 ;;
            block*)
              echo "::error title=A restart already ran in the last 30 minutes::this workflow restarted the machine ${decide#block }s ago (whatever that run's conclusion) and the database is still not healthy. A restart that does not cure must reach a person, not loop. Nothing restarted."
              exit 1 ;;
          esac

      - name: Guard 3, capture state, events and the last Postgres log lines before restarting
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ALPHA_DB }}
        run: |
          set -u
          # Arch (15:29): "capture before restart", not "no restart without a capture". Actions
          # runs bash with -e -o pipefail; every read here is best-effort, and what could not be
          # read shows as a line, never as a failed step that stops the restart.
          set +o pipefail
          # Machine state and Postgres messages only. The filter drops any line that looks like
          # a credential or an environment value (HOST's custody line 3); nothing echoes env.
          filter() { grep -v -i -E 'password|secret|token|DATABASE_URL|postgres://|authorization|api[_-]?key|BEGIN [A-Z ]*PRIVATE' || true; }
          cap() { label="$1"; shift; { "$@" 2>&1 || echo "(not captured: $label)"; } | filter; }
          echo "===== machine status ($DB_MACHINE) ====="
          cap "machine status" flyctl machine status "$DB_MACHINE" --app "$DB_APP" --display-config | head -n 120
          echo "===== checks ====="
          cap "checks (machine status)" flyctl machine status "$DB_MACHINE" --app "$DB_APP" | grep -i -A 8 "checks" | head -n 20
          echo "===== last Postgres log lines ====="
          cap "last Postgres log lines" flyctl logs --app "$DB_APP" --no-tail | tail -n 100
          echo "===== kernel messages (oom) ====="
          cap "kernel oom lines (ssh)" flyctl ssh console --app "$DB_APP" --machine "$DB_MACHINE" -C "sh -c 'dmesg 2>/dev/null | grep -i -E \"oom|out of memory|killed process\" | tail -n 20'" | tail -n 20
          echo "===== capture done; the restart follows ====="

      - name: Restart the Postgres machine (once)
        id: restart
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ALPHA_DB }}
          REASON: ${{ inputs.reason }}
        run: |
          set -u -o pipefail
          # The dispatch input reaches the script through env, never interpolated into it (Arch,
          # 2026-10-22: an input expression written into the script is a shell-injection shape).
          echo "reason: $REASON"
          # 2026-10-22 attended test (run 39876329580): flyctl's machine-restart command takes a machine
          # lease first (flaps machineAcquireLease) and Fly refused the one-machine token that
          # call: "failed to get lease on VM ...: unauthorized". Arch's ruling (route 1): POST the
          # Machines API restart directly, with no lease and no new token. fly-go's Restart sends
          # a lease nonce only when one is held, so a lease-free restart is the client's own
          # shape. Our runs are serialized by `concurrency` and guard 2; a machine leased by
          # someone else refuses an un-nonced change, which fails this step loudly (right: never
          # restart under another change). No force_stop and no signal, so Fly's defaults apply,
          # as flyctl's would. Same header handling as guard 1b; the token is never echoed.
          case "$FLY_API_TOKEN" in
            "FlyV1 "*) auth="$FLY_API_TOKEN" ;;
            *) auth="FlyV1 $FLY_API_TOKEN" ;;
          esac
          code="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: $auth" \
            "https://api.machines.dev/v1/apps/$DB_APP/machines/$DB_MACHINE/restart" 2>/dev/null || true)"
          unset auth
          # curl prints 000 itself when nothing answered; an empty value means the same.
          [ -n "$code" ] || code=000
          case "$code" in
            2??) echo "restart accepted: HTTP $code" ;;
            *)
              echo "::error title=Restart refused::the Machines API answered HTTP $code (000 means no answer within 60 s). Nothing retries; the database is still down and needs a person."
              exit 1 ;;
          esac
          echo "restarted_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Verify alpha reads the database healthy within three minutes
        id: verify
        shell: bash
        run: |
          set -u
          ok=no
          for i in $(seq 1 18); do
            sleep 10
            db="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null | python3 -c 'import sys,json
          try:
              print(((json.load(sys.stdin).get("services") or {}).get("database")) or "missing")
          except Exception:
              print("unreadable")' || echo unreadable)"
            echo "$(date -u +%H:%M:%S) probe $i services.database=$db"
            if [ "$db" = "healthy" ]; then ok=yes; break; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "yes" ]; then
            echo "::error title=Database still not healthy after the restart::alpha /health did not read services.database healthy within three minutes of the restart. The restart did not cure it; a person is needed."
            exit 1
          fi
          echo "alpha reads the database healthy after the restart"

      - name: Comment on the open alert issue when the 24-hour stop refuses
        if: failure() && steps.guard2.outputs.stop24 != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGO: ${{ steps.guard2.outputs.stop24 }}
        run: |
          set -u
          line="Automatic restart REFUSED: the database failed again ${AGO}s after an automatic restart (second within 24 hours). A person needs to look; the machine was not restarted. Run: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$ALERT_TITLE\"" --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | head -1)
          if [ -n "$number" ]; then gh issue comment "$number" --body "$line"; echo "commented on #$number"; else echo "no open alert issue; the run's failure is the alert"; fi

      - name: Comment on the open alert issue
        if: always() && steps.restart.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OK: ${{ steps.verify.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -u
          when=$(date -u +'%Y-%m-%d %H:%M:%SZ')
          if [ "$OK" = "yes" ]; then
            line="RESTARTED the Postgres machine ($when; reason: $REASON): alpha reads the database healthy again. Capture before the restart is in the run log: $RUN_URL"
          else
            line="RESTARTED the Postgres machine ($when; reason: $REASON) but alpha still does not read the database healthy: a person is needed. Run: $RUN_URL"
          fi
          number=$(gh issue list --state open --search "in:title \"$ALERT_TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$ALERT_TITLE\")][0].number // empty")
          if [ -n "$number" ]; then gh issue comment "$number" --body "$line"; echo "commented on #$number"; else echo "no open alert issue; nothing to comment on"; fi
