name: Configuration Validation

# Configuration Validation Workflow — fires on service config / YAML / architecture changes
# Category: services + config + YAML/YML + architecture docs + workflow-self-edits
# Excludes: docs/mailboxes/dev/skills/hooks (no config impact)
# See: GH Actions refactor Phase 1 (2026-05-27)

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'config/**'
      - '*.yaml'
      - '*.yml'
      - 'docs/internal/architecture/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'config/**'
      - '*.yaml'
      - '*.yml'
      - 'docs/internal/architecture/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-validation:
    runs-on: ubuntu-latest
    name: Validate Service Configurations

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Configuration Structure
        run: |
          echo "🔍 CORE-GREAT-2D: Configuration Validation"
          echo "=========================================="
          python -c "
          import sys
          sys.path.insert(0, '.')

          from services.infrastructure.config.config_validator import ConfigValidator

          print('\\n📋 Running Configuration Validation...')
          validator = ConfigValidator()
          validator.validate_all()
          validator.print_summary()

          # In CI, we expect configurations to be missing (no secrets in repo)
          # This validates the STRUCTURE is correct, not that configs exist

          # Check that validator works
          summary = validator.get_summary()
          print(f\"\\n✅ Configuration validator operational\")
          print(f\"Services checked: {len(summary['services'])}\")

          # In CI, we expect most services to be missing (no secrets in repo)
          # Some services (like calendar) might be valid if config files exist
          missing_count = sum(1 for service in summary['services'].values() if service['status'] == 'missing')
          total_services = len(summary['services'])

          if missing_count >= total_services - 1:  # Allow 1 service to be configured
              print(f\"✅ Expected state: {missing_count}/{total_services} services missing credentials (CI environment)\")
              if summary['valid_count'] > 0:
                  print(f\"ℹ️ {summary['valid_count']} service(s) configured (acceptable in CI)\")
          else:
              print(f\"⚠️ Unexpected state: Only {missing_count}/{total_services} services missing (too many configured)\")

          print(f\"\\n✅ Configuration validation structure: PASSED\")
          "

      - name: Verify ConfigValidator Module
        run: |
          echo "🔍 Verifying ConfigValidator module structure..."
          python -c "
          import sys
          sys.path.insert(0, '.')

          from services.infrastructure.config.config_validator import (
              ConfigValidator,
              ValidationResult,
              ServiceStatus,
              validate_configuration
          )

          # Verify classes
          assert ConfigValidator is not None, 'ConfigValidator class not found'
          assert ValidationResult is not None, 'ValidationResult class not found'
          assert ServiceStatus is not None, 'ServiceStatus enum not found'

          # Verify methods
          validator = ConfigValidator()
          assert hasattr(validator, 'validate_all'), 'validate_all method missing'
          assert hasattr(validator, '_validate_github'), '_validate_github method missing'
          assert hasattr(validator, '_validate_slack'), '_validate_slack method missing'
          assert hasattr(validator, '_validate_notion'), '_validate_notion method missing'
          assert hasattr(validator, '_validate_calendar'), '_validate_calendar method missing'
          assert hasattr(validator, 'is_all_valid'), 'is_all_valid method missing'
          assert hasattr(validator, 'get_summary'), 'get_summary method missing'

          print('✅ All ConfigValidator components verified')
          "

      - name: Test Configuration Validation Function
        run: |
          echo "🔍 Testing configuration validation function..."
          python -c "
          import sys
          sys.path.insert(0, '.')

          from services.infrastructure.config.config_validator import validate_configuration

          # Run validation (will show missing configs - expected in CI)
          result = validate_configuration(print_results=False)

          # In CI, all configs should be missing (result = False)
          # This is expected behavior
          if not result:
              print('✅ Expected: Configurations missing in CI environment')
          else:
              print('⚠️ Unexpected: Some configurations present in CI')

          print('✅ validate_configuration() function working correctly')
          "

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "✅ Configuration Validation: PASSED"
          echo ""
          echo "This workflow validates that:"
          echo "  1. ConfigValidator module structure is correct"
          echo "  2. All validation methods exist and are callable"
          echo "  3. Validation logic executes without errors"
          echo "  4. Summary and reporting functions work"
          echo ""
          echo "Note: In CI, all services are expected to show"
          echo "'missing' status (no secrets in repository)."
          echo "This validates the STRUCTURE, not the presence"
          echo "of actual credentials."
          echo "=========================================="

  # Ported from the retired ci.yml (2026-08-13, PM-directed retirement with gap
  # audit): this BEHAVIORAL test (valid config accepted, invalid config
  # rejected, startup gating) covered ground the structure-only job above does
  # not. The retirement audit found it live-green inside the otherwise-red
  # workflow; porting rather than losing it.
  behavioral-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Configuration Validation Test
      run: |
        echo "🔍 Testing configuration validation system..."

        # Create test configuration file
        mkdir -p config
        cat > config/PIPER.test.md << 'EOF'
        ## GitHub
        - api_token: ghp_test_token_1234567890abcdef
        - organization: test-org
        - repository: test-repo

        ## Slack
        - workspace_id: T1234567890
        - bot_token: xoxb-test-token-1234567890
        - signing_secret: test_signing_secret_32_characters

        ## Notion
        - api_key: secret_test_notion_key_1234567890
        - database_ids: ["db1", "db2"]

        ## Calendar
        - credentials_path: test_credentials.json
        - calendar_ids: ["primary"]
        EOF

        # Create test credentials file
        cat > test_credentials.json << 'EOF'
        {
          "type": "service_account",
          "client_email": "test@test.iam.gserviceaccount.com",
          "private_key": "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
        }
        EOF

        # Test configuration validation (should work with test config)
        echo "✅ Testing valid configuration..."
        python -c "
        from services.config_validator import ConfigValidator
        validator = ConfigValidator('config/PIPER.test.md')
        results = validator.validate_all_services()
        report = validator.format_validation_report(results)
        print(report)
        startup_allowed = validator.is_startup_allowed(results)
        print(f'Startup allowed: {startup_allowed}')
        "

        # Test with invalid configuration
        echo "❌ Testing invalid configuration handling..."
        cat > config/PIPER.invalid.md << 'EOF'
        ## GitHub
        - api_token: invalid_token

        ## Slack
        - bot_token: invalid_token
        EOF

        python -c "
        from services.config_validator import ConfigValidator
        validator = ConfigValidator('config/PIPER.invalid.md')
        results = validator.validate_all_services()
        startup_allowed = validator.is_startup_allowed(results)
        if not startup_allowed:
            print('✅ Invalid configuration correctly rejected')
        else:
            print('❌ Invalid configuration incorrectly accepted')
            exit(1)
        "

        # Test main.py integration
        echo "🚀 Testing main.py startup integration..."
        timeout 10s python main.py --config config/PIPER.test.md --skip-validation || echo "✅ Startup test completed"

        # Clean up test files
        rm -f config/PIPER.test.md config/PIPER.invalid.md test_credentials.json

        echo "✅ Configuration validation CI tests completed"

