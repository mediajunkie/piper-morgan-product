[pytest]
pythonpath = .
markers =
    smoke: Critical path tests that should run in <5 seconds total
    unit: Unit tests that should run in <30 seconds total
    integration: Integration tests that may take up to 2 minutes
    performance: Performance tests
    benchmark: Benchmark tests
    regression: Performance regression tests to detect degradation
    contract: Contract tests verifying plugin interface compliance
    llm: Tests that require LLM API calls (skipped in CI without keys)
    github: Tests that require GitHub API token (skipped without GITHUB_TOKEN) - Issue #914
    transition: State transition tests (fresh install, setup flows) - Issue #485
    e2e: End-to-end HTTP tests with real services and database - Issue #352

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Performance optimizations for smoke tests
addopts =
    --ignore=tests/archive
    --ignore=*/archive/*
    --ignore=services/integrations/*/tests
    --ignore=services/mcp/server/test_*.py
    --ignore=dev/
    --tb=short
    -x
    --maxfail=1
    # LOAD-BEARING (2026-07-02, #1346): tests/ has duplicate basenames across
    # directories (e.g. test_narrative_bridge.py in 4 places) with inconsistent
    # __init__.py placement. Under pytest's default "prepend" import mode this
    # collides -- 21 collection errors tree-wide when this line is dropped. If
    # you're cleaning up addopts, or overriding it with `-o addopts=...` for a
    # one-off run (e.g. to drop --maxfail=1 above), you MUST keep this line or
    # you will silently re-break collection across ~20 files. Verified: keep it.
    --import-mode=importlib

# Async test configuration
asyncio_mode = auto
# Note: asyncio_default_fixture_loop_scope and asyncio_default_test_loop_scope are deprecated
# in pytest-asyncio 0.21.x - use asyncio_mode = auto (set above) instead.
# See Issue #290 for session-scoped event loop context.
