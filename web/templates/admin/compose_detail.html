<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} — Editorial Compose</title>
  <link rel="stylesheet" href="/static/admin/compose.css">
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p><a href="/admin/compose">&larr; back to list</a></p>
    <form>
      <label>
        Image filename:
        <input type="text" value="{{ frontmatter.image }}" readonly>
      </label>
      <label>
        Alt text:
        <input type="text" value="{{ frontmatter.alt }}" readonly>
      </label>
      <label>
        Caption:
        <input type="text" value="{{ frontmatter.caption }}" readonly>
      </label>
      <label>
        Body (read-only):
        <textarea readonly rows="30" cols="80">{{ body }}</textarea>
      </label>
    </form>
    <p class="phase-note">(Phase 1 scaffold — editing lands in Phase 2)</p>
  </main>
</body>
</html>
