<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Editorial Compose — Drafts</title>
  <link rel="stylesheet" href="/static/admin/compose.css">
</head>
<body>
  <main>
    <h1>Editorial Compose — Drafts Needing Finishing</h1>
    {% if drafts %}
      <ul class="draft-list">
        {% for d in drafts %}
          <li>
            <a href="/api/v1/admin/compose/{{ d.slug }}">{{ d.title }}</a>
            — {{ d.theme }}, pubDate {{ d.pubDate or "unscheduled" }}
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No drafts needing finishing.</p>
    {% endif %}
    <p class="phase-note">Phase 1 scaffold — read-only. Editing lands in Phase 2.</p>
  </main>
</body>
</html>
