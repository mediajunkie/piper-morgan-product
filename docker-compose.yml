# EXPLICIT PROJECT NAME - survives directory renames!
#
# One machine, more than one copy (issue 2386, Arch's ruling of 2026-11-16).
# Every name below starts with ${PIPER_STACK:-piper}, and the three data services read
# their host port from a variable. With nothing set, this file renders exactly as it did
# before: project piper-morgan-stable, containers piper-*, volume piper_postgres_data_v1,
# ports 5433, 6379 and 8000.
#
# A SECOND copy on a machine that already runs Piper must set, in its own .env, BEFORE
# the first `docker compose up`:
#     PIPER_STACK=piper2          (any name that is not in use)
#     POSTGRES_PORT=5543          (the app, the scripts and the setup page read this too)
#     REDIS_PORT=6479
#     REDIS_URL=redis://localhost:6479
#     CHROMADB_PORT=8100
# and start only the three data services: docker compose up -d postgres redis chromadb
# Without those lines the second copy joins the first copy's project: it shares its
# database, and compose may re-create its Redis and Chroma containers on the second
# copy's empty ./data folders. The other four services keep fixed ports; a clash there
# fails loudly and shares nothing.
name: ${PIPER_STACK:-piper}-morgan-stable

services:
  # Main Application - Piper Morgan API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PIPER_STACK:-piper}-app
    environment:
      - PYTHON_VERSION=3.11
      - PYTHONPATH=/app
      # #992 Phase F flag-flip — activates BoundaryEnforcer two-layer detection.
      # Gated on ADR-061 ratification per Lead Dev Apr 27 recommendation;
      # PM/PA holds final flip authorization. Default-off in code
      # (services/intent/intent_service.py:627) preserved for env without override.
      - ENABLE_ETHICS_ENFORCEMENT=true
      # Encrypt-at-rest master key (#358 / #358-B). Must be NAMED here — this service uses
      # an explicit `environment:` list, not `env_file:`, so .env is NOT auto-loaded into
      # the container. Empty default → encryption gracefully disabled if unset (local dev).
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      # #1343 incident (2026-07-02): main.py defaults PIPER_HOST to 127.0.0.1 (correct for
      # the bare `python main.py` desktop/CLI path — binding wider would expose a local
      # user's Piper to their LAN). But inside a container that default breaks BOTH Docker's
      # own port-mapping and sibling-container reachability (Caddy got "connection refused"
      # dialing the app container's bridge IP). Any compose-based run — local dev or the
      # droplet — needs 0.0.0.0 unconditionally; there's no compose scenario where
      # loopback-only-inside-the-container is desired. Previously this was patched only as
      # an undocumented, git-untracked edit directly on the droplet — which is exactly how
      # it got silently lost on the next clean deploy. Named here so it can't happen again.
      - PIPER_HOST=0.0.0.0
      # #1220 (Droplet-sidecar decision, PM+Arch 2026-07-07): the app reaches the
      # github-mcp-server sidecar below via compose DNS. Overridable per-env; the
      # code default (localhost:9100) covers bare non-compose runs.
      - GITHUB_MCP_SERVER_URL=http://github-mcp:8082/mcp
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8001"
    restart: unless-stopped

  # PostgreSQL - Main database
  postgres:
    image: postgres:15
    container_name: ${PIPER_STACK:-piper}-postgres
    restart: unless-stopped # 1594: data services must survive a host reboot
    environment:
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # NAMED VOLUME - survives everything!
      - piper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piper"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GitHub MCP server — the #1220 connector transport (Droplet-sidecar decision,
  # PM + Arch concur 2026-07-07; see decisions.log + the hosting brief memo).
  # Mirrors the proven local dev container exactly (image/command/port verified
  # via docker inspect of piper-ghmcp, not invented). No GitHub token env by
  # design: per ADR-070 D3/OQ-5 the server receives each user's OAuth token
  # per-connection from the app (the grant store), never a shared credential.
  github-mcp:
    # PINNED (2026-07-09, #1220): floating `latest` silently pulled the v1.2.0+
    # tool consolidation (create_issue -> issue_write etc.) under production and
    # broke the connector write path on deploy night. Version bumps are now
    # deliberate: bump this tag + the adapter tool constants + the FastMCP test
    # fixture together (services/mcp/consumer/github_adapter.py has the map).
    image: ghcr.io/github/github-mcp-server:v1.5.0
    container_name: ${PIPER_STACK:-piper}-ghmcp
    command: ["http", "--listen-host", "0.0.0.0"]
    ports:
      - "8082:8082"
    restart: unless-stopped

  # Redis - Cache and event queue
  redis:
    image: redis:7-alpine
    container_name: ${PIPER_STACK:-piper}-redis
    restart: unless-stopped # 1594: data services must survive a host reboot
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB - Vector database
  chromadb:
    image: chromadb/chroma:latest
    container_name: ${PIPER_STACK:-piper}-chromadb
    restart: unless-stopped # 1594: data services must survive a host reboot
    volumes:
      - ./data/chromadb:/chroma/chroma
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"

  # Temporal - Workflow orchestration (FIXED)
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ${PIPER_STACK:-piper}-temporal
    ports:
      - "7233:7233"
      - "8088:8088"
    environment:
      - DB=postgres12 # Fixed: needs to be postgres12, not postgres
      - DB_PORT=5432
      - POSTGRES_USER=piper
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-dev_changeme}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=piper_morgan
    depends_on:
      postgres:
        condition: service_healthy

  # Traefik - API Gateway (minimal config)
  traefik:
    image: traefik:v3.0
    container_name: ${PIPER_STACK:-piper}-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8090:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: ${PIPER_STACK:-piper}-network

volumes:
  # EXPLICIT VOLUME NAME - never loses data
  piper_postgres_data:
    name: ${PIPER_STACK:-piper}_postgres_data_v1 # Version it!
