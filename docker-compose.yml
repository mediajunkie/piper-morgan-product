# EXPLICIT PROJECT NAME - survives directory renames!
name: piper-morgan-stable

services:
  # Main Application - Piper Morgan API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piper-app
    environment:
      - PYTHON_VERSION=3.11
      - PYTHONPATH=/app
      # #992 Phase F flag-flip — activates BoundaryEnforcer two-layer detection.
      # Gated on ADR-061 ratification per Lead Dev Apr 27 recommendation;
      # PM/PA holds final flip authorization. Default-off in code
      # (services/intent/intent_service.py:627) preserved for env without override.
      - ENABLE_ETHICS_ENFORCEMENT=true
      # Encrypt-at-rest master key (#358 / #358-B). Must be NAMED here — this service uses
      # an explicit `environment:` list, not `env_file:`, so .env is NOT auto-loaded into
      # the container. Empty default → encryption gracefully disabled if unset (local dev).
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      # #1343 incident (2026-07-02): main.py defaults PIPER_HOST to 127.0.0.1 (correct for
      # the bare `python main.py` desktop/CLI path — binding wider would expose a local
      # user's Piper to their LAN). But inside a container that default breaks BOTH Docker's
      # own port-mapping and sibling-container reachability (Caddy got "connection refused"
      # dialing the app container's bridge IP). Any compose-based run — local dev or the
      # droplet — needs 0.0.0.0 unconditionally; there's no compose scenario where
      # loopback-only-inside-the-container is desired. Previously this was patched only as
      # an undocumented, git-untracked edit directly on the droplet — which is exactly how
      # it got silently lost on the next clean deploy. Named here so it can't happen again.
      - PIPER_HOST=0.0.0.0
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8001"
    restart: unless-stopped

  # Orchestration Service - Temporal Worker
  orchestration:
    build:
      context: .
      dockerfile: services/orchestration/Dockerfile
    container_name: piper-orchestration
    environment:
      - PYTHON_VERSION=3.11
      - PYTHONPATH=/app
      # Encrypt-at-rest master key (#358-B) — orchestration touches the DB's encrypted
      # columns via the shared models, so it needs the same key. Empty default if unset.
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
    volumes:
      - .:/app
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL - Main database
  postgres:
    image: postgres:15
    container_name: piper-postgres # Fixed name
    environment:
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: dev_changeme_in_production
      POSTGRES_DB: piper_morgan
    ports:
      - "5433:5432"
    volumes:
      # NAMED VOLUME - survives everything!
      - piper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piper"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and event queue
  redis:
    image: redis:7-alpine
    container_name: piper-redis
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB - Vector database
  chromadb:
    image: chromadb/chroma:latest
    container_name: piper-chromadb
    volumes:
      - ./data/chromadb:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"

  # Temporal - Workflow orchestration (FIXED)
  temporal:
    image: temporalio/auto-setup:latest
    container_name: piper-temporal
    ports:
      - "7233:7233"
      - "8088:8088"
    environment:
      - DB=postgres12 # Fixed: needs to be postgres12, not postgres
      - DB_PORT=5432
      - POSTGRES_USER=piper
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-dev_changeme}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=piper_morgan
    depends_on:
      postgres:
        condition: service_healthy

  # Traefik - API Gateway (minimal config)
  traefik:
    image: traefik:v3.0
    container_name: piper-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8090:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: piper-network

volumes:
  # EXPLICIT VOLUME NAME - never loses data
  piper_postgres_data:
    name: piper_postgres_data_v1 # Version it!
