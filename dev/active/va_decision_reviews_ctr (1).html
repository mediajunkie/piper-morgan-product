<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Decision Reviews — CTR by Rollout Stage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f3;
    --text: #1a1a1a;
    --text-secondary: #5f5e5a;
    --border: rgba(0,0,0,0.12);
    --border-light: rgba(0,0,0,0.06);
    --grid: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #2c2c2a;
      --text: #e8e8e4;
      --text-secondary: #b4b2a9;
      --border: rgba(255,255,255,0.15);
      --border-light: rgba(255,255,255,0.08);
      --grid: rgba(255,255,255,0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 860px; margin: 0 auto; line-height: 1.6; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; }
  .subtitle code { font-size: 12px; background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .chart-wrap { position: relative; width: 100%; height: 340px; }
  .table-section { margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { text-align: left; padding: 8px 6px; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); }
  th.r, td.r { text-align: right; }
  td { padding: 8px 6px; color: var(--text); }
  tr.stage-last td { border-bottom: 1px solid var(--border); }
  tr.row-border td { border-bottom: 1px solid var(--border-light); }
  .stage-label { font-weight: 500; vertical-align: top; }
  .date-cell { color: var(--text-secondary); vertical-align: top; }
  .form-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .pending { color: var(--text-secondary); font-style: italic; }
</style>
</head>
<body>

<script>
/*
 * ========================================================================
 *  DATA — edit this JSON to update the chart and table
 * ========================================================================
 *
 *  forms[]:         each form type with a label, short key, and color
 *  stages[]:        each rollout stage
 *    - label:       display label for the x-axis / table
 *    - dates:       date range string
 *    - pct:         rollout percentage (used in label)
 *    - pending:     if true, no data yet (renders "data collection in progress")
 *    - data[]:      one entry per form, same order as forms[]
 *        - users:   active users
 *        - clicks:  clicks on the link
 *        - ctr:     click-through rate (%)
 */
const CONFIG = {
  title: "GA click-through: \"Check the status of your form on My VA\"",
  featureToggle: "my_va_display_decision_reviews_forms",
  yMax: 20,

  forms: [
    { key: "SC",  label: "SC (Supplemental Claim)",       color: "#534AB7" },
    { key: "HLR", label: "HLR (Higher-Level Review)",     color: "#1D9E75" },
    { key: "NOD", label: "NOD (Notice of Disagreement)",  color: "#D85A30" }
  ],

  stages: [
    {
      label: "1% (canary)",
      dates: "Mar 10–12",
      pct: 1,
      data: [
        { users: 2008, clicks: 1,  ctr: 0.05 },
        { users: 986,  clicks: 2,  ctr: 0.20 },
        { users: 212,  clicks: 0,  ctr: 0.00 }
      ]
    },
    {
      label: "25%",
      dates: "Mar 12–16",
      pct: 25,
      data: [
        { users: 1718, clicks: 70, ctr: 4.07 },
        { users: 826,  clicks: 24, ctr: 2.91 },
        { users: 191,  clicks: 13, ctr: 6.81 }
      ]
    },
    {
      label: "50%",
      dates: "Mar 16–23",
      pct: 50,
      data: [
        { users: 3548, clicks: 292, ctr: 8.23 },
        { users: 1745, clicks: 152, ctr: 8.71 },
        { users: 375,  clicks: 24,  ctr: 6.40 }
      ]
    },
    {
      label: "100% (full)",
      dates: "Mar 23–24",
      pct: 100,
      note: "data collection still in progress",
      data: [
        { users: 824,  clicks: 144, ctr: 17.48 },
        { users: 435,  clicks: 64,  ctr: 14.71 },
        { users: 99,   clicks: 16,  ctr: 16.16 }
      ]
    }
  ]
};
</script>

<h1 id="page-title"></h1>
<div class="subtitle">Feature toggle: <code id="toggle-name"></code></div>

<div class="legend" id="legend"></div>
<div class="chart-wrap"><canvas id="ctrChart"></canvas></div>
<div class="table-section">
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<script>
(function() {
  const C = CONFIG;

  document.getElementById('page-title').textContent = C.title;
  document.getElementById('toggle-name').textContent = C.featureToggle;

  // Legend
  const legendEl = document.getElementById('legend');
  C.forms.forEach(f => {
    legendEl.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${f.color}"></span>${f.label}</span>`;
  });

  // Chart
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const activeStages = C.stages.filter(s => !s.pending);
  const labels = activeStages.map(s => `${s.pct}% (${s.dates})`);
  const datasets = C.forms.map((f, fi) => ({
    label: f.key,
    data: activeStages.map(s => s.data[fi]?.ctr ?? null),
    borderColor: f.color,
    backgroundColor: f.color,
    pointRadius: 5,
    pointHoverRadius: 7,
    tension: 0.25,
    borderWidth: 2
  }));

  new Chart(document.getElementById('ctrChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: {
          beginAtZero: true, max: C.yMax,
          title: { display: true, text: 'Click-through rate (%)', color: isDark ? '#b4b2a9' : '#5f5e5a', font: { size: 13 } },
          ticks: { color: isDark ? '#b4b2a9' : '#5f5e5a', callback: v => v + '%', stepSize: 2 },
          grid: { color: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)' }
        },
        x: {
          ticks: { color: isDark ? '#b4b2a9' : '#5f5e5a', autoSkip: false, maxRotation: 0, font: { size: 12 } },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const stage = activeStages[ctx.dataIndex];
              const d = stage.data[ctx.datasetIndex];
              return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}% (${d.clicks}/${d.users.toLocaleString()} users)`;
            }
          }
        }
      }
    }
  });

  // Table
  document.getElementById('thead').innerHTML = `
    <tr>
      <th style="width:16%">Rollout stage</th>
      <th style="width:14%">Dates</th>
      <th style="width:18%">Form</th>
      <th class="r" style="width:17%">Active users</th>
      <th class="r" style="width:14%">Clicks</th>
      <th class="r" style="width:12%">CTR</th>
    </tr>`;

  const tbody = document.getElementById('tbody');
  C.stages.forEach((stage, si) => {
    if (stage.pending) {
      tbody.innerHTML += `<tr>
        <td class="stage-label">${stage.label}</td>
        <td class="date-cell">${stage.dates}</td>
        <td colspan="4" class="pending">Enabled — data collection in progress</td>
      </tr>`;
      return;
    }
    C.forms.forEach((form, fi) => {
      const d = stage.data[fi];
      const isLast = fi === C.forms.length - 1;
      const rowClass = isLast ? 'stage-last' : 'row-border';
      tbody.innerHTML += `<tr class="${rowClass}">
        ${fi === 0 ? `<td class="stage-label" rowspan="${C.forms.length}">${stage.label}</td><td class="date-cell" rowspan="${C.forms.length}">${stage.dates}${stage.note ? '<br><span class="pending">(' + stage.note + ')</span>' : ''}</td>` : ''}
        <td><span class="form-dot" style="background:${form.color}"></span>${form.key}</td>
        <td class="r">${d.users.toLocaleString()}</td>
        <td class="r">${d.clicks.toLocaleString()}</td>
        <td class="r">${d.ctr.toFixed(2)}%</td>
      </tr>`;
    });
  });
})();
</script>

</body>
</html>
