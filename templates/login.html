<!DOCTYPE html>
<html>
<head>
    <title>Login - Piper Morgan</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- tokens.css MUST be first - defines CSS variables used by auth.css -->
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <style>
        /* Inline critical CSS for faster load */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="/assets/pm-logo.png" alt="Piper Morgan" class="auth-logo">
            <h1>Welcome back!</h1>
            <p>Good to see you again.</p>
        </div>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <!-- #1261: either identifier works now; the field NAME stays
                     `username` (form/API contract), only accepted values widened -->
                <label for="username">Username or email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                    autofocus
                    placeholder="Your username or email"
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Enter your password"
                />
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <button type="submit" class="auth-button" id="login-button">
                Log In
            </button>
        </form>

        <div class="auth-footer">
            <p>
                <!-- #441/#1261: self-serve entry to the PM-issued-code reset flow -->
                <a href="/reset-password">Forgot password?</a>
            </p>
            <p>
                <!-- 2026-07-12: invitees arrive here first — name the invite
                     path explicitly (the wizard's Account step takes the code). -->
                Have an invite code?
                <a href="/setup">Create your account</a>
            </p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
