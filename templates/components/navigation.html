<!-- Global Navigation Component -->
<!-- Usage: {# % include 'components/navigation.html' % #} -->

<link rel="stylesheet" href="/static/css/nav.css">

<nav class="global-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-container">
    <!-- Logo/Brand -->
    <a href="/" class="nav-brand">
      <img src="/assets/pm-logo.png" alt="Piper Morgan" class="nav-logo">
      <span>Piper Morgan</span>
    </a>

    <!-- Search Trigger (opens command palette) -->
    <button class="nav-search-trigger" id="nav-search-trigger" aria-label="Search (⌘K)" title="Search (⌘K)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
        <circle cx="7" cy="7" r="5"/>
        <path d="M11 11l3 3"/>
      </svg>
      <span class="nav-search-hint" aria-hidden="true">⌘K</span>
    </button>

    <!-- Hamburger Menu Button (Mobile Only) -->
    <button class="hamburger-button" id="hamburger-button" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Main Navigation -->
    <ul class="nav-menu" id="nav-menu">
      <!-- Trust-gated: Stage 3+ only -->
      <li class="nav-item-trust-gated" data-min-trust-stage="3"><a href="/standup" class="nav-link" id="nav-standup" data-nav-path="/standup">Check in</a></li>
      <!-- "Your stuff" is the user's OWN content (todos/projects/work-items/files/documents/lists).
           NOT trust-gated: a trust gate governs Piper's autonomy, never a user's access to their own
           data (PM 2026-06-17). Same principle as #732 ("users should always see their own history"). -->
      <li class="nav-dropdown">
        <button class="nav-dropdown-button" id="stuff-dropdown-button" aria-haspopup="true" aria-expanded="false" aria-controls="stuff-dropdown-menu">
          Your stuff
          <svg class="nav-dropdown-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </button>
        <div class="nav-dropdown-menu" id="stuff-dropdown-menu" role="menu" hidden>
          <a href="/todos" class="nav-dropdown-item" id="nav-todos" data-nav-path="/todos" role="menuitem">To-dos</a>
          <a href="/projects" class="nav-dropdown-item" id="nav-projects" data-nav-path="/projects" role="menuitem">Projects</a>
          <a href="/work-items" class="nav-dropdown-item" id="nav-work-items" data-nav-path="/work-items" role="menuitem">Work Items</a>
          <!-- #1146: /files was a true nav-orphan (reachable only by URL) — wired here in "Your stuff" -->
          <a href="/files" class="nav-dropdown-item" id="nav-files" data-nav-path="/files" role="menuitem">Files</a>
          <!-- #1268 / PM 2026-06-17: un-gated — Documents + Collections hold the USER'S OWN content;
               a trust gate must not hide a user's own data from them. (Label "Collections" → CXO's rename call.) -->
          <a href="/documents" class="nav-dropdown-item" id="nav-documents" data-nav-path="/documents" role="menuitem">Documents</a>
          <a href="/lists" class="nav-dropdown-item" id="nav-lists" data-nav-path="/lists" role="menuitem">Collections</a>
        </div>
      </li>
      <li class="nav-item-trust-gated" data-min-trust-stage="3"><a href="/learning" class="nav-link" id="nav-learning" data-nav-path="/learning">Learning</a></li>
      <!-- #1146/#1134: /insights (R4 Insight Journal) was a true nav-orphan — wired here.
           Stage 1 to match the journal page's own data-min-stage="1" + R4 pull-mode being
           Stage-1-available. Placement/stage flagged for CXO UX session (sibling of Learning). -->
      <li class="nav-item-trust-gated" data-min-trust-stage="1"><a href="/insights" class="nav-link" id="nav-insights" data-nav-path="/insights">Insights</a></li>
      <!-- History (#425 MUX-IMPLEMENT-MEMORY-SYNC) -->
      <!-- Issue #732: Lowered from stage 2 to 1 - users should always see their own history -->
      <li class="nav-item-trust-gated" data-min-trust-stage="1">
        <button class="nav-link nav-history-trigger" id="nav-history-trigger" aria-label="View history">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" style="margin-right: 6px;" aria-hidden="true">
            <circle cx="8" cy="8" r="6"/>
            <path d="M8 4v4l2.5 2.5"/>
          </svg>
          History
        </button>
      </li>
    </ul>

    <!-- User Menu -->
    <div class="nav-user">
      <button class="user-button" aria-haspopup="true" aria-expanded="false" aria-controls="user-dropdown" id="user-menu-button">
        <span class="user-avatar" id="user-avatar" aria-hidden="true">U</span>
        <span class="user-name" id="user-name">User</span>
        <svg class="user-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>

      <div class="user-dropdown" hidden id="user-dropdown" role="menu" aria-label="User menu">
        <a href="/settings" class="dropdown-item" id="dropdown-settings" role="menuitem">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M9.405 1.05c-.413-1.238-2.397-1.238-2.81 0l-.1.34a1.464 1.464 0 01-2.105.872l-.31-.17c-1.088-.601-2.187.529-1.586 1.617l.17.31c.463.836.023 1.917-.856 2.105l-.34.1c-1.238.413-1.238 2.397 0 2.81l.34.1c.883.188 1.319 1.269.856 2.105l-.17.31c-.601 1.088.529 2.187 1.617 1.586l.31-.17a1.464 1.464 0 012.105.872l.1.34c.413 1.238 2.397 1.238 2.81 0l.1-.34a1.464 1.464 0 012.105-.872l.31.17c1.088.601 2.187-.529 1.586-1.617l-.17-.31c-.463-.836-.023-1.917.856-2.105l.34-.1c1.238-.413 1.238-2.397 0-2.81l-.34-.1c-.883-.188-1.319-1.269-.856-2.105l.17-.31c.601-1.088-.529-2.187-1.617-1.586l-.31.17a1.464 1.464 0 01-2.105-.872l-.1-.34z"/>
          </svg>
          Settings
        </a>
        <a href="/account" class="dropdown-item" id="dropdown-account" role="menuitem">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm.5-9H8c4.418 0 8 1.79 8 4v2c0 2.21-3.582 4-8 4s-8-1.79-8-4V3c0-2.21 3.582-4 8-4z"/>
          </svg>
          Account
        </a>
        <hr class="dropdown-divider" role="separator">
        <a href="#" class="dropdown-item dropdown-item-danger" id="dropdown-logout" onclick="handleLogout(event)" role="menuitem">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M5.338 1.59a61.44 61.44 0 00-2.837.856.481.481 0 00-.328.39c-.554 4.157.726 7.213 2.363 9.337a3.494 3.494 0 00.636.643l.049-.04a.658.658 0 00.015-.691A2.89 2.89 0 005.1 9.5c0-.822.503-4.76 1.102-6.402a.413.413 0 00-.078-.465 3.2 3.2 0 00-.6-.756zm2.768.885a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm4.048 .895a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
          </svg>
          Logout
        </a>
      </div>
    </div>
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Trust-gated visibility (#420)
  // Get trust_stage from window (set by template from #419)
  const trustStage = window.trustStage || 1;

  // Show/hide nav items based on trust stage
  const trustGatedItems = document.querySelectorAll('.nav-item-trust-gated');
  trustGatedItems.forEach(item => {
    const minStage = parseInt(item.dataset.minTrustStage || '1', 10);
    if (trustStage >= minStage) {
      item.classList.add('trust-visible');
    } else {
      item.classList.remove('trust-visible');
    }
  });

  // Search trigger - opens command palette (#421)
  const searchTrigger = document.getElementById('nav-search-trigger');
  if (searchTrigger) {
    searchTrigger.addEventListener('click', function() {
      // Dispatch custom event for command palette to listen to
      const event = new CustomEvent('openCommandPalette');
      document.dispatchEvent(event);
      // Fallback: if no palette exists yet, show placeholder
      if (!window.commandPaletteExists) {
        console.log('Command palette not yet implemented - see #421');
      }
    });

    // Keyboard shortcut: Cmd/Ctrl+K
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const event = new CustomEvent('openCommandPalette');
        document.dispatchEvent(event);
        if (!window.commandPaletteExists) {
          console.log('Command palette not yet implemented - see #421');
        }
      }
    });
  }

  // History trigger (#425)
  const historyTrigger = document.getElementById('nav-history-trigger');
  if (historyTrigger) {
    historyTrigger.addEventListener('click', function() {
      // Open history sidebar if loaded
      if (window.HistorySidebar) {
        window.HistorySidebar.toggle();
      } else {
        console.log('History sidebar not yet loaded - see #425');
      }
    });

    // Keyboard shortcut: Cmd/Ctrl+H for history
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'h' && !e.shiftKey) {
        e.preventDefault();
        if (window.HistorySidebar) {
          window.HistorySidebar.toggle();
        }
      }
    });
  }

  // Get user info if available in context (will be passed from server)
  const userButton = document.getElementById('user-menu-button');
  const userDropdown = document.getElementById('user-dropdown');
  const userAvatar = document.getElementById('user-avatar');
  const userName = document.getElementById('user-name');

  // Handle hamburger menu for mobile
  const hamburgerButton = document.getElementById('hamburger-button');
  const navMenu = document.getElementById('nav-menu');

  if (hamburgerButton && navMenu) {
    hamburgerButton.addEventListener('click', function(e) {
      e.stopPropagation();
      const isExpanded = hamburgerButton.getAttribute('aria-expanded') === 'true';
      hamburgerButton.setAttribute('aria-expanded', !isExpanded);
      navMenu.classList.toggle('active');
    });

    // Close menu when clicking on a nav link
    const navLinkElements = navMenu.querySelectorAll('.nav-link');
    navLinkElements.forEach(link => {
      link.addEventListener('click', function() {
        hamburgerButton.setAttribute('aria-expanded', 'false');
        navMenu.classList.remove('active');
      });
    });

    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
      if (!hamburgerButton.contains(e.target) && !navMenu.contains(e.target)) {
        hamburgerButton.setAttribute('aria-expanded', 'false');
        navMenu.classList.remove('active');
      }
    });
  }

  // Handle Stuff dropdown
  const stuffButton = document.getElementById('stuff-dropdown-button');
  const stuffMenu = document.getElementById('stuff-dropdown-menu');

  if (stuffButton && stuffMenu) {
    stuffButton.addEventListener('click', function(e) {
      e.stopPropagation();
      const isExpanded = stuffButton.getAttribute('aria-expanded') === 'true';
      stuffButton.setAttribute('aria-expanded', !isExpanded);
      stuffMenu.hidden = isExpanded;
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!stuffButton.contains(e.target) && !stuffMenu.contains(e.target)) {
        stuffButton.setAttribute('aria-expanded', 'false');
        stuffMenu.hidden = true;
      }
    });

    // Close on escape key
    stuffButton.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        stuffButton.setAttribute('aria-expanded', 'false');
        stuffMenu.hidden = true;
      }
    });

    // Arrow key navigation in Stuff dropdown
    const stuffItems = stuffMenu.querySelectorAll('.nav-dropdown-item');
    let stuffFocus = -1;

    stuffButton.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        stuffButton.setAttribute('aria-expanded', 'true');
        stuffMenu.hidden = false;
        stuffFocus = 0;
        if (stuffItems[stuffFocus]) {
          stuffItems[stuffFocus].focus();
        }
      }
    });

    stuffItems.forEach((item, index) => {
      item.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          stuffFocus = (index + 1) % stuffItems.length;
          stuffItems[stuffFocus].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          stuffFocus = (index - 1 + stuffItems.length) % stuffItems.length;
          stuffItems[stuffFocus].focus();
        } else if (e.key === 'Escape') {
          stuffButton.setAttribute('aria-expanded', 'false');
          stuffMenu.hidden = true;
          stuffButton.focus();
        }
      });
    });
  }

  // Set active nav link based on current path
  const currentPath = window.location.pathname;
  const navLinks = {
    '/standup': 'nav-standup',  // "Check in"
    '/learning': 'nav-learning'
  };

  // Your stuff dropdown items (renamed from "My Work")
  const stuffLinks = {
    '/todos': 'nav-todos',      // "To-dos"
    '/projects': 'nav-projects', // "Projects"
    '/work-items': 'nav-work-items', // "Work Items" (#710)
    '/files': 'nav-files',       // "Documents"
    '/lists': 'nav-lists'        // "Collections"
  };

  for (const [path, id] of Object.entries(navLinks)) {
    const link = document.getElementById(id);
    if (link) {
      if (currentPath === path) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      } else {
        link.classList.remove('active');
        link.removeAttribute('aria-current');
      }
    }
  }

  // Handle Stuff dropdown item active states
  for (const [path, id] of Object.entries(stuffLinks)) {
    const link = document.getElementById(id);
    if (link) {
      if (currentPath === path) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
        // Also highlight the Stuff button when a sub-item is active
        if (stuffButton) {
          stuffButton.style.color = 'var(--color-primary-decorative)';
        }
      } else {
        link.classList.remove('active');
        link.removeAttribute('aria-current');
      }
    }
  }

  // Handle user dropdown menu
  if (userButton && userDropdown) {
    userButton.addEventListener('click', function(e) {
      e.stopPropagation();
      const isExpanded = userButton.getAttribute('aria-expanded') === 'true';
      userButton.setAttribute('aria-expanded', !isExpanded);
      userDropdown.hidden = isExpanded;
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
      userButton.setAttribute('aria-expanded', 'false');
      userDropdown.hidden = true;
    });

    // Keyboard support
    userButton.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        userButton.setAttribute('aria-expanded', 'false');
        userDropdown.hidden = true;
      }
    });

    // Arrow key navigation in dropdown
    const dropdownItems = userDropdown.querySelectorAll('.dropdown-item');
    let currentFocus = -1;

    userButton.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentFocus = 0;
        if (dropdownItems[currentFocus]) {
          dropdownItems[currentFocus].focus();
        }
      }
    });

    dropdownItems.forEach((item, index) => {
      item.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          currentFocus = (index + 1) % dropdownItems.length;
          dropdownItems[currentFocus].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          currentFocus = (index - 1 + dropdownItems.length) % dropdownItems.length;
          dropdownItems[currentFocus].focus();
        }
      });
    });
  }

  // Try to get user info from server context (if available)
  // This would be set by the server in a script tag
  if (window.currentUser) {
    if (window.currentUser.username) {
      userName.textContent = window.currentUser.username;
      const firstLetter = window.currentUser.username.charAt(0).toUpperCase();
      userAvatar.textContent = firstLetter;
    }
  }
});

// G8: Handle logout - POST to /api/v1/auth/logout
async function handleLogout(event) {
  event.preventDefault();

  try {
    const response = await fetch('/api/v1/auth/logout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      credentials: 'include' // Include authentication cookies
    });

    if (response.ok) {
      // Issue #787: Clear user-specific localStorage to prevent session bleed to next user
      // Must clear BEFORE redirect so new user gets fresh state
      try {
        localStorage.removeItem('piper_chat_session_id');
        localStorage.removeItem('piper_chat_history');
        localStorage.removeItem('piper_active_conversation_id');
      } catch (e) {
        // Ignore storage errors in private browsing
      }
      // Redirect to login or home page
      window.location.href = '/';
    } else {
      const data = await response.json();
      // #1170: Toast (global via base.html), not native alert
      (window.Toast ? Toast.error('Logout failed', data.detail || 'Unknown error') : console.error('Logout failed:', data.detail));
    }
  } catch (error) {
    console.error('Logout error:', error);
    // #1170: Toast (global via base.html), not native alert
    (window.Toast ? Toast.error('Logout failed', error.message) : console.error('Logout failed:', error));
  }
}
</script>
