<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Piper Morgan</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- tokens.css MUST be first - defines CSS variables used by auth.css -->
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <style>
        /* Inline critical CSS for faster load (mirrors login.html) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .success-message {
            color: #1a7f37;
            background: #e6f4ea;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="/assets/pm-logo.png" alt="Piper Morgan" class="auth-logo">
            <h1>Reset your password</h1>
            <!-- #441/#1261: beta reset model — PM issues the code (no mailer in beta) -->
            <p>Enter the reset code you received and choose a new password.<br/>
               Don't have a code? Ask your Piper Morgan contact for one.</p>
        </div>

        <form id="reset-form" class="auth-form">
            <div class="form-group">
                <label for="reset-token">Reset code</label>
                <input
                    type="text"
                    id="reset-token"
                    name="reset_token"
                    required
                    autocomplete="off"
                    autofocus
                    placeholder="From your Piper Morgan contact"
                />
            </div>

            <div class="form-group">
                <label for="new-password">New password</label>
                <input
                    type="password"
                    id="new-password"
                    name="new_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                />
            </div>

            <div class="form-group">
                <label for="new-password-confirm">Confirm new password</label>
                <input
                    type="password"
                    id="new-password-confirm"
                    name="new_password_confirm"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Repeat the new password"
                />
            </div>

            <div id="success-message" class="success-message" style="display: none;"></div>
            <div id="error-message" class="error-message" style="display: none;"></div>

            <button type="submit" class="auth-button" id="reset-button">
                Reset Password
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="/login">Back to log in</a></p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            const form = document.getElementById('reset-form');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const button = document.getElementById('reset-button');

            function show(el, msg) {
                el.textContent = msg;
                el.style.display = 'block';
            }
            function hideAll() {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideAll();

                const newPassword = document.getElementById('new-password').value;
                const confirm = document.getElementById('new-password-confirm').value;
                if (newPassword !== confirm) {
                    show(errorDiv, 'Passwords do not match.');
                    return;
                }

                button.disabled = true;
                button.textContent = 'Resetting…';
                try {
                    const response = await fetch('/api/v1/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reset_token: document.getElementById('reset-token').value.trim(),
                            new_password: newPassword,
                            new_password_confirm: confirm
                        })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok && data.success) {
                        show(successDiv, data.message || 'Password reset. You can now log in.');
                        setTimeout(() => { window.location.href = '/login'; }, 2500);
                    } else {
                        // 422 detail can be an array (Pydantic) — render safely, never [object Object]
                        let msg = data.detail;
                        if (Array.isArray(msg)) msg = msg.map(d => d.msg || 'invalid input').join('; ');
                        show(errorDiv, msg || 'Reset failed. Check your code and try again.');
                    }
                } catch (err) {
                    show(errorDiv, 'Could not reach the server. Please try again.');
                } finally {
                    button.disabled = false;
                    button.textContent = 'Reset Password';
                }
            });
        })();
    </script>
</body>
</html>
