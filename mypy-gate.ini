; #1436 Part 2 — the mypy signature-drift gate (Arch-ratified 2026-07-17).
; Scope: the four defect codes the census proved live (call-arg, arg-type,
; attr-defined, union-attr), enforced per-code as shrink-only ratchets by
; scripts/check_mypy_gate.py (ceilings in scripts/ratchet_ceilings.json).
; Plugins are load-bearing: without sqlalchemy's plugin, declarative models
; type as Any and the attr-defined class (the #1422 shape) is invisible.
[mypy]
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin
ignore_missing_imports = True
check_untyped_defs = True
follow_imports = normal
exclude = (archive|data_backup|dev)/
