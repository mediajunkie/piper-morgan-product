# fly.mcp.toml — Piper Morgan MCP server on Fly.io (Phase C unit 0, #1462)
#
# Same Dockerfile/image as fly.toml (the alpha web app) — a separate Fly app
# so a bad MCP deploy can never take alpha down; DB and bindings are shared,
# alpha's process is untouched. The Dockerfile's CMD stays alpha's
# (`python main.py`) on purpose — the override lives here at the Fly config
# layer, mirroring the same idiom deploy/fly/github-mcp.fly.toml already uses
# ([experimental] cmd), not by editing the Dockerfile.
#
# DNS (mcp.pipermorgan.ai) + TLS cert already issued (Phase B, Pard,
# 2026-09-24) — Fly serves no TLS for a machine-less app, so the endpoint
# reads as dark (curl -> 000) until the FIRST deploy of this file. That is
# expected, not broken.
#
# Deployable dark (unit 0): no resources are registered yet and every MCP
# request is refused with 401 until unit 1 ships identity — see
# services/mcp/server/app.py. Deploying this file only lights the endpoint;
# it does not yet serve anything a tester can use.
#
# Deploy:
#   fly deploy -c fly.mcp.toml -a piper-morgan-mcp --remote-only \
#     --build-arg PIPER_GIT_SHA=$(git rev-parse HEAD)

app = "piper-morgan-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[experimental]
  cmd = ["/bin/bash", "-c", "/usr/local/bin/verify-python-version.sh && exec python main_mcp.py"]

# Secrets (set via `fly secrets import`, NEVER here): ENCRYPTION_SCOPED_SUBKEYS —
# the GitHub-only decrypt subkey (#1982). ENCRYPTION_MASTER_KEY must NOT be set on
# this app; main_mcp.py refuses to start if it is. Runbook:
# docs/internal/operations/mcp-scoped-subkey-runbook-1982.md
# #2342 (PA, 2026-11-12; Lead 08:23, CXO and Arch 08:28): of the GitHub App variables,
# only GITHUB_APP_SLUG goes on this app (not a secret; it turns the connector's
# "on our side" line into the install line). GITHUB_APP_CLIENT_ID and
# GITHUB_APP_CLIENT_SECRET go on the main app ONLY, never here: this app is decrypt-only
# and never refreshes a grant.
[env]
  PIPER_ENVIRONMENT = "production"
  PORT = "8080"
  PYTHONPATH = "/app"
  # #1982 (PA, 2026-10-11): the GitHub-issues read resolves server ref 'github' via this URL.
  # Same value as alpha's fly.toml. Not a secret. Lands with the scoped GitHub subkey (Arch's ruling);
  # this app must NEVER hold ENCRYPTION_MASTER_KEY.
  GITHUB_MCP_SERVER_URL = "http://piper-morgan-gh-mcp.internal:8082/mcp"

[http_service]
  internal_port = 8080
  force_https = true
  # PINNED WARM 2026-09-26 (PA, per Lead's own OAuth-AS-live memo): a real tester (PM, tester #1,
  # via ChatGPT) is about to connect for the first time. A cold start already read 000 once this
  # morning; a connector's first handshake must not repeat that. Matches alpha's fly.toml pattern.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
