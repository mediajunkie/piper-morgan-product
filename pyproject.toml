[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-morgan"
version = "0.8.9.1"
requires-python = ">=3.11.0"
description = "AI-powered project management assistant"

[tool.setuptools]
packages = ["services", "web", "cli"]
package-dir = {"" = "."}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "archive",
    "data_backup",
    "uploads",
    "web/assets",
    ".venv",
    "venv",
    "build",
    "dist",
    "dev",                    # scratch/exploration code, not production
    "temp_engine_update.py",
    "update_engine.py",
    "fix.py",
]

[tool.ruff.lint]
# Matches CI-enforced rule set in .github/workflows/lint.yml + isort.
# E9:  runtime errors (syntax)
# F63: type comparison errors
# F7:  syntax errors
# F82: undefined name (in __all__, etc.)
# I:   isort (replaces PyCQA/isort hook)
select = ["E9", "F63", "F7", "F82", "I"]
# F821 (undefined name) produces false positives on forward references;
# preserved from prior .flake8 extend-ignore list.
ignore = ["F821"]

[tool.ruff.lint.per-file-ignores]
# Redundant local `from ... import get_or_create_context` shadows module-level import
# at line 43; ruff flags references at line 351 as pre-assignment. Not a real bug.
# Consider cleanup: remove the redundant local imports at lines 387, 542, 1050.
"services/intent/intent_service.py" = ["F823"]

[tool.ruff.format]
# Black-compatible defaults; nothing to override

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as requiring async event loop",
    "github: Tests that require GitHub API token (skipped without GITHUB_TOKEN) - Issue #914",
]
testpaths = ["tests"]
addopts = "--ignore=tests/archive --ignore=*/archive/*"
