title: Piper Morgan Documentation
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Scoped to the visitor-facing surface 2026-08-12 (Docs proposal, CIO-ratified — see
# docs/internal/operations/docs-site-scoping-proposal-2026-08-12.md). The working corpus below
# stays on GitHub by design; this site serves product documentation for visitors, alpha testers,
# and developers. Owner: Docs. Review trigger: any new top-level directory in docs/.
exclude:
  # Working corpus (deliberate exclusion, CIO-ratified 2026-08-12)
  - internal
  - omnibus-logs
  - public/comms
  - briefs
  - operations
  - briefing
  - refactor
  - agent-protocols
  - processes
  # trailing slash is load-bearing: a bare "reference" also swallows the sibling "references/"
  # (citations, KEPT) — found behaviorally on the 2026-08-12 rollout verification
  - reference/
  - research
  - 00-START-HERE-LEAD-DEV.md
  - user-guide.md
  - NAVIGATION.md
  # legacy archives: self-described historical docs carrying pre-reorg dead links (2026-08-13)
  - public/getting-started/legacy-getting-started/
  - public/user-guides/legacy-user-guides/
  # Pre-existing patterns (kept as belt-and-suspenders)
  - archive
  - archive/
  - archive/**
  - development/session-logs/
  - development/prompts/
  - "*.log"
  - "**/*log*.md"
  - "**/*session*.md"
  - "**/*handoff*.md"
  - "**/*prompt*.md"
