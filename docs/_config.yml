title: Piper Morgan Documentation
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Scoped to the visitor-facing surface 2026-08-12 (Docs proposal, CIO-ratified — see
# docs/internal/operations/docs-site-scoping-proposal-2026-08-12.md). The working corpus below
# stays on GitHub by design; this site serves product documentation for visitors, alpha testers,
# and developers. Owner: Docs. Review trigger: any new top-level directory in docs/.
exclude:
  # Working corpus (deliberate exclusion, CIO-ratified 2026-08-12)
  # internal/ is excluded child by child, NOT wholesale, so that the ADRs and the patterns catalog
  # build as site pages (xian, 2026-11-22: "part 1 please"; narrows the 2026-08-12 scoping).
  # Everything else under internal/ stays working corpus. An allow-list (exclude internal, include the
  # two folders back) does not work: Jekyll skips an excluded parent whole (tested 2026-11-22).
  # So a CI test fails closed instead: tests/unit/scripts/test_site_internal_children_reviewed.py
  # fails when a new tracked file or folder directly under internal/ or internal/architecture/ is
  # not listed here. Add one exclude line in the same commit, with NO trailing slash (the test
  # matches exact strings).
  - internal/README.md
  - internal/audits
  - internal/design
  - internal/development
  - internal/operations
  - internal/planning
  - internal/product
  - internal/research
  - internal/retrospectives
  - internal/testing
  - internal/architecture/CONNECTORS.md
  - internal/architecture/ESSENCE.md
  - internal/architecture/README.md
  - internal/architecture/SYSTEM.md
  - internal/architecture/architectural-guidelines.md
  - internal/architecture/archive
  - internal/architecture/artifacts
  - internal/architecture/audits
  - internal/architecture/bets
  - internal/architecture/canonical-queries-architecture.md
  - internal/architecture/connector-refactor-sprint-scope-2026-06-14.md
  - internal/architecture/current
  - internal/architecture/decisions
  - internal/architecture/deployment-pipeline-plan-v0.1-2026-09-20.md
  - internal/architecture/design-records
  - internal/architecture/essence-v1.1-draft-commitment-6-and-prd-note-2026-10-24.md
  - internal/architecture/evolution
  - internal/architecture/investigation-039-canonical-handler-routing.md
  - internal/architecture/reviews
  - omnibus-logs
  - public/comms
  - briefs
  - operations
  - briefing
  - refactor
  - agent-protocols
  - processes
  # trailing slash is load-bearing: a bare "reference" also swallows the sibling "references/"
  # (citations, KEPT) — found behaviorally on the 2026-08-12 rollout verification
  - reference/
  - research
  - 00-START-HERE-LEAD-DEV.md
  - user-guide.md
  - NAVIGATION.md
  # legacy archives: self-described historical docs carrying pre-reorg dead links (2026-08-13)
  - public/getting-started/legacy-getting-started/
  - public/user-guides/legacy-user-guides/
  # Pre-existing patterns (kept as belt-and-suspenders)
  - archive
  - archive/
  - archive/**
  - development/session-logs/
  - development/prompts/
  - "*.log"
  # Narrowed 2026-11-22 from "**/*log*.md" and "**/*session*.md": those also dropped ten ADRs and
  # patterns ("session-management", "methodology", "audit-logs") that now build as site pages.
  # Local Jekyll build: removing both globs added exactly those ten pages and nothing else.
  - "**/*-log.md"
  - "**/*-log-*.md"
  - "**/*session-log*.md"
  - "**/*handoff*.md"
  - "**/*prompt*.md"
