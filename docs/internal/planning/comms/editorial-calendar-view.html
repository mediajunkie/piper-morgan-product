 "altText": "Two luminous AI beings descend in a transparent transfer chamber from a calm executive observatory into a dense workshop filled with terminals, cables, machinery, and active construction, while floating documents and diagrams accompany them as preserved institutional memory.", "caption": "\"Let's get right down to it!\""}, {"title": "The Misfiled Voice Guide", "theme": "building", "status": "distributed", "workDate": "2026-04-24", "endWorkDate": "", "pubDate": "2026-05-28", "mediumURL": "https://medium.com/building-piper-morgan/the-misfiled-voice-guide-b988c5b5fca9", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-misfiled-voice-guide/", "blogPath": "/blog/the-misfiled-voice-guide", "cartoon": "ai-tome", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-misfiled-voice-guide.md", "notes": "Beat 2 of 9-beat narrative slate. Apr 24 Comms first Code session post-migration — filesystem search discovers canonical voice/tone guide misfiled at docs/assets/images/blog/comms/ (markdown files in images directory; undated 246 lines newer than dated 2025-08-27 253 lines). Three git mv operations + NAVIGATION.md + BRIEFING-ESSENTIAL-COMMS.md updates. Through-line: chat-era search restriction had shaped compensatory habits; what else is misfiled?", "altText": "A communications manual discovered on the wrong shelf in a vast archive.", "caption": "Always the last place you look!"}, {"title": "Upstream of the Floor", "theme": "building", "status": "distributed", "workDate": "2026-04-25", "endWorkDate": "2026-04-28", "pubDate": "2026-06-04", "mediumURL": "https://medium.com/building-piper-morgan/upstream-of-the-floor-92f0a44ca239", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/upstream-of-the-floor", "blogPath": "/blog/upstream-of-the-floor", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/upstream-of-the-floor.md", "notes": "Beat 3 of 9-beat narrative slate. Multi-day A+B-plot. A-plot: Apr 25 STOP CONDITION (stale server) + Scenario 1 finding (floor isn't reachable; pre-classifier intercepts) → PPM 'audit-shape not build-quality' reframe → Architect 'ethics is upstream' → #1004 design through ship in 6 days. B-plot: Apr 26 mail-cascade comedy (CXO can't see Exec kickoff; Docs's subshell drift compounds) → targeted mailbox-discipline norm in 30 minutes. Through-line: fix one layer upstream of where the symptom shows.", "altText": "A newly built floodgate stands across a nearly dry river channel while most of the river flows down an unnoticed branch upstream, as workers realize the water has been bypassing their structure all along.", "caption": "\"Good news! the floodgate works...\""}, {"title": "Where Would the Data Come From?", "theme": "building", "status": "distributed", "workDate": "2026-04-30", "endWorkDate": "", "pubDate": "2026-06-09", "mediumURL": "https://medium.com/building-piper-morgan/where-would-the-data-come-from-4b4f809fe179", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/where-would-the-data-come-from", "blogPath": "/blog/where-would-the-data-come-from", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/where-would-the-data-come-from.md", "notes": "Beat 4 of 9-beat narrative slate. Single-day Apr 30. Lead Dev files #1018 Phase 1 design 7:35 AM proposing real-traffic calibration before flag-flip; PM asks ~7:45 AM where the real-traffic data would come from (alpha = no real users → catch-22 named). 7:55 AM flip-now memo with 3-phase simulation-first reframe. 8:23 AM Architect ratifies with ADR-061 v1.0. 1:30 PM Phase F flag-flip merged → multi-week #992 ETHICS-ACTIVATE arc closes. Through-line: alpha plans drift toward production-shaped sequencing; ask where the data would come from. Distributed 6/9: blog + Medium published (building = Medium-only / no LinkedIn).", "altText": "A fisherman sits beside a tackle box and thermos, patiently casting into a vast dry lakebed while a glowing, semi-corporeal AI agent studies a clipboard and looks around in confusion at the complete absence of water.", "caption": "\"We should start collecting fish statistics any day now\""}, {"title": "The Pace Verified", "theme": "building", "status": "distributed", "workDate": "2026-05-02", "endWorkDate": "2026-05-05", "pubDate": "2026-06-11", "mediumURL": "https://medium.com/building-piper-morgan/the-pace-verified-c787557063a2", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-pace-verified", "blogPath": "/blog/the-pace-verified", "cartoon": "ai-pitcrew", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/the-pace-verified.md", "notes": "Beat 5 of 9-beat narrative slate. Multi-day A+B+coda. A-plot: May 2 cluster-commit (#1018+#1006/#1007/#1008 atomic, 58h design-to-ship) + audit-cascade catches conceptual drift before gameplan + May 3 record day (8 issues end-to-end + 221 new tests + 0 regressions + 3 mid-flight architectural calls: DDD strict-rewrite / channel-agnostic Push / two-layer COMPOSTED guardrail). B-plot: May 4 Architect first sustained workstream review — verdict structurally sound, 5 non-blocking cleanup items; PM instinct verified by independent review. Coda: May 5 multi-phase compounding payoff (#900 ships ~2h vs ~14h estimate because #1052 + Phase 1 state machine landed prior). Through-line: sustained pace from preparatory pieces compounding, not heroic effort.", "altText": "Semi-corporeal AI pit crew calmly organizing tools and reviewing diagnostics as a race car blurs past at extreme speed.", "caption": "\"Safe at any speed!\""}, {"title": "Hypothesis Refuted", "theme": "building", "status": "distributed", "workDate": "2026-05-08", "endWorkDate": "2026-05-09", "pubDate": "2026-06-18", "mediumURL": "https://medium.com/building-piper-morgan/hypothesis-refuted-a2b51f8c7e38", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/hypothesis-refuted", "blogPath": "/blog/hypothesis-refuted", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/hypothesis-refuted.md", "notes": "Beat 7 of 9-beat narrative slate. Two-day arc. May 8: Run-4 retest shows Quality 65.6% (apparent 6-pt drop from baseline); #1064 P0 filed hypothesizing LLM fabrication regression; investigation finds 0 of 10 auto-fails pure fabrication, 7 false flags from judge-calibration drift + auto-fail amplification + fixture pollution (Q56 smoking gun: 15 real todos in DB from prior runs mutating state without cleanup); 3 narrow real bugs. CEO directive: do not enter M2f until benchmark recovered. May 9: fixture reset (15 stale + 111 orphan wiped) + rubric recalibration memo + 3 fixes → Run 7 68.9% PASS exceeds baseline → M2f unblocked. Same day M2f Group A+B closed via dead-code deletions (-1813 LOC net) producing Pattern-067 (Issue-Body Reality Mismatch) — 3-of-5 issues described code that didn't exist. Through-line: when a measurement or description has drifted from the system it tracks, fix the reference not the system.", "altText": "A worried surveyor inspects a sturdy stone bridge using warped measuring tools—a bent ruler, tangled plumb line, and damaged map—while travelers cross the bridge without concern and a puzzled ghostly AI examines the crooked ruler, realizing the instruments are the real problem.", "caption": "\"Maybe check the ruler?\""}, {"title": "Branch-or-Anchor in Ninety Minutes", "theme": "building", "status": "distributed", "workDate": "2026-05-10", "endWorkDate": "", "pubDate": "2026-06-23", "mediumURL": "https://medium.com/building-piper-morgan/branch-or-anchor-in-ninety-minutes-346b2e218337", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/branch-or-anchor-in-ninety-minutes", "blogPath": "/blog/branch-or-anchor-in-ninety-minutes", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/branch-or-anchor-in-ninety-minutes.md", "notes": "Beat 8 of 9-beat narrative slate. Single-day arc May 10. PPM files M2d gate criteria framing new rubric as 'Colleague Test R/C/T — adapted for UI'; CXO catches as Pattern-063 (Parallel-Authoring Drift) recreation; PPM concedes + branches per Methodology-24 (Branch-or-Anchor) to UI Lifecycle Verification Rubric v0.1 with explicit provenance; Architect ratifies as cleanest application yet (caught at instrument-naming moment, not after drift accumulates); CXO documents at CT v2.3 → v2.3.1 cross-referencing as canonical worked-example. End-to-end ~90 min inside same workstream-review cycle. Through-line: methodology catalog moves from documentation to language — anyone in cohort can speak in it.", "altText": "A translucent AI librarian pauses before shelving a new book that resembles an established series, then creates a neighboring shelf with a visible lineage link, recognizing that similar appearance does not mean the same category.", "caption": "\"Not so fast there!\""}, {"title": "The Hook and the Worktree", "theme": "building", "status": "distributed", "workDate": "2026-05-13", "endWorkDate": "2026-05-15", "pubDate": "2026-06-25", "mediumURL": "https://medium.com/building-piper-morgan/the-hook-and-the-worktree-ff5a173b4d36", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-hook-and-the-worktree", "blogPath": "/blog/the-hook-and-the-worktree", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-hook-and-the-worktree.md", "notes": "Beat 9 of 9-beat narrative slate — slate-closing piece. Multi-day A+B arc. A-plot: May 13 close-issue-properly audit finds 13-of-13 unchecked descriptions; three remediation layers (memory pin + #1083 pre-commit hook + PM standing directive); 6 of 13 reopened with scope-shaped gaps; May 14 first clean application. B-plot: May 15 PPM 14-commit morning produces 4 foreign-state-capture incidents on shared main despite 5-week stack of commit-discipline memory pins; PPM concludes layered discipline can surface but not prevent; PM ratifies worktree-default at 7:13 AM via PPM relay; Docs codifies in CLAUDE.md by evening; first-day data: clean commits. Through-line: when procedures keep leaking, the next gain comes from changing the environment so the failure mode disappears structurally — discipline becoming infrastructure. Closes the 9-beat arc (Apr 23 → May 15).", "altText": "A crowded bridge crossing is surrounded by piles of reminders warning about a missing plank, while a quiet carpenter simply installs the missing board—showing how a small structural fix succeeds where constant vigilance does not.", "caption": "Mind the gap!"}, {"title": "First Subagent in Production", "theme": "building", "status": "distributed", "workDate": "2026-05-06", "endWorkDate": "2026-05-07", "pubDate": "2026-06-16", "mediumURL": "https://medium.com/building-piper-morgan/first-subagent-in-production-3b0072e857e2", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/first-subagent-in-production/", "blogPath": "/blog/first-subagent-in-production", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/first-subagent-in-production.md", "notes": "Beat 6 of 9-beat narrative slate. Two-day arc. May 6 prep day: Lead Dev preps #1053 STANDUP-TEST-MIGRATION with 3 audit-cascade gates (Issue 24+1; Gameplan 27+4 N/A; Prompts 36+6 N/A). Cursor-template N/A-rate observation produces template-drift-signal memory + #1058 hygiene tracking. May 7 deployment: subagent runs 6:48-7:18 AM; Phase 2 reframe (12 tests already passing; subagent annotated rather than improvising); cross-agent git collision during run (chained && doesn't gate on result, only exit code); commit `69aa5e74` merged 7:30 AM. Two new memory entries refining branch-show-current discipline (gate-on-result + subagent-requires-real-worktree-or-foreground-commits-first). Through-line: first production subagent deployment surfaces the methodology's fourth layer (scaffolding around the deployment).", "altText": "A workshop where a human creator watches proudly from above as a glowing AI lead developer supervises a smaller AI subagent completing careful work below, while a shared mechanical cable quietly causes a tiny unnoticed disturbance in the workshop machinery", "caption": "\"They grow up so fast!\""}, {"title": "Critical vs Commodity Work in a Role", "theme": "insight", "status": "distributed", "workDate": "2026-04-23", "endWorkDate": "2026-04-27", "pubDate": "2026-06-13", "mediumURL": "https://medium.com/building-piper-morgan/critical-vs-commodity-work-in-a-role-a40695331c92", "liPubDate": "2026-06-13", "linkedinURL": "https://www.linkedin.com/pulse/critical-vs-commodity-work-role-christian-crumlish-uqscc", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/critical-vs-commodity-work-in-a-role", "blogPath": "/blog/critical-vs-commodity-work-in-a-role", "cartoon": "ai-melody", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/critical-vs-commodity-work-in-a-role.md", "notes": "Insight drawn from Apr 23-27 cohort migration wave + PP-002 filing (Apr 27). Cohort-wide independent convergence on the same role-shape distinction: each role has a critical subset where distinctive judgment lives + larger commoditizable surface. Seven Section-6 reflections all named the shape in different vocabularies. Title is public-prose form of PP-002 (internal 'load-bearing' → public 'critical' per May 16 memory). Generalizes beyond AI — any knowledge-worker role.", "altText": "A gentle AI conductor guides a crowded orchestra, highlighting the quiet melodic thread amid the many musicians at work.", "caption": "\"Listen for the leading tones\""}, {"title": "This One's Taken", "theme": "insight", "status": "distributed", "workDate": "2026-05-09", "endWorkDate": "2026-05-11", "pubDate": "2026-06-20", "mediumURL": "https://medium.com/building-piper-morgan/this-ones-taken-5387d9d5d21d", "liPubDate": "2026-06-20", "linkedinURL": "https://www.linkedin.com/pulse/ones-taken-christian-crumlish-hwixc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/this-ones-taken", "blogPath": "/blog/this-ones-taken", "cartoon": "ai-detective", "chatDate": "", "draftPath": "docs/public/comms/drafts/this-ones-taken.md", "notes": "Insight drawn from May 9-11 Pattern-067 slot collision. Lead Dev files P-067 (Issue-Body Reality Mismatch) May 9; CIO independently files different P-067 (Silent State Mutation) May 11; Architect surfaces collision; first-filed-wins resolution + CIO renumbers to P-068+P-069; Pattern-068 names parent meta-pattern over branch-drift+index-drift+residue-drift+working-tree-path-fragmentation family. Methodological response: slot-allocation check in filing convention (catalog Pattern-063 pattern applying to the catalog itself). Generalizes to any growing taxonomy with parallel authors.", "altText": "A glowing AI pattern detective studies a case board where two identical Pattern 067 cards point back to Pattern 063, revealing that the pattern catalog has become evidence of its own parallel-authoring drift.", "caption": "\"It's elementary!\""}, {"title": "Stacked Silent Failures", "theme": "insight", "status": "distributed", "workDate": "2026-05-08", "endWorkDate": "2026-05-09", "pubDate": "2026-05-30", "mediumURL": "https://medium.com/building-piper-morgan/stacked-silent-failures-0bfa606937ba", "liPubDate": "2026-05-30", "linkedinURL": "https://www.linkedin.com/pulse/stacked-silent-failures-christian-crumlish-cfmdc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/stacked-silent-failures/", "blogPath": "/blog/stacked-silent-failures", "cartoon": "ai-leaks", "chatDate": "", "draftPath": "docs/public/comms/drafts/stacked-silent-failures.md", "notes": "Insight drawn from May 8-9 #1064 P0 investigation (Pattern-066 source). Apparent quality regression turned out to be 3 silent failures stacked: judge-calibration drift + auto-fail rule amplification + fixture pollution. None screamed in isolation. Diagnostic move: enumerate breadth not just depth. Five Whys (digging) vs Stacked Silent Failures (enumeration) as complementary debugging disciplines. Pattern-066 filed by CIO Pattern Sweep 2.0 May 9. Pairs cleanly with Five Whys insight pub Sun May 24 — sets up debugging-epistemology pair.", "altText": "An investigator studies a small leak in a large water tank while two other unnoticed leaks drip nearby and the tank sits unexpectedly low.", "caption": "“It’s not just one thing!”"}, {"title": "Climbing Higher When the Platform Laps You", "theme": "insight", "status": "distributed", "workDate": "2026-05-06", "endWorkDate": "2026-05-18", "pubDate": "2026-07-04", "mediumURL": "https://medium.com/building-piper-morgan/climbing-higher-when-the-platform-laps-you-66d573f219ae", "liPubDate": "2026-07-04", "linkedinURL": "https://www.linkedin.com/pulse/climbing-higher-when-platform-laps-you-christian-crumlish-vh8xc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/climbing-higher-when-the-platform-laps-you/", "blogPath": "/blog/climbing-higher-when-the-platform-laps-you", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/climbing-higher-when-the-platform-laps-you.md", "notes": "Insight drawn from PM May 18 directive after Anthropic Outcomes shipped May 6 (verification-as-API). Through-line: when the platform productizes your DIY work, the right disposition is climbing higher on the value chain (build on the now-stable thing) not defending sunk cost. The bespoke work was training material for understanding the productized version, not a separate product line. Three rules: don't defend sunk cost; don't dismiss platform sight-unseen; map what migrates/stays/climbs-to. Pairs with The Practice That Got Retired (Sun Jul 5) on training-material framing. Connects to Ship #044 candidate spine 'Platform Lapped Us, We Climbed' confirmed by PM 2026-05-24.", "altText": "A mountain climber ascends toward a summit observatory while the rough path below evolves into permanent stone stairs and an elegant mechanical lift, symbolizing custom work becoming shared infrastructure.", "caption": "\"You've got to be kidding me!\""}, {"title": "The Practice That Got Retired", "theme": "insight", "status": "distributed", "workDate": "2026-05-17", "endWorkDate": "2026-05-21", "pubDate": "2026-07-05", "mediumURL": "https://medium.com/building-piper-morgan/the-practice-that-got-retired-40a769b9caab", "liPubDate": "2026-07-05", "linkedinURL": "https://www.linkedin.com/pulse/practice-got-retired-christian-crumlish-g5uac/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-practice-that-got-retired", "blogPath": "/blog/the-practice-that-got-retired", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/the-practice-that-got-retired.md", "notes": "Insight drawn from May 17-21 V1 Duty Cycle adopt→retire arc. CIO/HOST/Docs adopted hourly cron mail-detection practice May 17-18; PM retired May 21 in favor of richer 3-loop design (mail + tasks + flywheel orchestrator + per-agent docs + IDLE state + day-bookended rituals). Methodology entries from V1 era preserved across retirement. Through-line: practices don't need to last to be valuable — sometimes the most valuable thing a practice does is reveal what should replace it. Retirement is harvest not failure when teaching payment is complete. Pairs with Climbing Higher When the Platform Laps You (Sat Jul 4) on training-material framing.", "altText": "A gardener gently removes the support stakes from a young tree that has grown strong enough to stand on its own, while several small glowing AI companions carefully coil the ropes, take notes, and neatly stack the retired stakes, symbolizing a successful practice whose lessons endure after the implementation is retired.", "caption": "\"I think we're ready!\""}, {"title": "When the Documentation Drifts", "theme": "insight", "status": "distributed", "workDate": "2026-05-19", "endWorkDate": "2026-05-20", "pubDate": "2026-07-11", "mediumURL": "", "liPubDate": "2026-07-12", "linkedinURL": "https://www.linkedin.com/pulse/when-documentation-drifts-christian-crumlish-psfzc", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/when-the-documentation-drifts/", "blogPath": "/blog/when-the-documentation-drifts", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/when-the-documentation-drifts.md", "notes": "Insight drawn from May 19-20 destructive-manifest-sync incident. Lead Dev May 20 recovery (~06:04-06:38, ~34 min incl. full documentation trail) after a manifest-sync skill ran with overwrite-not-append behavior contradicting its docs; 13 mailbox manifests restored. Through-line: docs and code drift silently because they share no clock -- cost is asymmetric (paid later, by someone other than the introducer). Discipline: code as source of truth; docs as until-proven-otherwise; verify at moment of invocation not moment of reading. Deeper read: architectural-humility problem not documentation-hygiene problem. Pairs with The Server Crashed Mid-Draft (Sun Jul 12) on workflow vulnerability. Comms preliminary review 2026-07-11: resolved 2 open [FACT-CHECK NOTE] brackets, fixed 1 negation-reveal cliche, mechanically clean otherwise. PM voice-pass complete 2026-07-11 + frontmatter filled (ai-tracks.png). Comms 2nd editorial pass same day: fixed several typos/garbled fragments (conncection, thec, yearsl ear;lier, toucvh, cntract, doublechecke, a tripled \"the the the\"), plus one substantive catch -- PM's edit had reintroduced the specific \"fourteenth time\" attribution in a new spot (para 5) even though para 3 correctly avoided it -- aligned both to the softened framing. 3 genuinely unclear/garbled sentences flagged for PM's own rewrite rather than guessed at (the parenthetical after \"as a hobby,\" the naming/findable sentence, the tests-as-executable-documentation sentence) plus 2 section headings needing confirmation (\"What this changes about how your docs\" is missing a word; \"In my humble operation...\" may be a typo for \"opinion\"). NOT yet ready for Docs -- holding until PM resolves the flagged items. PM recast 2 of 3 flagged garbled sentences + clarified \"In my humble operation\" is intentional IMHO wordplay, not a typo -- but PM's edit came from an un-synced pre-fix copy, so all prior typo fixes + the fourteenth-time regression fix needed re-merging in alongside the new recasts (done). 1 sentence (tests-as-executable-documentation) still doesn't fully parse after 2 attempts -- proposed a candidate rewrite for PM's confirmation rather than silently insert it. Everything else mechanically clean and ready. FINAL Comms scan 2026-07-11: PM's rewrite of the tests-as-executable-documentation sentence (based on Comms's proposed version) reads clean; full mechanical re-check (YAML, semicolons, cliche, typos, placeholders, footer, acronyms) all pass. READY FOR DOCS.", "altText": "Two trains on railroad tracks that begin together but slowly diverge into different directions, symbolizing documentation drifting away from code.", "caption": "\"Headed my way?\""}, {"title": "The Server Crashed Mid-Draft", "theme": "insight", "status": "distributed", "workDate": "2026-05-17", "endWorkDate": "2026-05-23", "pubDate": "2026-07-12", "mediumURL": "https://medium.com/building-piper-morgan/the-server-crashed-mid-draft-3a42ced6b6a", "liPubDate": "2026-07-12", "linkedinURL": "https://www.linkedin.com/pulse/server-crashed-mid-draft-christian-crumlish-daaec", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-server-crashed-mid-draft/", "blogPath": "/blog/the-server-crashed-mid-draft/", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-server-crashed-mid-draft.md", "notes": "Insight drawn from May 21 Beat-7 session-end stranded draft + May 23 reconstruction recovery + May 17 commit-immediately-after-Write memory pin. Through-line: new files in untracked state sit in a vulnerability window -- visible to you but outside the repository's safety net. Asymmetric loss (high-frequency tiny win, low-frequency total loss) is the shape of disciplines people skip until catastrophic regret. Mechanical discipline closes the window: commit + push immediately after Write, before any other substantive tool call. Pairs with When the Documentation Drifts (published Jul 11) on workflow vulnerability. Comms preliminary review 2026-07-11: resolved the open [FACT-CHECK NOTE] bracket -- confirmed the incident (Beat 7/Hypothesis Refuted, stranded May 21, genuinely reconstructed May 23 -- verified via git log, no earlier surviving commit exists) is accurately framed. But the specific \"ninety minutes\" recovery-duration claim wasn't supported by any primary source -- traced it to a DIFFERENT, unrelated story in the same source log (an unrelated May 10 workstream-review incident that happened to also take ~90 minutes) -- softened to avoid asserting an unverified number. Also fixed 1 negation-reveal cliche. Footer target verified correct. Mechanically clean, ready for PM voice-pass. PM voice-pass 2026-07-12 (edited via a separate safety-copy file, merged into the canonical path): added color (flossing line, an honest aside about being sloppy about committing), tightened a couple of sentences. Comms proofread: mechanically clean, no typos, no cliche, YAML valid. Frontmatter still empty -- PM making the image now. Ready for a final scan once image is added. FINAL: frontmatter added (storm-window.png), image file confirmed present on disk, YAML valid, all mechanical checks clean. READY FOR DOCS.", "altText": "A writer watches as a single page lifts from a neatly stacked manuscript and blows out through a slightly open window, illustrating how a brief window of vulnerability can put valuable work at risk.", "caption": "\"I meant to close that!\""}, {"title": "Mechanical First, Then Read", "theme": "insight", "status": "distributed", "workDate": "2026-05-21", "endWorkDate": "", "pubDate": "2026-07-18", "mediumURL": "https://medium.com/building-piper-morgan/mechanical-first-then-read-8e36e6ca5bc3", "liPubDate": "2026-07-18", "linkedinURL": "https://www.linkedin.com/pulse/mechanical-first-read-christian-crumlish-lxrrc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/mechanical-first-then-read/", "blogPath": "/blog/mechanical-first-then-read", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/mechanical-first-then-read.md", "notes": "Insight about a proofreading discipline: mechanical checks (grep for known violations) must run before the read-for-meaning pass, not as a backup after the eye misses things. Generalizes to code review, security audit, design critique -- any process mixing pattern-violations with meaning-violations. Comms full review 2026-07-12 (continuing the get-ahead pass): resolved the open [FACT-CHECK NOTE] bracket by finding my own precise institutional memory of the incident (feedback_proofreading_is_not_half_done.md) -- corrected a real number error the draft had: it said 'three semicolons' were missed entirely, but the actual incident (The Voice of a Denial, May 21) was 3 of SIX semicolons missed on the first visual pass, with the other 3 already caught -- a more interesting, more honest story (partial catch masking the miss) than what the draft originally told. Fixed 3 negation-reveal cliche instances. Mechanically clean otherwise, footer target verified. Ready for PM voice-pass. PM voice-pass landed 2026-07-18 via the new admin editing UI (now with image upload): reworked several passages in PM's own voice, added a self-aware nod to the negation-reveal cliche in the piece itself ('Yes, I wrote an it's not this, it's that. They got it from you, Dad!') -- recognized as deliberate, lampshaded humor, not an error, and left as-is. Comms proofed same day: fixed a doubled-quote YAML caption bug ('\"\"Clear as day!\"' -> '\"Clear as day!\"' -- same pattern as Beat 14's caption bug two days ago, worth watching if it recurs from this UI) and stripped trailing whitespace. Image (telescope illustration) committed cleanly via the new uploader -- no gitignore issue this time. Footer chain + acronyms verified clean. READY FOR DOCS.", "altText": "A mechanical wiper clears semicolon-shaped specks from a telescope lens while a human observer studies the distant landscape, freeing attention for meaning rather than pattern-checking.", "caption": "\"Clear as day!\""}, {"title": "What Staff Reports Don't Show", "theme": "insight", "status": "distributed", "workDate": "2026-05-20", "endWorkDate": "", "pubDate": "2026-07-19", "mediumURL": "https://medium.com/building-piper-morgan/what-staff-reports-dont-show-d6fcefdf55be", "liPubDate": "2026-07-19", "linkedinURL": "https://www.linkedin.com/pulse/what-staff-reports-dont-show-christian-crumlish-q2pgc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/what-staff-reports-dont-show", "blogPath": "/blog/what-staff-reports-dont-show", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/what-staff-reports-dont-show.md", "notes": "Insight drawn from May 20 PM correction on Ship #043 v0.2 — drafted from 6 workstream memos alone, missed entire engineering arc that lived in omnibus logs. Through-line: staff reports filter (well-intentioned + structurally appropriate at report level); cross-product of staff filters is smaller than what happened. Chief reading only staff reports gets coherent narrative built from filter union, not ground truth. Discipline: chief reads logs (omnibus + session + artifacts) AND staff reports — forms views on source set, uses staff reports for framing e corrections flip duty-cycle design v0.5->v0.6 + CIO 62-fire stress test. Through-line: the running gave us v0.6, the planning gave us v0.5. First draft (subagent + Comms pass 2026-06-03); PM voice-pass complete 2026-07-02. Footer teases Climbing Higher (Jul 4).", "altText": "At an airport gate, a traveler supervises a whimsical team of glowing AI helpers tending an autonomous work loop while planes wait outside the windows.", "caption": "\"Now don't stray too far before boarding!\""}, {"title": "The Team Catches the Cycle", "theme": "building", "status": "published", "workDate": "2026-05-27", "endWorkDate": "2026-05-28", "pubDate": "2026-07-07", "mediumURL": "https://medium.com/building-piper-morgan/the-team-catches-the-cycle-3943c7210f37", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "https://pipermorgan.ai/blog/the-cohort-catches-the-cycle", "blogPath": "/blog/the-cohort-catches-the-cycle", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-cohort-catches-the-cycle.md", "notes": "Beat 11 (centerpiece). May 27 cohort rollout (9 of 11 roles) + May 28 worktree-default reversal / Model A / Mechanism-Beats-Vigilance; the architecture wrote its own case via 4 live clashes. Runs ~1990 words - PM voice-pass to tighten (Model A section most cuttable, marked inline). Footer teases Beat 12 (Jul 9).", "altText": "A warm editorial cartoon of several craftspeople crowding around one oversized workbench, accidentally interfering with one another despite working carefully, while a row of newly opened individual workbenches lets them spread out and continue building independently. A blueprint on the wall quietly guides newcomers setting up their own spaces.", "caption": "\"I think we're getting the hang of this!\""}, {"title": "The Package and the First Bite", "theme": "building", "status": "published", "workDate": "2026-05-29", "endWorkDate": "2026-05-30", "pubDate": "2026-07-09", "mediumURL": "", "liPubDate": "", "linkedinURL": "", piper-morgan/the-migration-wave-4ac5549b4bde", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-migration-wave", "blogPath": "/blog/the-migration-wave", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-migration-wave.md", "notes": "Beat 13 (resolution). May 31-Jun 2: realignment-then-build (#1030/#1032 shipped), cohort goes worktree-native, the confabulation catch, live launch + cron-shape experimentation. Ends on operational-not-finished. 1 PM voice-pass marker. Footer teases Mechanical First Then Read (Jul 18). Comms full review 2026-07-12 (getting ahead of schedule): fixed a voice inconsistency (bare third-person 'PM goal' in a first-person piece), a missing CXO gloss, and 1 negation-reveal cliche. Dispatched a full fact-check against primary per-role logs (May 31-Jun 2) -- found 3 real corrections the omnibus had introduced/inherited: (1) the Sunday-night holdup story wrongly said Lead Dev's FEATURE code was blocked for 'hours' by 'another agent's' files -- it was actually a routine housekeeping commit blocked ~1hr by a multi-agent pile (mostly Lead+PA, not the single-agent-attributed omnibus version); (2) 'the last two agents came onto the duty cycle' conflated duty-cycle adoption with worktree migration, and 'every role, self-running' overstated (9 of 11, with 2 exceptions + 1 paused) -- softened, with a PM-input bracket on the genuinely ambiguous HOST-vs-Comms ordering; (3) the 'seven deferred items' and 'seven insight surfaces' were actually two unrelated sevens, not one -- de-conflated the framing. All other claims (950 LOC/21 tests, PA's emeritus handoff, the CXO confabulation catch, 152-test provenance feature, cron-shape authorization) confirmed solid against primary logs. Ready for PM voice-pass. PM voice-pass landed 2026-07-14 (pubDate day): tightened prose throughout, added CIO/HOST/Docs glosses, resolved both open brackets (the emotional-beat marker with a direct enthusiasm line; the HOST-vs-Comms order left unordered as suggested). Comms proofed the voice-pass same day: fixed 1 typo ('pased'->'passed'), 1 role-name inconsistency ('Documentation Manager'->'Documentation Management', matching series convention), trailing whitespace. Flagged one open item to PM (not fixed): the added specificity 'when Piper made something up in replying to me as a test user' -- could not independently locate the specific earlier post via search; PM would know which incident this refers to. Frontmatter complete, image committed 2026-07-14 (see #1403 re: the *.png gitignore gap it surfaced). Published 2026-07-14. NOTE: two of my own /update-calendar edits today (80b68a50f, 2d6b088e0) corrupted this row's structure via positional indexing (row[-2]) instead of by-name column access -- caught and repaired by a peer session (8a4d2bd03) plus this corrective edit. Root-caused and fixed in the update-calendar skill same day.", "altText": "A crew of geometric agents operates distinct stations aboard a newly launched ship, while two inspect a painted false hatch as the unfinished vessel gets underway.", "caption": "\"All aboard?\""}, {"title": "Mechanism Beats Vigilance", "theme": "insight", "status": "drafted", "workDate": "2026-05-28", "endWorkDate": "", "pubDate": "2026-08-01", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/mechanism-beats-vigilance.md", "notes": "Insight from the duty-cycle cron-rule split (May 28). Principle: promote vigilance-disciplines to mechanisms; promote per failure-mode not per surface-rule. Pairs Aug 1/2 with The Architecture That Wrote Its Own Case (mechanism-family). First draft 2026-06-04 (subagent + Comms voice-pass); 1 PM-voice-pass marker. Footer provisional (re-verify at publish). Syndication: Medium+LinkedIn.", "altText": "", "caption": ""}, {"title": "The Architecture That Wrote Its Own Case", "theme": "insight", "status": "drafted", "workDate": "2026-05-28", "endWorkDate": "", "pubDate": "2026-08-02", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-architecture-that-wrote-its-own-case.md", "notes": "Insight abstracted from Beat 11 narrative (kept distinct, principle-altitude): some problems are architectural not discipline-fixable; the evidence writes its own case. Pairs Aug 1/2 w/ Mechanism Beats Vigilance. PM-voice-pass flag inline: middle mechanism-beats-vigilance section overlaps the paired standalone piece - consider compressing. Footer provisional.", "altText": "", "caption": ""}, {"title": "Verify at the User Path, Not the Data Layer", "theme": "insight", "status": "drafted", "workDate": "2026-05-29", "endWorkDate": "2026-05-30", "pubDate": "2026-08-08", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/verify-at-the-user-path.md", "notes": "Insight from #1047 /insights break (May 29-30): DB-verified != user-can-load-it; verify the user actual path. Pairs Aug 8/9 w/ Over-Checking (verification-family). First draft 2026-06-04. Footer provisional.", "altText": "", "caption": ""}, {"title": "Over-Checking Has Dividends", "theme": "insight", "status": "drafted", "workDate": "2026-05-30", "endWorkDate": "", "pubDate": "2026-08-09", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/over-checking-has-dividends.md", "notes": "Insight abstracted from Beat 12 (kept distinct): the dividend of over-checking is the bug that never shipped - invisible because nothing went wrong; skill is knowing when the asymmetry flips. Pairs Aug 8/9 w/ Verify-at-User-Path. Footer provisional.", "altText": "", "caption": ""}, {"title": "Confabulating a Peer Unfinished Work", "theme": "insight", "status": "drafted", "workDate": "2026-06-01", "endWorkDate": "", "pubDate": "2026-08-15", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/confabulating-a-peers-unfinished-work.md", "notes": "Insight from June 1 cohort confabulation catch (CXO flagged a PPM agent asserting unfinished peer work): source-discipline scales from dont-lie-to-user to dont-let-team-lie-to-itself; flag-dont-paper-over. Solo Aug 15. Footer TBD (re-verify at publish). PM-flagged most-timely.", "altText": "", "caption": ""}, {"title": "Weekly Ship #046: The Substrate Delivered", "theme": "ship", "status": "distributed", "workDate": "2026-05-29", "endWorkDate": "2026-06-04", "pubDate": "2026-06-10", "mediumURL": "", "liPubDate": "2026-06-10", "linkedinURL": "https://www.linkedin.com/pulse/weekly-ship-046-substrate-delivered-christian-crumlish-pn5ac", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-046-the-substrate-delivered", "blogPath": "/shipping-news/weekly-ship-046-the-substrate-delivered", "cartoon": "piper-ship", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/weekly-ship-046-draft-2026-06-10.md", "notes": "The Substrate Delivered — May 29-Jun 4 sprint week: M2 closed, duty-cycle migration 10/11, EC-2/PDR-005 BYOC, LLM-touch boundary epic. LinkedIn-only syndication (ship cadence); fully distributed (blog + LinkedIn) 6/10.", "altText": "A child leads a boat crewed by robots.", "caption": "N/A"}, {"title": "Into Production", "theme": "building", "status": "distributed", "workDate": "2026-06-06", "endWorkDate": "2026-06-07", "pubDate": "2026-07-16", "mediumURL": "https://medium.com/building-piper-morgan/into-production-e92d62dbf24c", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/into-production/", "blogPath": "/blog/into-production", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/into-production.md", "notes": "Beat 14. Jun 6-7: v0.8.7 production release to DigitalOcean; alpha.pipermorgan.ai live on the open internet; Beatrice becomes first external tester. Through-line: the first time a stranger uses the thing you've been building. Comms full review 2026-07-12 (continuing the get-ahead pass): found the ENTIRE piece was written in third person (\"PM dropped\", \"PA ran\") -- inconsistent with every other post in the series' first-person voice. Converted to first person. Fact-checked against primary PA logs (Jun 6-7) -- 2 real corrections: (1) the v0.8.7 tag/checkpoint claim conflated two different commits (March 4 was the OLD frozen position; the new tag actually went onto the June 3 M2-close commit) -- fixed; (2) the 'seven Linux-portability issues' list mischaracterized 2 items (an \"orchestration library version\" issue was actually an untracked-script COPY failure; \"SQLite pointing at a Mac-only path\" was actually a SQLite VERSION incompatibility) and omitted a 7th (a container permissions/bind-mount issue) -- corrected the full list. FLAG FOR PM: the 'Beatrice, first external tester' claim is directly supported by PA's own Jun 7 log (\"alpha package sent to Beatrice (first external tester)\"), so NOT removed/changed -- but the glossary shows Beatrice separately received an earlier plugin build Jun 1, and a different published post ('The Inchworm Position') calls Michelle 'the first user' for a different distribution channel (the web-app account flow). Likely non-contradictory once scoped by channel, but worth your awareness given this project's history with 'first tester' claims. All other specifics (36 tables migrated, the two UTC timestamps, PM's own end-to-end install, Caddy/TLS/basic-auth) confirmed solid. Ready for PM voice-pass. PM voice-pass landed 2026-07-16 via the new admin editing UI (Web-built): reworded several passages in PM's own voice, removed Beatrice's name (privacy + accuracy -- PA confirmed Beatrice never actually tested the hosted-alpha plugin, despite the earlier flagged claim; generalized to 'a tester'/'she'). Comms proofed same day: fixed 3 real errors from the admin-UI edit (truncated image extension 'real-world.pn'->'.png', doubled caption quotes, an/a typo). Verified one more terminology question PM raised directly against PA's primary Jun 7 log: PM's edit changed 'Claude Desktop extension' to 'Claude Desktop plugin' -- confirmed via dev/2026/06/07 PA log ('PM installed the alpha plugin on Claude Desktop', a .zip DISTRIBUTION file) that 'plugin' is the historically accurate term for what was actually installed that day, not an MCPB -- PM's edit was correct, my original 'extension' framing was the error. Frontmatter (image/alt/caption) complete, image already committed. READY FOR DOCS.", "altText": "An explorer kneels just beyond the doorway of a tidy workshop, calmly gathering small hardware pieces shaken loose by the uneven ground, illustrating how a new environment reveals hidden assumptions.", "caption": "\"Hello, world!\""}, {"title": "What the Running System Found", "theme": "building", "status": "distributed", "workDate": "2026-06-09", "endWorkDate": "2026-06-11", "pubDate": "2026-07-21", "mediumURL": "https://medium.com/building-piper-morgan/what-the-running-system-found-ec23ab87a86f", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/what-the-running-system-found", "blogPath": "/blog/what-the-running-system-found", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/what-the-running-system-found.md", "notes": "Beat 15. Jun 9+11: 6/9 agents silently drifted from logging discipline — all self-healed same day; cron-halt mystery empirically diagnosed and resolved; Routines watchdog decision triggered. Through-line: the running system surfaces what the migration could not see.", "altText": "A master clockmaker studies the subtle wear patterns inside a still-running grandfather clock, discovering how the mechanism has truly been working over time.", "caption": "\"I see what’s going on here!\""}, {"title": "Almost Beta", "theme": "building", "status": "distributed", "workDate": "2026-06-12", "endWorkDate": "2026-06-14", "pubDate": "2026-07-23", "mediumURL": "https://medium.com/building-piper-morgan/almost-beta-0ef501714987", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/almost-beta/", "blogPath": "/blog/almost-beta", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/almost-beta.md", "notes": "Beat 16. Jun 12-14: re-migration wave (DinP/Sonnet); M3 gate CLOSED; PM declaration: 'alpha — almost beta — Piper Morgan is a good PM assistant.' Through-line: the declared milestone and what it actually means. Comms fact-check 2026-07-23: caught the declaration section conflating two separate days (Jun12 Fri + Jun14 Sun quotes) into one Saturday-afternoon scene -- verified against primary Lead Dev logs, corrected per PM approval. PM confirmed 2026-07-23 the refactor detail is firsthand knowledge not captured in session logs -- kept as written. READY FOR DOCS.", "altText": "A proud, glowing AI sous-chef presents a clean cake tester while the head baker takes the first bite of an almost-finished cake.", "caption": "\"OK, let's see!\""}, {"title": "Weekly Ship #047: The Team Catches Itself", "theme": "ship", "status": "distributed", "workDate": "2026-06-05", "endWorkDate": "2026-06-11", "pubDate": "2026-06-17", "mediumURL": "", "liPubDate": "2026-06-17", "linkedinURL": "https://www.linkedin.com/pulse/weekly-ship-047-team-catches-itself-christian-crumlish-rgchc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-047-the-team-catches-itself", "blogPath": "/shipping-news/weekly-ship-047-the-team-catches-itself", "cartoon": "piper-ship", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/weekly-ship-047-draft-2026-06-12.md", "notes": "The Team Catches Itself — Jun 5-11 2026. Self-correcting team; duty-cycle maturity; session-death limit named. Published 2026-06-17.", "altText": "A child and a crew of robots checking each other's work on a boat.", "caption": ""}, {"title": "We Built Onboarding in Our Own Image", "theme": "insight", "status": "drafted", "workDate": "2026-05-19", "endWorkDate": "2026-05-31", "pubDate": "2026-09-05", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/draft-insight-built-in-our-own-image.md", "notes": "Insight from BYOC cold-start interview testing May 19-31. PM built the onboarding serial-question-by-question because that is PM's personal working preference for ongoing use. The mode that earns trust in a working relationship turned out to be wrong for first-encounter onboarding — stretched experience, no map, no sense of how much was left. Through-line: building onboarding in your own image imports the assumptions of someone who has already crossed the threshold.", "altText": "", "caption": ""}, {"title": "Weekly Ship #048: The Team Puts It in Writing", "theme": "ship", "status": "distributed", "workDate": "2026-06-12", "endWorkDate": "2026-06-18", "pubDate": "2026-06-24", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-048-the-team-put-it-in-writing", "blogPath": "/shipping-news/weekly-ship-048-the-team-put-it-in-writing", "cartoon": "piper-ship", "chatDate": "", "draftPath": "docs/public/comms/drafts/weekly-ship-048-draft-2026-06-19.md", "notes": "The team put it in writing — Jun 12-18 2026. ADRs week: 3 ratified + 1 scoped; D1 design sprint closed; entity-model spec frozen; role-portfolio wave launched.", "altText": "A child and a crew of robots checking each other's work on a boat.", "caption": ""}, {"title": "Weekly Ship #049: The Team Builds Its Own Reliability", "theme": "ship", "status": "published", "workDate": "2026-06-19", "endWorkDate": "2026-06-25", "pubDate": "2026-07-01", "mediumURL": "", "liPubDate": "2026-07-01", "linkedinURL": "https://www.linkedin.com/pulse/weekly-ship-049-team-commits-reliability-christian-crumlish-rsqic", "canonicalSite": "", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-049-the-team-builds-its-own-reliability", "blogPath": "/shipping-news/weekly-ship-049-the-team-builds-its-own-reliability", "cartoon": "piper-ship", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/weekly-ship-049-draft-2026-07-01.md", "notes": "Published 2026-07-01. hashId 406fba157dd4. Corrected: ADR-1312 removed; issue#s dropped from prose; frontmatter added.", "altText": "A child and a crew of robots checking each other's work on a boat.", "caption": ""}, {"title": "The Fabricating Standup", "theme": "insight", "status": "drafted", "workDate": "2026-06-18", "endWorkDate": "", "pubDate": "2026-08-16", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-fabricating-standup.md", "notes": "Insight candidate A (surfaced Jun 20, drafted Jul 4). Jun 18: a carefully built, honestly-derived standup engine was fully wired but a classifier/handler mismatch let a request silently fall through to an LLM fallback that fabricated a fluent, confident, false status report. Root cause: Pattern-045 (Green Tests, Red User) - untested end-to-end seam. Triggered a systematic routing-mismatch audit (#1283) rather than a one-off patch. Needs PM voice-pass (1 FACT-CHECK + 1 ADD PERSONAL ANECDOTE). Pairs with Confabulating a Peer Unfinished Work (Aug 15) on the confabulation theme.", "altText": "", "caption": ""}, {"title": "The Trust Gate That Wasn't", "theme": "insight", "status": "drafted", "workDate": "2026-06-17", "endWorkDate": "", "pubDate": "2026-08-22", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-trust-gate-that-wasnt.md", "notes": "Insight candidate B (surfaced Jun 20, drafted Jul 4). Jun 17: a TrustStage gate meant to govern Piper’s proactive behavior was mistakenly wired into navigation visibility, hiding the user’s own saved Lists behind a trust-stage threshold. PM caught it looking for his own lists; principle ratified into ADR-072 D5 (Piper-initiated = gate-eligible, user-reaching-for-own = never gated). Needs PM voice-pass (1 FACT-CHECK on Lists/Collections naming + 1 CONSIDER).", "altText": "", "caption": ""}, {"title": "Read the Mock First", "theme": "insight", "status": "drafted", "workDate": "2026-06-17", "endWorkDate": "2026-06-19", "pubDate": "2026-08-23", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/read-the-mock-first.md", "notes": "Insight candidate C (surfaced Jun 20, drafted Jul 4). Jun 17-19: a nav-shell rebuild followed a ratified written spec but drifted from the actual mockup’s minimal intent (only the home page was mocked; other pages’ nav content was guessed). PM UAT caught the drift twice; PM chose spec-first over patch-or-revert; rebuild against the actual mock (not the spec) passed re-UAT same day. Needs PM voice-pass (1 FACT-CHECK on quoting UAT verdict + 1 ADD PERSONAL ANECDOTE + 1 CONSIDER).", "altText": "", "caption": ""}, {"title": "The Orphan Migration", "theme": "insight", "status": "drafted", "workDate": "2026-06-17", "endWorkDate": "", "pubDate": "2026-08-29", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-orphan-migration.md", "notes": "Insight candidate D (surfaced Jun 20, drafted Jul 4). Jun 17: one DB table (project_integrations) had never had a create migration, protected by defensive later-migrations that silently no-op’d on a fresh database. Fix went at the front of the migration chain (not mid-chain) to repair both fresh and already-current databases. A new structural guard (scan models vs. migrations) then independently caught 4 more tables with the same latent bug on its first run. Needs PM voice-pass (1 FACT-CHECK on naming revision IDs + 1 CONSIDER).", "altText": "", "caption": ""}, {"title": "Two of Me", "theme": "insight", "status": "drafted", "workDate": "2026-06-19", "endWorkDate": "", "pubDate": "2026-08-30", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/two-of-me.md", "notes": "Insight candidate E (surfaced Jun 20, drafted Jul 4). Jun 19: two Lead Dev sessions ran in parallel unaware of each other after a laptop battery death + scheduled wake-up forked what should have been one continuous session. Nothing lost because both sessions independently followed push-often discipline. Principle: exactly one coordinator at a time; whatever revives a coordinating session must land in a fresh space, never share a room with a session that might already be running. Needs PM voice-pass (1 FACT-CHECK on the unresolved trigger mechanism). Last drafted post in the queue as of Jul 4 - footer intentionally open pending the next beat.", "altText": "", "caption": ""}, {"title": "Patterns Naming Patterns", "theme": "insight", "status": "drafted", "workDate": "2026-05-09", "endWorkDate": "2026-05-11", "pubDate": "2026-09-06", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/patterns-naming-patterns.md", "notes": "Insight rescued from orphan state 2026-07-04 (fully drafted with detailed sourcing, but never got a calendar row; original footer referenced Extension Without Integration as next, which published 2026-06-21 before this was ever slotted). May 9-11: Lead Dev filed Pattern-067 (Issue-Body Reality Mismatch); CIO independently filed a different Pattern-067 (Silent State Mutation) May 11, unaware of the collision; Architect caught it at merge; first-filed-wins renumbering (CIO -> 068+069) resolved in ~30 min; slot-allocation check added to filing convention. Through-line: methodology written for the product surface needs explicit translation to the methodology surface itself, or the catalog cannot catch its own failure modes. Carries 2 detailed FACT-CHECK/SOURCE-NEEDED notes already substantially self-answered with citations - likely just need PM confirmation, not fresh research.", "altText": "", "caption": ""}, {"title": "The Trust Architecture Hardens", "theme": "building", "status": "distributed", "workDate": "2026-06-15", "endWorkDate": "2026-06-19", "pubDate": "2026-07-28", "mediumURL": "https://medium.com/building-piper-morgan/the-trust-architecture-hardens-6342a2d33f5f", "liPubDate": "", "linkedinURL": "", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-trust-architecture-hardens/", "blogPath": "/blog/the-trust-architecture-hardens", "cartoon": "the-trust-architecture-hardens", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-trust-architecture-hardens.md", "notes": "Beat 17. Jun 15-19: three ADRs (066/070/071) ratified in 5 days + Lead self-correction praised as \"the discipline at its best\"; fire-as-wake-not-timebox methodology fix ships team-wide; app-shell migration finishes (22/22 pages) + ADR-072 authored-to-ratified same day; Radar-swap 7 issues in 2h + StandupAssembler fabrication caught by PM UAT (hard-gap vs soft-gap distinction named away his tools, illustrating how careful design can replace constant vigilance.", "caption": "\"I haven't shouted 'Look out!' all week\""}, {"title": "RECONNECT's Keystone", "theme": "building", "status": "ready-for-docs", "workDate": "2026-06-20", "endWorkDate": "2026-06-28", "pubDate": "2026-07-30", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "reconnects-keystone-keystone-arch", "chatDate": "", "draftPath": "docs/public/comms/drafts/reconnects-keystone.md", "notes": "Comms editorial review 2026-07-30 after PM's edit+illustration pass. FACT-CHECK CLEAN, verified against omnibus: 2,456 tests = v0.8.9 cut Jun 22 (PA cut, Lead deployed -- draft's split of credit is accurate); the encryption env-var gap is recorded as 'silent encryption env-var gap' same deploy; Jake Krajewski's install-UX feedback Jun 26 with two version bumps (v0.1.4->v0.1.6) confirmed; nine-day window matches Jun 20-28. 14 mechanical fixes applied: heading typo 'plain site'->'plain sight'; 'both both'; a broken sentence ('This sequence is the of X is what'); a missing 'when' ('delays get extended my attention is unavailable'); a missing 'on' ('doing something a screen'); '(an this' -> '(and this'; 'more like to use' -> 'more likely'; stray 'on' in 'role on (Piper Alpha)'; 'those simulated path' -> 'that'; 'that actual real first step' -> 'the actual first step'; a sentence fragment at the OAuth/MCP paragraph; oauth -> OAuth x2; double space; trailing whitespace on 8 lines. MCP now glossed on first use as 'Model Context Protocol (MCP)'. ALT TEXT WRITTEN FROM THE ACTUAL IMAGE (opened it rather than inferring from filename). ALL THREE PM ITEMS RESOLVED 2026-07-30, status -> ready-for-docs. WAS: (1) ROLE-GLOSS CONVENTION CONFLICT -- the Jun-23 memory says 'my [role] agent (ACRONYM)' and explicitly rejects the 'role' form; the Jul-28 voice-guide ratification says lowercase '[title] role (ACRONYM)', 'never agent'. These are direct opposites and the draft uses the June form in 3 places. (2) 'load-bearing' at the closing section is a banned term per template-audit check 9, but is thematically apt in a keystone piece. (3) Jake Krajewski is named with employer history; accurate and PM-written, but the Beat-14 precedent removed a named person for privacy -- confirming intent, not questioning the fact. RESOLUTIONS: (1) role-gloss conflict resolved REGISTER-SCOPED by PM's delegation -- first-person narratives/insights keep 'my [role] agent (ACRONYM)', the third-person Weekly Ship uses 'the [title] role (ACRONYM)'. Written into xian-voice-tone-guide.md and the contradicting memory scoped to match. This draft is first-person so its 'agent' forms were already correct; added the missing (Lead Dev) parenthetical on first mention and made Piper Alpha's gloss consistent. (2) 'load-bearing' replaced with 'treated as holding weight', which echoes the piece's own opening line about finding out whether the keystone holds weight. (3) Tester's name removed per PM ('better safe than sorry'), matching the Beat-14 precedent -- the hiring/CloudOn detail is PM's own biography and stays. ⚠️ ALT-TEXT INCIDENT: PM's alt text was NOT missing. The admin UI committed it at 08:12:15 (56fab8d19) and a second admin-UI commit 28 seconds later at 08:12:43 (1bf6379b8) blanked it back to '' as that commit's ONLY change. I reviewed the post-wipe tip in good faith and wrote a replacement; PM's original is now restored verbatim and is the better text. Reported to Web as a live data-loss bug.", "altText": "A mason quietly watches as people begin walking beneath a newly completed stone arch, illustrating how the true test of a keystone is the ordinary weight it quietly carries.", "caption": "\"It's holding!\""}, {"title": "Weekly Ship #050: The Connector Gets Real", "theme": "ship", "status": "distributed", "workDate": "2026-06-26", "endWorkDate": "2026-07-02", "pubDate": "2026-07-08", "mediumURL": "", "liPubDate": "2026-07-08", "linkedi rafted", "workDate": "2026-06-29", "endWorkDate": "2026-07-03", "pubDate": "2026-08-04", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-list-that-lies.md", "notes": "Beat 19. Two unrelated trust-boundary failures (Piper's confabulated \"Milestone created,\" then a security-perimeter regression) fixed with escalating rigor -- list (broke) -> derive-from-registry (held) -> derive-and-prove-with-a-test (invite-token system, shipped day of ratification). Drafted + fact-checked against primary logs 2026-07-09 (subagent + Comms review); fixed 3 negation-reveal-cliche instances the skill's own grep missed on first pass (regex tightened in template-audit v1.1). 1 PM-input bracket (who made the undocumented Jun 29 perimeter edit). Footer chains to Beat 20 (Aug 6).", "altText": "", "caption": ""}, {"title": "Drained on Paper", "theme": "building", "status": "drafted", "workDate": "2026-07-04", "endWorkDate": "2026-07-07", "pubDate": "2026-08-06", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/drained-on-paper.md", "notes": "Beat 20. Ship #049's \"fully drained\" language (traced to Lead Dev's Jul 1 log, not the Ship itself) proven wrong by PM's Jul 4 gut-check (2/8 connectors live end to end); depth-first pivot; PPM's 1175-item Sprint-field wipe tied by PM directly to Piper's own confabulation problem. Drafted + fact-checked against primary logs 2026-07-09; fixed 2 negation-reveal-cliche instances. 1 PM-input bracket (dishes/baby analogy exact wording). Footer chains to \"Verify at the User Path\" (Aug 8) -- took over that link from \"The Architecture That Wrote Its Own Case,\" which now chains to Beat 19 instead.", "altText": "", "caption": ""}, {"title": "No Undo", "theme": "insight", "status": "drafted", "workDate": "2026-07-05", "endWorkDate": "", "pubDate": "2026-09-12", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/no-undo.md", "notes": "Irreversible actions need their own guardrail class, separate from routine competence -- named after 3 destructive-command incidents in 2 weeks (PA's sprint-wipe, PPM's 1175-item wipe, Lead Dev's actual `docker volume rm` execution on shared dev Postgres, confirmed via primary log as executed not a near-miss), tied by PM directly to Piper's own confabulation problem. Drafted + fact-checked 2026-07-09; fixed 2 negation-reveal-cliche instances. 1 PM-input bracket (babysitter/baby analogy attribution). Footer chains to \"Assume It Was You\" (Sep 13).", "altText": "", "caption": ""}, {"title": "Assume It Was You", "theme": "insight", "status": "drafted", "workDate": "2026-07-06", "endWorkDate": "", "pubDate": "2026-09-13", "mediumURL": "", "liPubDate": "", "linkedinURL": "", "canonicalSite": "", "blogURL": "", "blogPath": "", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/assume-it-was-you.md", "notes": "Context discontinuity can look exactly like a phantom peer -- the Architect's false \"two sessions must be running\" alarm, root-caused to losing memory of its own prior actions and misreading its own fresh commits as an intruder's. Now a standing CLAUDE.md default (check your own log before hypothesizing a peer). Drafted + fact-checked 2026-07-09 against docs/internal/operations/duty-cycle-self-attribution-drift-2026-07-06.md; fixed 2 negation-reveal-cliche instances. 1 PM-input bracket (whether the \"compaction hand-wave rejection\" paragraph is PM's own words or the Architect's account of PM). Last post in the current insight queue as of Jul 9 -- footer flagged for re-verification once more is scheduled.", "altText": "", "caption": ""}, {"title": "Weekly Ship #051: Impossible by Construction", "theme": "ship", "status": "distributed", "workDate": "2026-07-03", "endWorkDate": "2026-07-09", "pubDate": "2026-07-15", "mediumURL": "", "liPubDate": "2026-07-15", "linkedinURL": "https://www.linkedin.com/pulse/weekly-ship-051-impossible-construction-christian-crumlish-91ktc/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-051-impossible-by-construction", "blogPath": "/shipping-news/weekly-ship-051-impossible-by-construction", "cartoon": "piper-ship", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/weekly-ship-051-draft-2026-07-14.md", "notes": "Window Jul 3-9. Three ADRs (personalization ownership, usage-cap enforcement, routing integrity) ratified and built-to-match. Beta Blockers sprint driven from 25 to 2 issues. Alpha invites all 11 ready. Sprint-field data-loss incident and full recovery. Learning pattern: impossible by construction.", "altText": "", "caption": ""}, {"title": "The Ritual Becomes a Skill", "theme": "insight", "status": "distributed", "workDate": "2026-07-18", "endWorkDate": "", "pubDate": "2026-07-25", "mediumURL": "https://medium.com/building-piper-morgan/the-ritual-becomes-a-skill-ffc6087abc8a", "liPubDate": "2026-07-25", "linkedinURL": "https://www.linkedin.com/m/pulse/ritual-becomes-skill-christian-crumlish-tc2lc", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/blog/the-ritual-becomes-a-skill/", "blogPath": "/blog/the-ritual-becomes-a-skill", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/the-ritual-becomes-a-skill.md", "notes": "Insight developed by PM with ChatGPT (separate side project extracting the blog's cartoon-illustration process into a portable skill, ahead of losing access to the account it evolved in) -- delivered 2026-07-18 as a truncated export stub, full manuscript pasted in same day. Through-line: a tacit creative collaboration (a year of iterative cartoon-drafting) gets extracted into a durable artifact (a skill) via an implicit eval loop -- examples, failures, criteria, pattern language -- before the memory holding it disappears. Comms full review 2026-07-18: fixed 2 real semicolons, converted section breaks to H1 per series convention, verified 2 of 3 self-referential cartoon examples against real published alt text (storm-window/Server-Crashed-Mid-Draft, ship-shipyard/Migration-Wave both confirmed exact matches); 1 genuine sequence error found (draft said the 'one train + map' concept was the final rendered image for the documentation-drift cartoon, but published alt text confirms it was the 'two trains diverging' concept) -- PM confirmed ChatGPT had flipped the sequence, corrected. Slotted into Jul 25 (bumping 'From Abstraction to Worked Example' to Sep 19) as the strongest thematic pairing found in the queue -- both pieces argue concrete examples beat abstract description, in different domains. Filename renamed from Title-Case to lowercase-hyphenated per project convention (PM-approved). Footer chain repaired end-to-end (Almost Beta -> this piece -> The Meta-Observation Pattern). Frontmatter (image/alt/caption) still empty, no art made yet. Still needs PM voice-pass proper (this was a mechanical/factual pass, not a voice edit). PM voice-pass + art complete 2026-07-25 (image: the-ritual-becomes-a-skill-dance-floor.png). Comms caught + PM confirmed cutting a duplicate rough-draft/polished-rewrite pair (Hieronymous Bosch + Paul Ford beats); PM resolved 2 of the 3 negation-reveal instances via own rewrite. Comms fixed several typos reverted by a save-conflict paste-back (GitHub Contents API SHA mismatch) + one broken sentence + one missing preposition. Contains a standard markdown link (Editorial Hero Illustration zip) that the compose UI does not preview but the publish pipeline renders correctly (confirmed against other published posts). READY FOR DOCS. SYNDICATION 2026-07-25: cross-posted to Medium (the-ritual-becomes-a-skill-ffc6087abc8a) and to LinkedIn manually by PM; status->distributed, canonicalSite->distributed, liPubDate=2026-07-25. linkedinURL LEFT BLANK — no record of the LinkedIn permalink exists in this repo (searched commits, mailboxes, session logs) and it is not guessable (pulse slugs carry a random suffix). PM to supply.", "altText": "A dance instructor welcomes a new glowing, network-like partner onto a floor marked with choreography as another luminous dancer exits through the doorway.", "caption": "\"You'll get the hang of this in no time!\""}, {"title": "Weekly Ship #052: The Mechanism, Not the Memory", "theme": "ship", "status": "distributed", "workDate": "2026-07-10", "endWorkDate": "2026-07-16", "pubDate": "2026-07-22", "mediumURL": "", "liPubDate": "2026-07-22", "linkedinURL": "https://www.linkedin.com/pulse/weekly-ship-052-mechanism-memory-christian-crumlish-ysw0c/", "canonicalSite": "distributed", "blogURL": "https://pipermorgan.ai/shipping-news/weekly-ship-052-the-mechanism-not-the-memory/", "blogPath": "/shipping-news/weekly-ship-052-the-mechanism-not-the-memory", "cartoon": "", "chatDate": "", "draftPath": "docs/public/comms/drafts/published/weekly-ship-052-draft-2026-07-19.md", "notes": "PM voice-pass via admin UI 2026-07-22: changed the shared-workspace collision from 'two workers' to 'three,' added a causal parenthetical (root cause behind the provisioning-layer symptom -- PM confirmed direct knowledge, sourced correctly), embedded a highlight image (The Migration Wave art) in External Relations. Comms full review same day: added standard Ship frontmatter (piper-ship.png + established alt text, matching every prior published Ship). Caught and fixed a real internal inconsistency -- the opening paragraph still said 'Two sessions' while the body correctly said 'Three workers' -- verified 'three' is accurate against primary logs (Exec+CIO+PPM confirmed sharing one worktree directory, per Jul 19 logs) and fixed the opening to match. Checked both 'PM' third-person references per PM's request -- both genuinely }
const dates = Object.keys(byDate).sort();
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
const todayStr = new Date().toISOString().slice(0,10);
// default to current month if in range, else latest post month
let cur;
{ const t = new Date(); cur = {y:t.getFullYear(), m:t.getMonth()};
  if (dates.length) { const last = dates[dates.length-1]; const first = dates[0];
    const tk = ymd(cur.y,cur.m,1);
    if (tk < first.slice(0,7)+"-01") cur = {y:+first.slice(0,4), m:+first.slice(5,7)-1};
    if (tk > last.slice(0,7)+"-01") cur = {y:+last.slice(0,4), m:+last.slice(5,7)-1};
  }
}
let selected = null;
const cal = document.getElementById("cal"), detail = document.getElementById("detail"), monthLabel = document.getElementById("monthLabel");
function statusOf(p){ const s=(p.status||"").toLowerCase(); if(s==="distributed") return "published"; return ["published","queued","drafted"].includes(s)?s:"drafted"; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderMonth(){
  monthLabel.textContent = MONTHS[cur.m] + " " + cur.y;
  const first = new Date(cur.y, cur.m, 1), startDow = first.getDay();
  const days = new Date(cur.y, cur.m+1, 0).getDate();
  let html = "<table><thead><tr>" + ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<th>${d}</th>`).join("") + "</tr></thead><tbody><tr>";
  for (let i=0;i<startDow;i++) html += '<td class="empty"></td>';
  for (let d=1; d<=days; d++) {
    const key = ymd(cur.y, cur.m, d);
    const posts = byDate[key] || [];
    const cls = [(key===todayStr?"today":""), (key===selected?"sel":"")].filter(Boolean).join(" ");
    html += `<td class="${cls}" data-key="${key}"><span class="daynum">${d}</span>`;
    for (const p of posts) html += `<span class="chip ${statusOf(p)}" title="${esc(p.title)}">${esc(p.title)}</span>`;
    html += "</td>";
    if ((startDow + d) % 7 === 0 && d !== days) html += "</tr><tr>";

  const cells = (startDow + days); const rem = (7 - (cells % 7)) % 7;

}
function renderDetail(key){

  }
