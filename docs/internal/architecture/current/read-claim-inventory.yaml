# Read-claim inventory (#2151 step 1)
#
# One row per surface that can tell a user something about their own data.
# The ROW SET is derived from code by scripts/read_claim_inventory.py (it exits 1
# on a missing or stale row and 2 on a zero count); this file holds only the
# classification. See the script's docstring for the four sources (rail, legacy,
# floor, route).
#
# states: for each of the five states, one of
#   distinct          the reply path tells this state apart with its own honest wording
#   conflated:<s>     it renders as state <s> (failed shown as verified-empty = conflated:verified)
#   n/a               cannot occur on this surface (reason in notes)
#   unknown           not used here: an unclassifiable row is red with "unverified: ..."
# verdict: green (no conflation) | red (a conflation that can mislead the user about
#   their own data) | exempt (with reason)
#
# Cross-cutting facts the rows cite (all source reads, 2026-10-23):
#   RAIL-FALLTHROUGH  workflow_dispatcher.dispatch_workflow catches any exception
#                     from an entry point and returns None; _dispatch_action_rail then
#                     returns _RailOutcome(on_rail=True) with no result and the turn
#                     falls through to category routing (QUERY -> _handle_generic_query
#                     -> the floor). A handler with no try of its own therefore turns a
#                     failed read into a floor answer that never saw the read.
#                     FIXED 2026-10-23 for READ entries (Lead): the chat rail passes
#                     raise_errors=True and renders CXO's couldn't-check template from
#                     services/intent_service/rail_read_failure.py. WRITE/DESTRUCTIVE
#                     entries and NO_USER_DATA_READ ones still fall through. Rows citing
#                     RAIL-FALLTHROUGH stay red until re-verified by the step-2 forcing test.
#   ISS-STATUS        IntegrationStatusService.get_status -> get_config_status: each
#                     per-integration credential lookup is wrapped in `except Exception:
#                     pass`, so a keychain/DB failure reads "not_configured"; the outer
#                     "unknown" status also maps to configured=False. Env credentials
#                     (GITHUB_TOKEN, SLACK_BOT_TOKEN, NOTION_API_KEY, GOOGLE_CALENDAR_
#                     CREDENTIALS / MCP_ENABLED) count as THIS user's connection (via=env).
#   ENV-REPO          repo_resolver.resolve_repo path 3: PIPER_DEFAULT_REPO (a host-wide
#                     env var) resolves when the user has no default; replies built on it
#                     do not name the repo. Whether the alpha host sets it: unverified.
#   GH-NONSTRICT      GitHubIntegrationRouter.get_open_issues / get_recent_issues and
#                     GitHubMCPSpatialAdapter.list_github_issues_direct (non-strict) return
#                     [] on any error and on an unresolved repo.
#   NOTION-SEARCH     NotionMCPAdapter.search_notion returns [] on any exception.
#   TODO-CAP          TodoManagementService.list_todos reads TodoRepository.get_todos_by_
#                     owner (LIMIT 100, completed rows included, ordered priority/due/
#                     created) and only then drops completed rows.
#   FLOOR-ABSENT      ContextAssembler sources outside SOURCE_FAILED_FLAGS return {} / None
#                     on error, the same as a verified empty; the floor renderer omits
#                     the line, and the aggregate "DATA CHECKS FAILED" directive only
#                     rides when a registered flag is armed. What the model says over
#                     the gap is LLM-mediated and was not served for this inventory.
#   CAL-SWALLOW       GoogleCalendarMCPAdapter swallows a failed read into []/None
#                     (get_recurring_events without last_read_error; get_temporal_summary
#                     reports success=True with events_read_established=False), and the
#                     handler reads it as an empty calendar. (Step 2's forcing test.)
#   ACTIVITY-READ-FAILED  get_recent_activity marks a failed read with read_failed, and the
#                     handler doesn't check it, so the failure computes as zero activity.
#   SWALLOW-EMPTY     the handler catches the failed read itself and renders its empty /
#                     no-record / ask-again wording with no couldn't-check signal.
#   WRITE-SWALLOW     a write's transport failure returns None below the handler and the
#                     handler reports success (comment_issue, #2152; fixed 7c13b9f8a5).
#   NO-SEAM-YET       the forcing test couldn't map the read to a seam (none today).
#
# Every KNOWN_RED tag in tests/unit/services/intent_service/test_read_claim_forcing_2151.py
# must appear in this header (Arch 10-23; pinned by that file's tag-vocabulary test).

surfaces:

# ----------------------------------------------------------------------------
