  states: {verified: distinct, failed: distinct, narrowed: n/a, not_performed: distinct, substituted: distinct}
  texts:
    substituted: "That's on the default zone ({user_tz}) — set yours under Settings → Preferences ..."
    failed: "⚠️ Note: Calendar data unavailable right now."
  verdict: green
  notes: >-
    The default zone is named when it is used. Shallow below the handler:
    user_timezone_name and the calendar router were not traced. STEP 2 (forcing test, 2026-10-23): a failed calendar read returned success=True with events_read_established=False and the reply said "(No meetings - great day for deep work!)" (CAL-SWALLOW). FIXED 2ea350c054: it says it couldn't check.

