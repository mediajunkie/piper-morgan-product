  handler: services/intent/intent_service.py:IntentService._handle_changes_query
  states: {verified: distinct, failed: distinct, narrowed: distinct, not_performed: distinct, substituted: n/a}
  texts:
    verified: CHANGES_NOTHING_NEW / CHANGES_FOUND_OPENER (name the three sources and that GitHub was not checked)
    failed: CHANGES_READ_FAILED_ALL, CHANGES_READ_FAILED_BESIDE_ROWS, CHANGES_NOTHING_NEW_SOME_FAILED
  verdict: green
  notes: >-
    The #2143/#2140 fail-closed shape: each of the three reads tracks its own failure. The
    window is named in every reply. Owner-scoped DB reads, no global fallback.

- id: get_current_time
