- id: update_document
  kind: rail
  effect: WRITE
  reads: Notion page search by title, before appending
  handler: services/intent/intent_service.py:IntentService._handle_update_document_notion
  states: {verified: distinct, failed: conflated:verified, narrowed: distinct, not_performed: distinct, substituted: conflated:verified}
  texts:
    verified: "No document found matching '{doc_name}'. Please try a different name or ..."
    failed: same as verified-empty (NOTION-SEARCH)
    not_performed: is_available gate has its own not-connected text
  verdict: red
  notes: >-
    A WRITE that first reads. A failed Notion search returns [] (NOTION-SEARCH) and the
    reply says no document matches. NotionIntegrationRouter.connect_for_user falls back to
    connect()'s legacy static/env resolution when the user's key lookup raises, so the
    search can run against the deployment's workspace (substituted). Read: handler message
    sites, connect_for_user, adapter search_notion; not the append path.

- id: changes_query
  kind: rail
