# Inversion Phase-2.1 ARMED-STATE corpus extension (#1595) — HAND-AUTHORED.
#
# Why a separate file (not rows in inversion_corpus_phase0.yaml):
#   (a) the phase0 file is GENERATED and its builder dedupes by phrase key —
#       each armed row here has a same-text stateless CONTROL twin, which the
#       builder would silently merge;
#   (b) scripts/inversion_phase1_shadow_score.py compares per-category match
#       counts against a frozen PHASE0_BASELINE dict — adding asserted rows
#       to phase0 categories would silently shift every denominator and
#       corrupt rerun comparability;
#   (c) Phase 2.1's instruction: preserve every existing row untouched.
#
# Row format (superset of the phase0 format):
#   pair:      links an armed row to its stateless control twin (same phrase)
#   condition: armed | control
#   expected:  action:<canonical> | category:<NAME> | route:NONE |
#              route:CLARIFY | flow:<canonical> | REVIEW
#     flow:<canonical> — BINDING-TO-FLOW (#1663 Arch ruling, option (b),
#     ratified 2026-08-19): the expected emission on an armed ANSWER-turn
#     is the ARMED FLOW'S OWN completing operation, args in hand. Phase
#     2.2's dispatch treats "router-selected operation == the armed flow's
#     own action" as binding to the flow — the offer seam consumes the
#     emission; it is NEVER a fresh dispatch. A non-matching emission on
#     an armed turn falls to the seam's existing re-ask, never to the
#     floor. Scored alias-aware, same as action:. Required condition
#     (Arch, same ruling): before wiring each flow's binding, confirm
#     PER FLOW (not assumed transitively) that the flow's arm-time
#     question is an adequate confirmation for the EffectClass tier of
#     its completing operation.
#     route:NONE — the correct ROUTING decision is the NONE sentinel: the
#     turn does NOT answer the armed question (an aside, or prose no
#     catalog operation covers), so no fresh operation may claim it and
#     there is nothing to bind. HISTORY: before the #1663 ruling this file
#     asserted route:NONE on answer-turns too (reading the serialized
#     RULE's "routes to that flow's handler, not to a fresh operation" as
#     demanding the sentinel, the seam not being a catalog entry). The
#     2.1 gate run of 2026-08-19 was scored that way — 1/7 with-snapshot.
#     The ruling chose the flow-matching reading; the same recorded
#     emissions re-score 6/7. Both readings stay legible in the gate
#     doc's #1663 addendum (inversion-phase2-gate-2026-08-19.md).
#   fixture:   optional; keys are EXACTLY SessionSnapshot field names
#     (services/intent_service/session_snapshot.py). The runner constructs
#     the real dataclass — SessionSnapshot(**fixture) — and serializes via
#     serialize_for_prompt(); an unknown key fails loudly at load time.
#
# HONESTY NOTE on pending_offer_question (m-43): live assembly
# (snapshot_assembly.py) currently yields question=None for most kinds —
# arm sites store `summary`, not their rendered ask (see the assembly module
# docstring). The fixtures below carry the ask copy the user ACTUALLY SAW in
# each incident (quoted from the arm site's own question-copy functions), so
# this run measures the contract as designed for Phase 2.2 threading —
# where arm sites carry their rendered ask. The gate doc states this gap.
#
# Every phrase below is a live-incident verbatim (source cited per row);
# nothing is invented.
corpus:
  # ── pair 1: reminder-clear verb question (#1605, PM live 2026-08-15 v53) ──
  # The exception-clause fallback asked "mark done or delete?"; PM's bare
  # answer "delete" fell past the seam to the floor's canned denial
  # (pinned: test_reminder_clear_verb_1605.py TestExceptionClauseAnswerBinding).
  - phrase: "delete"
    pair: verb-question
    condition: armed
    category: TEMPORAL
    expected: flow:delete_todo
    source: "PM live 2026-08-15 v53 (#1605 exception-clause fallback; test_reminder_clear_verb_1605.py)"
    notes: "bare verb ANSWERS the armed either/or question — BINDING-TO-FLOW (#1663 ruling): the reminder-clear flow's delete branch completes via delete_todo (todo-domain deletes canonicalize there — action_registry (DELETE, reminder) cell, #1666 family); binding args: verb=delete, the targeted reminders held by the flow. A FRESH delete dispatch is still the theft — binding vs fresh is the ruling's whole distinction. WIRING NOTE: Arch's ruling (2026-08-19) marked this row's binding BLOCKED on #1666 (delete_todo then had no WorkflowEntry, never reached consent_gate); #1666 closed 2026-08-20 (run_delete_todo_workflow, DESTRUCTIVE, #1190-gated) — the per-flow confirmation-adequacy check remains required before wiring, per the ruling's condition"
    fixture:
      pending_offer_kind: reminder_clear_verb_question
      pending_offer_question: "Before I touch these — when you say 'clear' on a reminder, do you want me to mark it done, or delete it? I'll remember for next time."
      pending_offer_is_confirm: false
  - phrase: "delete"
    pair: verb-question
    condition: control
    category: TEMPORAL
    expected: REVIEW
    source: "control twin of the #1605 v53 armed row (same text, no fixture)"
    notes: "stateless bare verb has no single right route; the router's answer is recorded as data"

  # ── pair 2: delete-confirm armed, PM types an ASIDE (#1650, PM live 08-18) ──
  # With 'Got it — delete the reminder instead? (yes/no)' armed, PM's aside
  # was accepted as a confirm off the '^please\s' accept row and the delete
  # FIRED. The router must route the words, not the flow's expectation:
  # the aside is neither an answer nor a catalog operation.
  - phrase: "please note that I'll need to figure out later why you thought I wanted you to delete a project."
    pair: confirm-aside
    condition: armed
    category: TEMPORAL
    expected: route:NONE
    source: "PM live 2026-08-18 (#1650 aside accepted a delete confirm; ~95 chars under the #1631 floor)"
    notes: "risk both ways: 'delete a project' baits manage_portfolio; the armed confirm baits treating it as an answer. UNCHANGED by the #1663 ruling: the aside does not ANSWER the armed confirm, so there is nothing to bind — route:NONE remains the honest emission (flow: applies only to answer-turns)"
    fixture:
      pending_offer_kind: reminder_clear_delete_confirmation
      pending_offer_question: "Got it — delete the reminder instead? (yes/no)"
      pending_offer_is_confirm: true
  - phrase: "please note that I'll need to figure out later why you thought I wanted you to delete a project."
    pair: confirm-aside
    condition: control
    category: TEMPORAL
    expected: route:NONE
    source: "control twin of the #1650 armed row (same text, no fixture)"
    notes: "stateless it is still prose no catalog operation covers; asserted NONE both ways — this pair tests robustness, not delta"

  # ── pair 3: draft armed, file-command variant (#1648 instance 1, 08-18) ──
  # Draft armed on the #1571 carrier; PM said 'file as is thanks'; the
  # file-command detector missed the variant, the turn routed away, and the
  # floor roleplayed a phantom filing across four turns (zero writes).
  - phrase: "file as is thanks"
    pair: draft-file-command
    condition: armed
    category: EXECUTION
    expected: flow:create_issue
    source: "PM live 2026-08-18 (#1648 instance 1 — phantom 'Filed in test-piper-morgan'; zero writes verified)"
    notes: "the command ANSWERS the ARMED draft's open question — BINDING-TO-FLOW (#1663 ruling): the drafted-issue flow's completing operation is create_issue, filing the draft the carrier holds; binding args: file-as-is (no body change), draft content held by the flow. A FRESH create_issue would file nothing the carrier holds — binding vs fresh is the ruling's whole distinction. Draft title untitled: the incident record does not carry the draft's title (#1630 subjectless arm renders '(untitled)')"
    fixture:
      pending_offer_kind: drafted_issue
      pending_offer_question: "What should the body say? Give me the prose and I'll draft it — or say 'file it as is'."
      pending_offer_is_confirm: false
      draft_in_compose: true
  - phrase: "file as is thanks"
    pair: draft-file-command
    condition: control
    category: EXECUTION
    expected: REVIEW
    source: "control twin of the #1648 instance-1 armed row (same text, no fixture)"
    notes: "stateless 'file as is thanks' has no referent; the router's answer is recorded as data"

  # ── pair 4: draft body question open, prose answer (#1627, PM live 08-15) ──
  # Verbatim PM_BODY_PROSE pinned in test_drafted_issue_body_steal_1627.py:
  # the greedy portfolio pattern claimed it ("I couldn't find a project
  # called '(a destructive action)…'") and the composed body was lost.
  - phrase: "The problem: deleting a project (a destructive action) happens immediately — if you delete the wrong one there's no confirmation step, no undo, and no summary of what will be lost. The body should ask for a confirmation dialog before any deletion, and suggest archiving as the safer default."
    pair: draft-body-prose
    condition: armed
    category: EXECUTION
    expected: flow:create_issue
    source: "PM live 2026-08-15 round 2 (#1627; PM_BODY_PROSE pinned in test_drafted_issue_body_steal_1627.py)"
    notes: "prose ANSWERS the draft's open body question — BINDING-TO-FLOW (#1663 ruling): the drafted-issue flow's completing operation is create_issue (body = this prose, title/draft held by the flow); 'delete the wrong one' baits the #1527 pattern family. The 2.1 gate run's with-snapshot emission was update_document @0.95 — NOT the flow's operation, so this row stays a MISS under the flow-binding reading (the one non-matching pick; a drafted issue is not a document)"
    fixture:
      pending_offer_kind: drafted_issue
      pending_offer_question: "What should the body say? Give me a sentence or two and I'll draft it."
      pending_offer_is_confirm: false
      draft_in_compose: true
      draft_title: "the project deletion flow"
  - phrase: "The problem: deleting a project (a destructive action) happens immediately — if you delete the wrong one there's no confirmation step, no undo, and no summary of what will be lost. The body should ask for a confirmation dialog before any deletion, and suggest archiving as the safer default."
    pair: draft-body-prose
    condition: control
    category: EXECUTION
    expected: REVIEW
    source: "control twin of the #1627 armed row (same text, no fixture)"
    notes: "stateless, issue-shaped prose could defensibly route create_issue or NONE; recorded as data"

  # ── pair 5: reminder time question armed, bare time answer (#1648 inst. 2) ──
  # After the honest time-clarify ask, PM answered 'at 3pm'; the turn fell to
  # the floor which soft-offered and then FABRICATED 'Reminder set for 3pm
  # today.' (no row saved; verified by PM's 11:50 list turn).
  - phrase: "at 3pm"
    pair: reminder-time-answer
    condition: armed
    category: TEMPORAL
    expected: flow:create_reminder
    source: "PM live 2026-08-18 (#1648 instance 2 — phantom reminder after the time-clarify exchange)"
    notes: "the fragment ANSWERS the armed time question — BINDING-TO-FLOW (#1663 ruling): the reminder-time flow's completing operation is create_reminder; binding args: time='3pm', task text held by the flow. A FRESH create_reminder would lose the task — binding vs fresh is the ruling's whole distinction"
    fixture:
      pending_offer_kind: reminder_time_question
      pending_offer_question: "I caught the task — but couldn't work out the time. When should I remind you? (For example: 'at 3pm tomorrow' or 'in 2 hours'.)"
      pending_offer_is_confirm: false
  - phrase: "at 3pm"
    pair: reminder-time-answer
    condition: control
    category: TEMPORAL
    expected: REVIEW
    source: "control twin of the #1648 instance-2 armed row (same text, no fixture)"
    notes: "stateless bare time fragment has no right answer; recorded as data"

  # ── pair 6: standup's own todo offer armed, acceptance turn (#1651, 08-18) ──
  # The standup's closing copy offered to mark the overdue todo done; PM's
  # acceptance re-stated the offer's own words and handle_complete_todo's
  # extraction failed on 'overdue' ("I couldn't find a todo matching
  # 'overdue'") — teach-then-deny.
  - phrase: "Yes mark the overdue todo done."
    pair: standup-todo-offer
    condition: armed
    category: EXECUTION
    expected: flow:complete_todo
    source: "PM live 2026-08-18 (#1651 — the standup could not consume its own offer; todo_handlers.py:568)"
    notes: "acceptance ANSWERS the ARMED offer — BINDING-TO-FLOW (#1663 ruling): the standup-todo-offer flow's completing operation is complete_todo, with the todo id bound by the flow; a FRESH complete_todo re-extracts 'overdue' and fails (#1651's failure, one layer down — m-43)"
    fixture:
      pending_offer_kind: standup_todo_offer
      pending_offer_question: "Also: your todo \"check in with the lead developer\" is overdue. Want me to mark \"check in with the lead developer\" done? (yes/no)"
      pending_offer_is_confirm: false
  - phrase: "Yes mark the overdue todo done."
    pair: standup-todo-offer
    condition: control
    category: EXECUTION
    expected: action:complete_todo
    source: "control twin of the #1651 armed row (same text, no fixture)"
    notes: "stateless this IS a completion command at the routing layer (#1651's failure was extraction, one layer down — m-43); the sharpest delta pair: same words, different correct route by armed state"

  # ── pair 7: repo question armed, natural-phrasing answer (#1567, 08-16) ──
  # The 'repository not specified' refusal armed the repo question; PM's
  # natural answer 'in the test-Piper-Morgan repository' was never extracted
  # and the flow dead-ended.
  - phrase: "in the test-Piper-Morgan repository"
    pair: repo-question-answer
    condition: armed
    category: QUERY
    expected: flow:create_issue
    source: "PM live (#1567 repo clarification dead-end; dev/2026/08/16/2026-08-16-2251-prog-code-log.md)"
    notes: "ANSWERS the armed repo question — BINDING-TO-FLOW (#1663 ruling): the repo-clarification flow completes the PENDING create_issue (its held draft plus binding arg repo=test-Piper-Morgan); a FRESH create_issue off a bare prepositional fragment is exactly the danger the seam's validation makes structurally impossible. is_confirm=false since issue 1664: live assembly now derives confirm-ness from the offer KIND (destructive_confirm.offer_is_confirm), and the OPEN repo question is not a yes/no — the 2.1 gate ran this row with is_confirm=true (then faithful to the workflow_type-derived live assembly; wrinkle flagged in the gate doc), so a rerun's condition differs here by design"
    fixture:
      pending_offer_kind: issue_repo_question
      pending_offer_question: "Which repository should I use? Give me the owner/name (like octocat/hello-world) — or just the repo name and I'll find it among your repositories."
      pending_offer_is_confirm: false
  - phrase: "in the test-Piper-Morgan repository"
    pair: repo-question-answer
    condition: control
    category: QUERY
    expected: REVIEW
    source: "control twin of the #1567 armed row (same text, no fixture)"
    notes: "stateless prepositional fragment has no right answer; recorded as data"
